<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YAD Store - Top Up Game & Pulsa Termurah</title>
    <meta name="description" content="YAD Store - Top up game, pulsa, paket data, token listrik, voucher, dan e-wallet termurah.">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root{--bg:#0a0a14;--bg-card:#12122a;--bg-hover:#1a1a35;--bg-input:#0d0d20;--text:#e8e8f0;--text-dim:#9090a8;--accent:#8b5cf6;--accent2:#06b6d4;--gold:#f59e0b;--green:#10b981;--red:#ef4444;--pink:#ec4899;--border:#252540;--radius:14px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
        
        /* Header */
        .header{background:rgba(10,10,20,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:12px;flex-wrap:wrap}
        .logo{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .nav-links{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
        
        /* Buttons */
        .btn{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:11px;font-weight:600;transition:all 0.3s;font-family:inherit;white-space:nowrap}
        .btn:hover{background:var(--bg-hover);border-color:var(--accent);transform:translateY(-1px)}
        .btn:active{transform:translateY(0)}
        .btn-primary{background:linear-gradient(135deg,var(--accent),var(--pink));color:white;border:none;box-shadow:0 4px 15px rgba(139,92,246,0.3)}
        .btn-primary:hover{box-shadow:0 6px 20px rgba(139,92,246,0.5)}
        .icon-btn{background:transparent;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:4px;transition:all 0.2s}
        .icon-btn:hover{color:var(--text);background:var(--bg-hover)}
        
        /* Activity Bar */
        .activity-bar{background:#0d0d15;border-bottom:1px solid var(--border);padding:8px 16px;font-size:10px;color:var(--text-dim);display:flex;gap:20px;overflow:hidden;white-space:nowrap;flex-wrap:wrap}
        .dot-live{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block;animation:blink 2s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
        
        /* Container */
        .container{max-width:1200px;margin:0 auto;padding:20px}
        
        /* Floating buttons */
        .floating-ai{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));color:white;border:none;cursor:pointer;font-size:24px;z-index:400;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(139,92,246,0.4);animation:float 3s ease-in-out infinite;transition:all 0.3s}
        .floating-ai:hover{transform:scale(1.1)}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        
        .whatsapp-float{position:fixed;bottom:24px;left:24px;width:56px;height:56px;background:#25D366;color:white;border-radius:50%;text-align:center;font-size:28px;box-shadow:0 8px 32px rgba(37,211,102,0.4);z-index:400;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:all 0.3s}
        .whatsapp-float:hover{transform:scale(1.1)}
        
        /* AI Chat Widget */
        .ai-chat-widget{position:fixed;bottom:90px;right:20px;width:420px;max-width:92vw;z-index:450;background:var(--bg-card);border-radius:var(--radius);border:2px solid var(--accent);overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.6);display:none;flex-direction:column;max-height:80vh}
        .ai-chat-widget.show{display:flex}
        .ai-chat-header{padding:12px 16px;background:linear-gradient(135deg,var(--bg-hover),var(--bg-card));cursor:pointer;display:flex;justify-content:space-between;font-weight:700;font-size:14px;border-bottom:1px solid var(--border)}
        .ai-chat-body{display:flex;flex-direction:column;overflow:hidden}
        .ai-chat-body.hidden{display:none}
        .ai-chat-messages{height:300px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
        .ai-msg{padding:8px 12px;border-radius:12px;font-size:12px;line-height:1.5;background:var(--bg-input);max-width:90%;word-break:break-word;animation:msgIn 0.3s ease}
        @keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .ai-msg.user{background:linear-gradient(135deg,var(--accent),var(--pink));color:white;margin-left:auto}
        .ai-msg.system{background:var(--bg-hover);color:var(--accent2);text-align:center;font-size:10px;max-width:100%}
        
        .ai-chat-input-area{padding:10px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--bg-input)}
        .ai-chat-input-area input{flex:1;padding:10px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:12px;outline:none;font-family:inherit;transition:all 0.3s}
        .ai-chat-input-area input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(139,92,246,0.2)}
        .ai-chat-input-area button{background:var(--accent);color:white;border:none;padding:10px 16px;border-radius:20px;cursor:pointer;font-size:14px;transition:all 0.3s}
        .ai-chat-input-area button:hover{background:var(--pink)}
        .voice-btn{background:transparent!important;color:var(--text)!important;padding:10px!important;font-size:16px!important}
        
        /* Quick Edit Bar */
        .quick-edit-bar{padding:10px;background:var(--bg-input);border-top:1px solid var(--border);display:none}
        .edit-title{font-size:11px;font-weight:700;color:var(--text-dim);margin-bottom:8px;text-transform:uppercase}
        .quick-edit-btn{padding:6px 10px;margin:3px;font-size:10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-hover);color:var(--text);cursor:pointer;font-family:inherit;transition:all 0.2s}
        .quick-edit-btn:hover{background:var(--accent);color:white;border-color:var(--accent)}
        
        /* Fit Dropdown */
        .fit-btn{background:linear-gradient(135deg,#8b5cf6,#ec4899)!important;color:#fff!important;border:none!important;font-weight:700!important;display:none}
        .fit-dropdown{position:fixed;top:60px;right:20px;z-index:9999;background:#1a1a2e;border-radius:12px;border:2px solid #8b5cf6;box-shadow:0 20px 60px rgba(139,92,246,0.5);min-width:250px;overflow:hidden}
        .fit-dropdown.show{display:block}
        .fit-dropdown-header{padding:14px 16px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-bottom:1px solid #252540;font-weight:700;font-size:14px;color:#fff;display:flex;justify-content:space-between;align-items:center}
        .fit-dropdown-body{padding:8px}
        .fit-dropdown-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:8px;cursor:pointer;font-size:12px;color:#e8e8f0;border:none;background:transparent;width:100%;text-align:left;font-family:inherit;transition:all 0.2s}
        .fit-dropdown-item:hover{background:#252540;padding-left:16px}
        .fit-dropdown-item.add{border-left:3px solid #10b981}
        .fit-dropdown-item.list{border-left:3px solid #06b6d4}
        .fit-dropdown-item.delete{border-left:3px solid #ef4444}
        .fit-dropdown-item.filemanager{border-left:3px solid #f59e0b}
        
        /* Fit Panel */
        .fit-panel{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);z-index:99999;display:none;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
        .fit-panel.show{display:flex}
        .fit-panel-dialog{background:#1a1a2e;border-radius:16px;border:2px solid #8b5cf6;width:95vw;max-width:650px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;animation:slideUp 0.3s ease}
        @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .fit-panel-header{padding:16px 20px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-bottom:1px solid #252540;display:flex;justify-content:space-between;align-items:center}
        .fit-panel-body{padding:20px;overflow-y:auto}
        .fit-panel-body label{display:block;color:#9090a8;font-size:11px;font-weight:600;margin-bottom:4px;text-transform:uppercase}
        .fit-panel-body input,.fit-panel-body textarea,.fit-panel-body select{width:100%;padding:10px;background:#0d0d20;border:1px solid #252540;border-radius:8px;color:#e8e8f0;font-size:13px;margin-bottom:12px;outline:none;font-family:inherit;resize:vertical;transition:all 0.3s}
        .fit-panel-body input:focus,.fit-panel-body textarea:focus,.fit-panel-body select:focus{border-color:var(--accent)}
        .fit-panel-footer{padding:12px 20px;background:#0d0d20;border-top:1px solid #252540;display:flex;gap:8px;justify-content:flex-end}
        
        /* List items */
        .fit-list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#0d0d20;border-radius:6px;margin-bottom:6px;font-size:11px}
        .fit-list-del{background:#ef4444;color:#fff;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:10px}
        
        /* Category tabs */
        .category-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
        .cat-tab{padding:10px 20px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-family:inherit;transition:all 0.3s}
        .cat-tab:hover{background:var(--bg-hover);color:var(--text)}
        .cat-tab.active{background:linear-gradient(135deg,var(--accent),var(--pink));color:white;border-color:var(--accent);box-shadow:0 4px 15px rgba(139,92,246,0.3)}
        
        /* Game grid */
        .game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
        .game-card{background:var(--bg-card);border-radius:var(--radius);padding:20px;border:1px solid var(--border);cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden}
        .game-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--pink));opacity:0;transition:opacity 0.3s}
        .game-card:hover::before{opacity:1}
        .game-card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
        .game-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
        .game-icon{font-size:40px}
        .game-name{font-size:16px;font-weight:700}
        .game-developer{font-size:10px;color:var(--text-dim)}
        
        .item-list{display:flex;flex-direction:column;gap:8px}
        .item-row{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--bg-input);border-radius:8px;font-size:12px;cursor:pointer;transition:all 0.2s;border:1px solid transparent}
        .item-row:hover{background:var(--bg-hover);border-color:var(--accent)}
        .item-price{font-weight:700;color:var(--gold)}
        
        /* Order section */
        .order-section{background:var(--bg-card);border-radius:var(--radius);padding:24px;margin:20px 0;border:1px solid var(--border)}
        .form-group{margin:10px 0}
        .form-group label{display:block;font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:4px;text-transform:uppercase}
        .form-group input,.form-group select{width:100%;padding:12px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:all 0.3s}
        .form-group input:focus,.form-group select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(139,92,246,0.2)}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        
        .payment-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin:12px 0}
        .payment-card{background:var(--bg-input);border:2px solid var(--border);border-radius:10px;padding:16px;text-align:center;cursor:pointer;font-size:12px;transition:all 0.3s}
        .payment-card:hover{border-color:var(--accent);transform:translateY(-2px)}
        .payment-card.selected{border-color:var(--accent);background:var(--bg-hover);box-shadow:0 4px 15px rgba(139,92,246,0.3)}
        
        .total-box{background:var(--bg-input);padding:16px;border-radius:8px;margin:16px 0;border:1px solid var(--border)}
        
        /* Live feed */
        .live-feed{background:var(--bg-card);border-radius:var(--radius);padding:16px;margin:20px 0;border:1px solid var(--border);max-height:200px;overflow-y:auto}
        .live-item{padding:6px 0;border-bottom:1px solid var(--border);font-size:11px;color:var(--text-dim);animation:slideIn 0.3s ease}
        @keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
        
        /* Toast */
        .toast-container{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:600;width:90%;max-width:400px}
        .toast{padding:12px 20px;border-radius:20px;color:white;font-size:11px;font-weight:600;animation:toastIn 0.3s ease;margin-bottom:8px;box-shadow:0 4px 15px rgba(0,0,0,0.3);text-align:center}
        @keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
        .toast.success{background:var(--green)}
        .toast.error{background:var(--red)}
        .toast.info{background:var(--accent2)}
        
        .hidden{display:none!important}
        
        .loading-spinner{display:inline-block;width:20px;height:20px;border:3px solid var(--bg-hover);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        
        /* Console Panel */
        .console-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:95vw;max-width:800px;max-height:85vh;background:#0d0d15;border-radius:16px;border:2px solid #00ff00;z-index:999998;display:none;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.9)}
        .console-panel.show{display:flex}
        .console-header{padding:16px 20px;background:#000;border-bottom:1px solid #00ff00;display:flex;justify-content:space-between;align-items:center}
        .console-header h3{color:#00ff00;font-size:16px;margin:0}
        .console-tabs{display:flex;gap:4px;padding:10px;background:#0d0d15;border-bottom:1px solid #252540}
        .console-tab{color:#666;border-color:#333}
        .console-tab.active{color:#00ff00;border-color:#00ff00;background:#1a1a2e}
        .console-content{flex:1;overflow-y:auto;padding:16px;font-family:monospace;font-size:12px;color:#00ff00;background:#000;min-height:300px;max-height:400px}
        .console-input-row{padding:12px;background:#0d0d15;border-top:1px solid #252540;display:flex;gap:8px}
        .console-input-row input{flex:1;padding:10px 14px;background:#000;border:1px solid #00ff00;border-radius:6px;color:#00ff00;font-size:12px;font-family:monospace;outline:none}
        .console-input-row button{padding:10px 20px;background:#00ff00;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:bold}
        
        /* Responsive */
        @media(max-width:768px){
            .form-row{grid-template-columns:1fr}
            .header{padding:10px}
            .nav-links{gap:4px}
            .btn{padding:6px 12px;font-size:10px}
        }
    </style>
</head>
<body>

    <script>
    // ================================================================
    // CORE CONFIG
    // ================================================================
    const firebaseConfig={apiKey:"AIzaSyAvfHxcAT2syVbrf6-TU0JBRXtNLI0AIkc",authDomain:"yadstores.firebaseapp.com",projectId:"yadstores",storageBucket:"yadstores.firebasestorage.app",messagingSenderId:"666352014774",appId:"1:666352014774:web:159ab5b455efb2fb2f9d17"};
    firebase.initializeApp(firebaseConfig);
    const auth=firebase.auth(),fs=firebase.firestore(),googleProvider=new firebase.auth.GoogleAuthProvider();
    googleProvider.setCustomParameters({prompt:'select_account'});
    const GITHUB_CONFIG=JSON.parse(localStorage.getItem('github_config')||'{"token":"","owner":"","repo":"","branch":"main","enabled":false}');

    // ================================================================
    // UTILITY
    // ================================================================
    function toast(m,t){t=t||'info';var c=document.getElementById('toastContainer');if(c){var d=document.createElement('div');d.className='toast '+t;d.textContent=m;c.appendChild(d);setTimeout(function(){d.style.opacity='0';setTimeout(function(){d.remove();},300);},3000);}}
    function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function unescapeHtml(s){return String(s||'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');}
    function generateOrderId(){return 'YAD-'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).substring(2,5).toUpperCase();}
    function safeEval(code){try{return new Function(code)();}catch(e){console.error('Eval error:',e);return null;}}

    // ================================================================
    // STATE
    // ================================================================
    const S={
        user:null,
        admin:false,
        orders:JSON.parse(localStorage.getItem('store_orders')||'[]'),
        paymentMethods:JSON.parse(localStorage.getItem('store_payments')||'[]'),
        markup:parseInt(localStorage.getItem('store_markup')||'30'),
        selectedPayment:null,
        currentCategory:'all',
        features:JSON.parse(localStorage.getItem('yad_features_manifest')||'[]')
    };

    if(!S.paymentMethods.length){
        S.paymentMethods=[
            {name:'DANA',number:'083170617054',holder:'YAD Store'},
            {name:'GoPay',number:'083170617054',holder:'YAD Store'},
            {name:'Seabank',number:'901825485120',holder:'Karyadi'}
        ];
        localStorage.setItem('store_payments',JSON.stringify(S.paymentMethods));
    }

    function calcPrice(p){return Math.round(p*(1+S.markup/100));}

    // ================================================================
    // PRODUCTS
    // ================================================================
    const ALL_PRODUCTS={
        game:[
            {id:'ml',name:'Mobile Legends',icon:'👑',dev:'Moonton',items:[['3 Diamonds',1500],['5 Diamonds',2000],['11 Diamonds',3500],['22 Diamonds',6500],['56 Diamonds',13000],['86 Diamonds',20000],['172 Diamonds',40000]]},
            {id:'ff',name:'Free Fire',icon:'🔥',dev:'Garena',items:[['5 Diamonds',1500],['12 Diamonds',3000],['50 Diamonds',8500],['70 Diamonds',12000],['140 Diamonds',23000],['355 Diamonds',56000]]},
            {id:'pubg',name:'PUBG Mobile',icon:'🔫',dev:'Tencent',items:[['30 UC',8000],['60 UC',15000],['120 UC',29000],['180 UC',43000],['300 UC',70000]]},
            {id:'gi',name:'Genshin Impact',icon:'✨',dev:'HoYoverse',items:[['60 GC',15000],['300 GC',70000],['980 GC',220000],['1980 GC',420000]]},
            {id:'valo',name:'Valorant',icon:'🎯',dev:'Riot',items:[['125 VP',22000],['420 VP',62000],['475 VP',70000],['1000 VP',140000]]}
        ],
        pulsa:[
            {id:'telkomsel',name:'Telkomsel',icon:'📱',dev:'Pulsa',items:[['5000',6500],['10000',11500],['20000',21500],['50000',51500],['100000',101500]]},
            {id:'xl',name:'XL/Axis',icon:'📱',dev:'Pulsa',items:[['5000',6500],['10000',11500],['20000',21500],['50000',51500]]}
        ],
        data:[
            {id:'telkomsel-data',name:'Telkomsel Data',icon:'📶',dev:'Data',items:[['1GB/30hr',12000],['3GB/30hr',32000],['5GB/30hr',50000],['10GB/30hr',95000]]}
        ],
        token:[
            {id:'pln',name:'Token PLN',icon:'⚡',dev:'PLN',items:[['20000',22000],['50000',52000],['100000',102000]]}
        ],
        voucher:[
            {id:'steam',name:'Steam Wallet',icon:'🎮',dev:'Valve',items:[['30000',35000],['60000',67000],['120000',132000]]},
            {id:'google',name:'Google Play',icon:'▶️',dev:'Google',items:[['50000',55000],['100000',105000]]}
        ],
        ewallet:[
            {id:'gopay',name:'GoPay',icon:'💚',dev:'Gojek',items:[['10000',11500],['20000',21500],['50000',51500]]},
            {id:'dana',name:'DANA',icon:'💙',dev:'DANA',items:[['10000',11500],['20000',21500],['50000',51500]]}
        ]
    };

    // ================================================================
    // RENDER GAMES
    // ================================================================
    function renderGames(cat){
        S.currentCategory=cat||'all';
        var p=[];
        if(S.currentCategory==='all'){
            for(var k in ALL_PRODUCTS){p=p.concat(ALL_PRODUCTS[k]);}
        }else{
            p=ALL_PRODUCTS[S.currentCategory]||[];
        }
        
        var grid=document.getElementById('gameGrid');
        if(!grid)return;
        
        grid.innerHTML=p.map(function(g){
            return '<div class="game-card" onclick="selectProduct(\''+S.currentCategory+'\',\''+g.id+'\')">'+
                '<div class="game-header">'+
                    '<span style="font-size:40px;">'+g.icon+'</span>'+
                    '<div>'+
                        '<div class="game-name">'+escapeHtml(g.name)+'</div>'+
                        '<div class="game-developer">'+g.dev+'</div>'+
                    '</div>'+
                '</div>'+
                '<div class="item-list">'+
                    g.items.slice(0,5).map(function(i){
                        return '<div class="item-row" onclick="event.stopPropagation();quickOrder(\''+escapeHtml(g.name)+'\',\''+escapeHtml(i[0])+'\',\''+i[1]+'\')">'+
                            '<span>'+escapeHtml(i[0])+'</span>'+
                            '<span class="item-price">Rp '+calcPrice(i[1]).toLocaleString('id-ID')+'</span>'+
                        '</div>';
                    }).join('')+
                '</div>'+
            '</div>';
        }).join('');
    }

    function filterCategory(c,e){
        var tabs=document.querySelectorAll('.cat-tab');
        tabs.forEach(function(t){t.classList.remove('active');});
        if(e&&e.currentTarget)e.currentTarget.classList.add('active');
        renderGames(c);

    function selectProduct(cat,id){
        var pp=ALL_PRODUCTS[cat]||[];
        var g=pp.find(function(p){return p.id===id;});
        if(!g)return;
        
        document.getElementById('orderCategory').value=cat;
        updateOrderGame(cat);
        document.getElementById('orderGame').value=g.name;
        updateOrderItems();
        showSection('order');
    }

    function quickOrder(gn,iname,price){
        document.getElementById('orderGame').value=gn;
        updateOrderItems();
        document.getElementById('orderItem').value=iname+'|'+price;
        updateTotalPrice();
        showSection('order');
    }

    function updateOrderGame(cat){
        var c=cat||document.getElementById('orderCategory').value;
        var pp=ALL_PRODUCTS[c]||[];
        var sel=document.getElementById('orderGame');
        sel.innerHTML='<option value="">Pilih Produk</option>'+pp.map(function(p){
            return '<option value="'+escapeHtml(p.name)+'">'+p.icon+' '+escapeHtml(p.name)+'</option>';
        }).join('');
    }

    function updateOrderItems(){
        var cat=document.getElementById('orderCategory').value;
        var pname=document.getElementById('orderGame').value;
        var pp=ALL_PRODUCTS[cat]||[];
        var g=pp.find(function(p){return p.name===pname;});
        var sel=document.getElementById('orderItem');
        
        if(!g){
            sel.innerHTML='<option value="">Pilih Item</option>';
            updateTotalPrice();
            return;
        }
        
        sel.innerHTML=g.items.map(function(i){
            return '<option value="'+escapeHtml(i[0])+'|'+i[1]+'">'+escapeHtml(i[0])+' - Rp '+calcPrice(i[1]).toLocaleString('id-ID')+'</option>';
        }).join('');
        updateTotalPrice();
    }

    function updateTotalPrice(){
        var v=document.getElementById('orderItem').value;
        document.getElementById('totalPrice').textContent=v?'Rp '+calcPrice(parseInt(v.split('|')[1])).toLocaleString('id-ID'):'Rp 0';
    }

    function renderPayments(){
        var grid=document.getElementById('paymentGrid');
        if(!grid)return;
        
        grid.innerHTML=S.paymentMethods.map(function(p,i){
            return '<div class="payment-card" onclick="selectPayment('+i+')" id="payCard'+i+'">'+
                '<div style="font-size:24px">🏦</div>'+
                '<b>'+escapeHtml(p.name)+'</b><br>'+
                '<small>'+escapeHtml(p.number)+'</small>'+
            '</div>';
        }).join('');
    }

    function selectPayment(i){
        S.selectedPayment=S.paymentMethods[i];
        var cards=document.querySelectorAll('.payment-card');
        cards.forEach(function(c){c.classList.remove('selected');});
        var el=document.getElementById('payCard'+i);
        if(el)el.classList.add('selected');

    function showSection(s){
        ['homeSection','orderSection','statusSection'].forEach(function(id){
            var el=document.getElementById(id);
            if(el)el.classList.add('hidden');
        });
        var target=document.getElementById(s+'Section');
        if(target)target.classList.remove('hidden');
    }

    // ================================================================
    // ORDERS
    // ================================================================
    function submitOrder(){
        try{
            var g=document.getElementById('orderGame').value;
            var iv=document.getElementById('orderItem').value;
            var uid=document.getElementById('orderUID').value.trim();
            var email=document.getElementById('orderEmail').value.trim();
            
            if(!g||!iv||!uid)return toast('❌ Lengkapi data!','error');
            if(!S.selectedPayment)return toast('❌ Pilih metode pembayaran!','error');
            
            var parts=iv.split('|');
            var t=calcPrice(parseInt(parts[1]));
            var o={
                id:generateOrderId(),
                game:g,
                item:parts[0],
                price:t,
                uid:uid,
                email:email,
                payment:S.selectedPayment,
                status:'pending',
                time:new Date().toISOString()
            };
            
            S.orders.unshift(o);
            localStorage.setItem('store_orders',JSON.stringify(S.orders));
            
            toast('✅ Pesanan berhasil!','success');
            addLive('🛒 '+g+' - '+parts[0]+' | '+o.id);
            
            alert('✅ PESANAN BERHASIL!\n\nOrder ID: '+o.id+'\nTotal: Rp '+t.toLocaleString('id-ID'));
        }catch(e){
            toast('❌ Error: '+e.message,'error');
        }
    }

    function previewProof(){
        var f=document.getElementById('paymentProof').files[0];
        if(!f)return;
        var r=new FileReader();
        r.onload=function(e){
            document.getElementById('proofPreview').innerHTML='<img src="'+e.target.result+'" style="max-width:200px;border-radius:8px">';
        };
        r.readAsDataURL(f);
    }

    function checkOrder(){
        var id=document.getElementById('checkOrderID').value.trim();
        if(!id)return;
        
        var o=S.orders.find(function(o){return o.id===id;});
        document.getElementById('orderResult').innerHTML=o?
            '<div style="background:var(--bg-input);padding:12px;border-radius:8px">'+
                '<b>'+escapeHtml(o.id)+'</b><br>'+
                o.game+' - '+o.item+'<br>'+
                'Rp '+o.price.toLocaleString('id-ID')+'<br>'+
                o.status.toUpperCase()+
            '</div>':
            '<p style="color:var(--red)">❌ Tidak ditemukan</p>';
    }

    function loadUserHistory(){
        var e=document.getElementById('historyEmail').value.trim().toLowerCase();
        if(!e)return;
        
        var oo=S.orders.filter(function(o){return o.email&&o.email.toLowerCase().includes(e);});
        document.getElementById('userOrderHistory').innerHTML=oo.length?
            oo.slice(0,10).map(function(o){
                return '<div style="background:var(--bg-input);padding:10px;margin:6px 0;border-radius:8px">'+
                    '<b>'+escapeHtml(o.id)+'</b> - '+o.status+'<br>'+
                    o.game+'<br>Rp '+o.price.toLocaleString('id-ID')+
                '</div>';
            }).join(''):

    function addLive(m){
        var f=document.getElementById('liveFeed');
        if(!f)return;
        var d=document.createElement('div');
        d.className='live-item';
        d.textContent='['+new Date().toLocaleTimeString('id-ID')+'] '+m;
        f.insertBefore(d,f.firstChild);
        if(f.children.length>15)f.removeChild(f.lastChild);
    }

    // ================================================================
    // AI CHAT
    // ================================================================
    function sendAIMsg(){
        var i=document.getElementById('aiChatInput');
        var t=i.value.trim();
        if(!t)return;
        
        var m=document.getElementById('aiChatMsgs');
        m.innerHTML+='<div class="ai-msg user">'+escapeHtml(t)+'</div>';
        i.value='';
        m.scrollTop=m.scrollHeight;
        
        var x=t.toLowerCase();
        var r='';
        
        if(t==='console'){openConsole();r='🖥️ Console dibuka!';}
        else if(t==='file manager'||t==='github file manager'){openGitHubFileManager();r='📁 File Manager dibuka!';}
        else if(['hai','halo','hi','hello'].some(function(g){return x.includes(g);}))r='Halo! 😊';
        else if(x==='help'){
            r='📚 BANTUAN:\n💬 hai, kabar\n🎮 harga, game\n🛒 cara pesan\n📋 cek pesanan [ID]\n📚 novel, profil\n📁 file manager\n'+
            (S.admin?'\n👑 ADMIN:\n🔸 konfirmasi [ID], tolak [ID]\n🔸 tambah fitur, daftar fitur\n🔸 markup [0-100]\n🔸 github setup TOKEN|USER|REPO\n🔸 push github, console':'');
        }
        else if(x.startsWith('github setup ')){
            if(!S.admin)r='🔒 Admin only!';
            else{
                var p=t.replace(/github setup\s+/i,'').split('|');
                if(p.length>=3){
                    GITHUB_CONFIG.token=p[0].trim();
                    GITHUB_CONFIG.owner=p[1].trim();
                    GITHUB_CONFIG.repo=p[2].trim();
                    GITHUB_CONFIG.branch=(p[3]||'').trim()||'main';
                    GITHUB_CONFIG.enabled=true;
                    localStorage.setItem('github_config',JSON.stringify(GITHUB_CONFIG));
                    r='✅ GitHub configured!';
                }
            }
        }
        else if(x==='push github'||x==='push'){
            if(!S.admin)r='🔒 Admin only!';
            else{
                r='📤 Mendorong...';
                setTimeout(async function(){await pushToGithub();},300);
            }
        }
        else if(x==='daftar fitur'){
            r='📦 FITUR ('+S.features.length+'):\n'+S.features.map(function(f,i){
                return (i+1)+'. '+f.name+' v'+f.version+' ['+f.status+']';
            }).join('\n');
        }
        else if(x==='tambah fitur'){openFitPanel('add');r='📝 Form tambah fitur dibuka!';}
        else r='❓ Ketik "help" untuk bantuan.';
        
        setTimeout(function(){
            m.innerHTML+='<div class="ai-msg">'+r.replace(/\n/g,'<br>')+'</div>';
            m.scrollTop=m.scrollHeight;
        },300);
    }

    var isListening=false,recognition=null;
    
    function toggleVoice(){
        if(isListening){stopVoice();}else{startVoice();}
    }
    
    function startVoice(){
        var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
        if(!SR){toast('❌ Browser tidak mendukung voice recognition','error');return;}
        
        recognition=new SR();
        recognition.lang='id-ID';
        recognition.interimResults=true;
        
        recognition.onstart=function(){
            isListening=true;
            var b=document.getElementById('voiceBtn');
            if(b){b.textContent='🔴';b.style.color='red';}
        };
        
        recognition.onresult=function(e){
            var transcript='';
            for(var i=e.resultIndex;i<e.results.length;i++){
                transcript+=e.results[i][0].transcript;
            }
            var input=document.getElementById('aiChatInput');
            if(input&&transcript){input.value=transcript;input.focus();}
        };
        
        recognition.onend=function(){stopVoice();};
        recognition.onerror=function(e){
            stopVoice();
            if(e.error==='not-allowed'){toast('❌ Izin mikrofon ditolak','error');}
        };
        
        recognition.start();
    }
    
    function stopVoice(){
        if(recognition){try{recognition.stop();}catch(e){}}
        isListening=false;
        var b=document.getElementById('voiceBtn');
        if(b){b.textContent='🎤';b.style.color='';}
    }

                '<span onclick="closeProfile()" style="cursor:pointer;font-size:22px;color:#9090a8">×</span></div>'+
                '<div class="fit-panel-body">'+
                    '<div style="text-align:center;margin-bottom:20px">'+
                        '<div style="font-size:48px">👤</div>'+
                        '<h3 id="profileName" style="color:#fff">Pengguna</h3>'+
                        '<p id="profileEmail" style="color:#9090a8;font-size:12px"></p>'+
                        '<span id="profileRole" style="padding:4px 12px;border-radius:20px;font-size:11px;font-weight:bold;background:#8b5cf6;color:#fff">👤 USER</span>'+
                    '</div>'+
                    '<div id="profileEditForm" style="display:none">'+

    function closeProfile(){
        var panel=document.getElementById('profilePanel');
        if(panel)panel.classList.remove('show');
    }
    
    function updateProfileUI(){
        var nameEl=document.getElementById('profileName');
        var emailEl=document.getElementById('profileEmail');
        var roleEl=document.getElementById('profileRole');
        
        if(S.user){
            nameEl.textContent=profileData.name||S.user.displayName||S.user.email.split('@')[0];
            emailEl.textContent=S.user.email;
            roleEl.textContent=S.admin?'👑 ADMIN':'👤 USER';
            roleEl.style.background=S.admin?'linear-gradient(135deg,#f59e0b,#d97706)':'#8b5cf6';
        }else{
            nameEl.textContent='Pengguna';
            emailEl.textContent='';
            roleEl.textContent='👤 USER';
            roleEl.style.background='#8b5cf6';
        }
    }
    
    function toggleEditProfile(){
        var form=document.getElementById('profileEditForm');
        form.style.display=form.style.display==='none'?'block':'none';
    }
    
    function saveProfile(){
        var n=document.getElementById('editName').value.trim();
        if(!n)return;
        profileData.name=n;
        localStorage.setItem('yad_profile',JSON.stringify(profileData));
        updateProfileUI();
        toggleEditProfile();
        toast('✅ Profil disimpan!','success');
    }
    
    async function handleLogin(){
        try{
            var r=await auth.signInWithPopup(googleProvider);
            S.user=r.user;
            S.admin=r.user.email==='ynuraini686@gmail.com';
            updateUI();
            updateProfileUI();
            toast('✅ Login berhasil!','success');
        }catch(e){
            if(e.code==='auth/popup-blocked'){
                await auth.signInWithRedirect(googleProvider);
            }else{
                toast('❌ Login gagal: '+e.message,'error');
            }
        }
    }
    
    async function handleLogout(){
        if(confirm('Logout?')){
            try{
                await auth.signOut();
                S.user=null;
                S.admin=false;
                updateUI();
                closeProfile();
                toast('✅ Logout berhasil!','success');
            }catch(e){
                toast('❌ Error: '+e.message,'error');
            }
        }
    }
