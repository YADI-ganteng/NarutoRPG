<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAD Video AI - GitHub Storage v13</title>
    <style>
        :root{--bg:#0a0a14;--card:#12122a;--input:#0d0d20;--text:#e8e8f0;--dim:#9090a8;--accent:#8b5cf6;--green:#10b981;--red:#ef4444;--gold:#f59e0b;--border:#252540;--radius:14px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
        
        .header{background:rgba(10,10,20,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:10px}
        .logo{font-size:18px;font-weight:800;background:linear-gradient(135deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
        .btn{padding:8px 12px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:10px;font-weight:600;font-family:inherit;transition:all .2s;white-space:nowrap}
        .btn:hover{background:#1a1a35;border-color:var(--accent)}
        .btn-primary{background:var(--accent);color:#fff;border:none}
        .btn-success{background:var(--green);color:#fff;border:none}
        .btn-danger{background:var(--red);color:#fff;border:none}
        .btn-warning{background:var(--gold);color:#000;border:none}
        
        .container{max-width:900px;margin:0 auto;padding:20px}
        .card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;border:1px solid var(--border)}
        .card h2{font-size:16px;color:var(--accent);margin-bottom:12px}
        textarea{width:100%;min-height:150px;padding:14px;background:var(--input);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;line-height:1.6;resize:vertical;font-family:Georgia,serif;outline:none}
        textarea:focus{border-color:var(--accent)}
        
        .analysis-box{background:var(--input);padding:12px;border-radius:8px;margin:12px 0;border-left:4px solid #06b6d4;display:none}
        .analysis-box.active{display:block}
        .analysis-box h3{font-size:12px;color:#06b6d4;margin-bottom:8px}
        .analysis-box p{font-size:10px;color:var(--dim);margin:4px 0}
        
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
        .setting{background:var(--input);padding:10px;border-radius:8px;border:1px solid var(--border)}
        .setting label{display:block;font-size:9px;color:var(--dim);margin-bottom:4px;text-transform:uppercase;font-weight:600}
        .setting select{width:100%;padding:6px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;outline:none}
        
        .btn-generate{width:100%;padding:14px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:all .3s}
        .btn-generate:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(139,92,246,.4)}
        .btn-generate:disabled{opacity:.5;cursor:not-allowed}
        
        .progress{display:none;margin:16px 0}
        .progress.active{display:block}
        .progress-bar{width:100%;height:10px;background:var(--input);border-radius:5px;overflow:hidden;border:1px solid var(--border)}
        .progress-fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#ec4899,#06b6d4);width:0%;transition:width .3s}
        .progress-text{text-align:center;font-size:10px;color:var(--dim);margin-top:6px}
        
        .video-container{display:none;margin-top:16px}
        .video-container.active{display:block}
        video{width:100%;border-radius:10px;border:2px solid var(--border);background:#000;max-height:350px}
        .video-info{font-size:10px;color:var(--dim);text-align:center;margin:8px 0}
        
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;color:#fff;font-size:12px;z-index:10000;animation:slideDown .3s;max-width:90%;text-align:center}
        .toast.success{background:var(--green)}
        .toast.error{background:var(--red)}
        .toast.info{background:#06b6d4}
        .toast.warning{background:var(--gold);color:#000}
        @keyframes slideDown{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
        
        .console-panel{position:fixed;top:60px;right:10px;width:520px;max-width:95vw;max-height:80vh;background:#0a0a0a;border-radius:10px;border:2px solid #00ff00;display:none;flex-direction:column;z-index:9999;overflow:hidden}
        .console-panel.show{display:flex}
        .console-header{background:#0d1a0d;padding:10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a3a1a}
        .console-body{flex:1;overflow-y:auto;padding:10px;font-family:monospace;font-size:10px;color:#00ff00;background:#000;min-height:250px}
        .console-line{margin:2px 0;line-height:1.4;word-break:break-word}
        .console-line.error{color:#f44}.console-line.success{color:#4f4}.console-line.info{color:#4af}.console-line.warning{color:#fa4}.console-line.cmd{color:#fff}
        .console-input{display:flex;padding:8px;background:#0d0d0d;border-top:1px solid #1a3a1a;gap:6px;align-items:center}
        .console-input .prompt{color:#0f0;font-family:monospace;font-weight:bold}
        .console-input input{flex:1;background:transparent;border:none;color:#00ff00;font-family:monospace;font-size:11px;outline:none}
        .console-input button{padding:5px 12px;background:#0d1a0d;color:#0f0;border:1px solid #1a3a1a;border-radius:4px;cursor:pointer;font-family:monospace;font-size:10px}
        
        .log-panel{position:fixed;top:60px;left:10px;width:350px;max-width:95vw;max-height:70vh;background:#0a0a0a;border-radius:10px;border:2px solid #ffaa44;display:none;flex-direction:column;z-index:9999;overflow:hidden}
        .log-panel.show{display:flex}
        .log-header{background:#1a0d00;padding:10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3a1a00}
        .log-body{flex:1;overflow-y:auto;padding:10px;font-family:monospace;font-size:9px;color:#ffaa44;background:#0a0a0a;min-height:150px;white-space:pre-wrap}
        .log-actions{display:flex;gap:6px;padding:8px;background:#0d0d0d;border-top:1px solid #3a1a00}
        .log-actions button{flex:1;padding:6px;font-size:9px;border-radius:4px;border:1px solid #ffaa44;background:transparent;color:#ffaa44;cursor:pointer;font-family:inherit}
        
        .file-list-panel{position:fixed;top:60px;left:50%;transform:translateX(-50%);width:400px;max-width:95vw;max-height:60vh;background:#0a0a0a;border-radius:10px;border:2px solid #06b6d4;display:none;flex-direction:column;z-index:9998;overflow:hidden}
        .file-list-panel.show{display:flex}
        .file-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#0d0d0d;border-radius:6px;margin:4px 0;border:1px solid #1a1a1a}
        .file-item:hover{background:#1a1a2a}
        .file-name{font-size:10px;color:#4af}
        .file-size{font-size:8px;color:#666}
        .delete-btn{background:#f44;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:8px}
        
        .feature-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#0d0d20;border-radius:6px;margin:4px 0;border:1px solid #1a1a2a}
        .feature-name{font-size:10px;color:#bc8cff}
        .feature-code{font-size:8px;color:#666;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    </style>
</head>
<body>

<header class="header">
    <div class="logo">🎬 YAD Video AI v13 <span style="font-size:8px;color:#10b981">GITHUB STORAGE</span></div>
    <div class="nav">
        <button class="btn btn-primary" onclick="openConsole()">🖥️ Console</button>
        <button class="btn" style="border-color:#ffaa44;color:#ffaa44" onclick="openLogPanel()">📋 Log</button>
        <button class="btn" style="border-color:#06b6d4;color:#06b6d4" onclick="openFileList()">📁 Files</button>
        <button class="btn" style="border-color:#bc8cff;color:#bc8cff" onclick="openFeaturePanel()">✨ Fitur</button>
        <button class="btn btn-success" onclick="autoFixAll()">🔧 Fix All</button>
        <button class="btn btn-warning" onclick="pushToGitHub()">📤 Push</button>
        <button class="btn btn-danger" onclick="resetAll()">🗑️ Reset</button>
    </div>
</header>

<div class="console-panel" id="consolePanel">
    <div class="console-header">
        <span style="color:#0f0;font-family:monospace;font-weight:bold">🖥️ CONSOLE</span>
        <button onclick="closeConsole()" style="background:none;border:none;color:#f44;cursor:pointer;font-size:18px">✕</button>
    </div>
    <div class="console-body" id="consoleBody"></div>
    <div class="console-input">
        <span class="prompt">➜</span>
        <input type="text" id="consoleInput" placeholder="help, setgithub, githublist, githubdelete..." autocomplete="off">
        <button onclick="execCmd()">Kirim</button>
    </div>
</div>

<div class="log-panel" id="logPanel">
    <div class="log-header">
        <span style="color:#ffaa44;font-family:monospace;font-weight:bold">📋 LOG</span>
        <button onclick="closeLogPanel()" style="background:none;border:none;color:#f44;cursor:pointer;font-size:18px">✕</button>
    </div>
    <div class="log-body" id="logBody">Belum ada masalah.</div>
    <div class="log-actions">
        <button onclick="copyLog()">📋 Copy</button>
        <button onclick="downloadLog()">💾 Save</button>
        <button onclick="clearLog()">🗑️ Clear</button>
    </div>
</div>

<div class="file-list-panel" id="fileListPanel">
    <div class="console-header" style="background:#0d1a2a">
        <span style="color:#06b6d4;font-family:monospace;font-weight:bold">📁 FILE GITHUB</span>
        <button onclick="closeFileList()" style="background:none;border:none;color:#f44;cursor:pointer;font-size:18px">✕</button>
    </div>
    <div class="log-body" id="fileListBody" style="color:#fff;font-size:10px">
        <p style="color:#666;text-align:center;padding:20px;">Ketik "githublist" di console</p>
    </div>
</div>

<div class="file-list-panel" id="featurePanel" style="border-color:#bc8cff">
    <div class="console-header" style="background:#1a0d2a">
        <span style="color:#bc8cff;font-family:monospace;font-weight:bold">✨ FITUR KUSTOM</span>
        <button onclick="closeFeaturePanel()" style="background:none;border:none;color:#f44;cursor:pointer;font-size:18px">✕</button>
    </div>
    <div class="log-body" id="featureListBody" style="color:#fff;font-size:10px">
        <p style="color:#666;text-align:center;padding:20px;">Ketik "featureadd" di console</p>
    </div>
</div>

<div class="container">
    <div class="card">
        <h2>📝 Tulis Cerita</h2>
        <textarea id="storyInput" placeholder="Tulis cerita di sini..." oninput="analyzeText()"></textarea>
        
        <div class="analysis-box" id="analysisBox">
            <h3>🔍 Analisis Otomatis</h3>
            <p id="aGenre">Genre: -</p>
            <p id="aDuration">Durasi: -</p>
            <p id="aScenes">Scene: -</p>
            <p id="aEmotion">Emosi: -</p>
        </div>
        
        <div class="grid">
            <div class="setting">
                <label>🎨 Gaya</label>
                <select id="styleSelect">
                    <option value="auto">🤖 Auto</option>
                    <option value="horror">👻 Horor</option>
                    <option value="fantasy">✨ Fantasi</option>
                    <option value="adventure">🗺️ Petualangan</option>
                    <option value="romance">💕 Romantis</option>
                    <option value="sad">😢 Sedih</option>
                    <option value="action">⚔️ Action</option>
                </select>
            </div>
            <div class="setting">
                <label>📐 Resolusi</label>
                <select id="resolutionSelect">
                    <option value="320x240">Low</option>
                    <option value="640x360" selected>SD</option>
                    <option value="1280x720">HD</option>
                </select>
            </div>
            <div class="setting">
                <label>⏱️ Durasi</label>
                <select id="durationSelect">
                    <option value="auto">🤖 Auto</option>
                    <option value="3" selected>3 detik</option>
                    <option value="5">5 detik</option>
                    <option value="7">7 detik</option>
                </select>
            </div>
        </div>
        
        <div class="grid">
            <div class="setting">
                <label>🗣️ Suara</label>
                <select id="voiceSelect">
                    <option value="id-ID">🇮🇩 Indonesia</option>
                    <option value="en-US">🇺🇸 English</option>
                </select>
            </div>
            <div class="setting">
                <label>🎵 Musik</label>
                <select id="musicSelect">
                    <option value="none">🔇 Tanpa</option>
                    <option value="horror">👻 Horor</option>
                    <option value="calm">😌 Tenang</option>
                </select>
            </div>
            <div class="setting">
                <label>🔊 Volume</label>
                <select id="volumeSelect">
                    <option value="0.5">50%</option>
                    <option value="0.7">70%</option>
                    <option value="1" selected>100%</option>
                </select>
            </div>
        </div>
        
        <div class="setting" style="margin-top:12px">
            <label>💾 Simpan ke GitHub (folder videos/)</label>
            <select id="saveToGitHub">
                <option value="yes" selected>✅ Ya, simpan ke GitHub</option>
                <option value="no">❌ Tidak, download saja</option>
            </select>
        </div>
    </div>
    
    <button class="btn-generate" id="generateBtn" onclick="generateVideo()">🎬 Generate Video</button>
    
    <div class="progress" id="progressContainer">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">Memulai...</div>
    </div>
    
    <div class="video-container" id="videoContainer">
        <video id="videoPreview" controls playsinline></video>
        <div class="video-info" id="videoInfo"></div>
        <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn-generate" style="flex:1" onclick="downloadVideo()">💾 Download</button>
            <button class="btn-generate" style="flex:1;background:linear-gradient(135deg,#06b6d4,#0d9488)" onclick="uploadVideoToGitHub()">📤 Upload ke GitHub</button>
        </div>
    </div>
</div>

<script>
// ========== STATE ==========
var S = {
    blob: null,
    generating: false,
    problems: [],
    chunks: [],
    audioCtx: null,
    audioDest: null,
    hasAudio: false,
    analysis: null,
    github: JSON.parse(localStorage.getItem('github_config') || '{}'),
    githubFiles: [],
    customFeatures: JSON.parse(localStorage.getItem('custom_features') || '[]'),
    videos: JSON.parse(localStorage.getItem('video_history') || '[]')
};

// ========== TOAST ==========
function toast(msg, type) {
    type = type || 'info';
    var t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() { t.remove(); }, 4000);
}

// ========== CONSOLE ==========
function openConsole() {
    document.getElementById('consolePanel').classList.add('show');
    setTimeout(function() { document.getElementById('consoleInput').focus(); }, 100);
}
function closeConsole() { document.getElementById('consolePanel').classList.remove('show'); }

function consoleLog(msg, type) {
    type = type || 'info';
    var body = document.getElementById('consoleBody');
    if (!body) return;
    var line = document.createElement('div');
    line.className = 'console-line ' + type;
    line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    body.appendChild(line);
    body.scrollTop = body.scrollHeight;
    while (body.children.length > 500) body.removeChild(body.firstChild);
}

function execCmd() {
    var input = document.getElementById('consoleInput');
    var cmd = input.value.trim();
    if (!cmd) return;
    
    consoleLog('> ' + cmd, 'cmd');
    input.value = '';
    input.focus();
    
    var parts = cmd.split(' ');
    var main = parts[0].toLowerCase();
    var args = parts.slice(1);
    
    switch(main) {
        case 'help':
            consoleLog('=== PERINTAH CONSOLE ===', 'info');
            consoleLog('setgithub [token] [username] [repo] - Setup GitHub', 'info');
            consoleLog('githubstatus - Cek status GitHub', 'info');
            consoleLog('githublist [path] - List file GitHub', 'info');
            consoleLog('githubdelete [filename] - Hapus file dari GitHub', 'info');
            consoleLog('githubupload [filename] [content] - Upload file ke GitHub', 'info');
            consoleLog('fixaudio - Perbaiki audio', 'info');
            consoleLog('fixall - Perbaiki semua', 'info');
            consoleLog('testaudio - Test audio', 'info');
            consoleLog('testvideo - Test video', 'info');
            consoleLog('analyze - Analisis teks', 'info');
            consoleLog('featureadd [nama] [kode] - Tambah fitur kustom', 'info');
            consoleLog('featurelist - List fitur kustom', 'info');
            consoleLog('featuredelete [nama] - Hapus fitur', 'info');
            consoleLog('videos - List video tersimpan', 'info');
            consoleLog('push - Push index.html ke GitHub', 'info');
            consoleLog('log - Tampilkan log', 'info');
            consoleLog('clearlog - Bersihkan log', 'info');
            consoleLog('reset - Reset semua', 'info');
            break;
            
        case 'setgithub':
            if (args.length >= 3) {
                S.github = { token: args[0], username: args[1], repo: args[2] };
                localStorage.setItem('github_config', JSON.stringify(S.github));
                consoleLog('GitHub set: ' + args[1] + '/' + args[2], 'success');
                consoleLog('Token: ' + args[0].substring(0, 8) + '...', 'info');
                toast('GitHub dikonfigurasi!', 'success');
            } else {
                consoleLog('Format: setgithub [token] [username] [repo]', 'error');
                consoleLog('Contoh: setgithub ghp_xxx username repo', 'warning');
            }
            break;
            
        case 'githubstatus':
            if (S.github.token) {
                consoleLog('GitHub: ' + S.github.username + '/' + S.github.repo, 'success');
                consoleLog('Token: ' + S.github.token.substring(0, 8) + '...', 'info');
            } else {
                consoleLog('GitHub belum di-set!', 'warning');
                consoleLog('Gunakan: setgithub [token] [username] [repo]', 'info');
            }
            break;
            
        case 'githublist':
            listGitHubFiles(args[0] || '');
            break;
            
        case 'githubdelete':
            if (args[0]) {
                deleteGitHubFile(args[0]);
            } else {
                consoleLog('Format: githubdelete [filename]', 'error');
            }
            break;
            
        case 'githubupload':
            if (args.length >= 2) {
                var filename = args[0];
                var content = args.slice(1).join(' ');
                uploadToGitHub(filename, content);
            } else {
                consoleLog('Format: githubupload [filename] [content]', 'error');
            }
            break;
            
        case 'fixaudio': fixAudio(); break;
        case 'fixall': autoFixAll(); break;
        case 'testaudio': testAudio(); break;
        case 'testvideo': testVideo(); break;
        case 'analyze': analyzeText(); break;
        
        case 'featureadd':
            if (args.length >= 2) {
                var name = args[0];
                var code = args.slice(1).join(' ');
                addCustomFeature(name, code);
            } else {
                consoleLog('Format: featureadd [nama] [kode]', 'error');
            }
            break;
            
        case 'featurelist':
            listCustomFeatures();
            break;
            
        case 'featuredelete':
            if (args[0]) {
                deleteCustomFeature(args[0]);
            } else {
                consoleLog('Format: featuredelete [nama]', 'error');
            }
            break;
            
        case 'videos':
            listSavedVideos();
            break;
            
        case 'push':
            pushIndexToGitHub();
            break;
            
        case 'log':
            if (S.problems.length === 0) {
                consoleLog('Tidak ada masalah', 'success');
            } else {
                S.problems.forEach(function(p, i) {
                    consoleLog((i+1) + '. ' + p.msg, 'warning');
                });
            }
            break;
            
        case 'clearlog':
            S.problems = [];
            updateLogPanel();
            consoleLog('Log dibersihkan', 'success');
            break;
            
        case 'reset':
            resetAll();
            break;
            
        default:
            consoleLog('Perintah tidak dikenal: ' + cmd, 'error');
            consoleLog('Ketik "help" untuk bantuan', 'info');
    }
}

document.addEventListener('DOMContentLoaded', function() {
    var input = document.getElementById('consoleInput');
    if (input) {
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); execCmd(); }
        });
    }
});

// ========== GITHUB STORAGE ==========
function listGitHubFiles(path) {
    path = path || '';
    if (!S.github.token || !S.github.username || !S.github.repo) {
        consoleLog('GitHub belum di-set!', 'error');
        consoleLog('Gunakan: setgithub [token] [username] [repo]', 'warning');
        return;
    }
    
    consoleLog('Loading file dari ' + path + '...', 'info');
    
    fetch('https://api.github.com/repos/' + S.github.username + '/' + S.github.repo + '/contents/' + path, {
        headers: { 'Authorization': 'token ' + S.github.token }
    })
    .then(function(res) {
        if (res.status === 404) throw new Error('Folder/file tidak ditemukan');
        if (res.status === 401) throw new Error('Token tidak valid');
        return res.json();
    })
    .then(function(files) {
        if (!Array.isArray(files)) throw new Error(files.message || 'Gagal load');
        
        S.githubFiles = files;
        consoleLog(files.length + ' file ditemukan', 'success');
        
        var html = '';
        files.forEach(function(file) {
            var sizeKB = (file.size / 1024).toFixed(1);
            html += '<div class="file-item">';
            html += '<div>';
            html += '<div class="file-name">' + (file.type === 'dir' ? '📁 ' : '📄 ') + file.name + '</div>';
            html += '<div class="file-size">' + sizeKB + ' KB | ' + file.type + '</div>';
            html += '</div>';
            html += '<div style="display:flex;gap:4px">';
            if (file.type === 'dir') {
                html += '<button class="delete-btn" style="background:#06b6d4" onclick="listGitHubFiles(\'' + (path ? path + '/' : '') + file.name + '\')">📂</button>';
            } else {
                html += '<button class="delete-btn" style="background:#06b6d4" onclick="viewGitHubFile(\'' + file.path + '\')">👁️</button>';
                html += '<button class="delete-btn" onclick="deleteGitHubFile(\'' + file.path + '\')">🗑️</button>';
            }

function deleteGitHubFile(path) {
    if (!S.github.token) {
        consoleLog('GitHub belum di-set!', 'error');
        return;
    }
    
    if (!confirm('Hapus "' + path + '" dari GitHub?')) return;
    
    consoleLog('Menghapus ' + path + '...', 'info');
    
    fetch('https://api.github.com/repos/' + S.github.username + '/' + S.github.repo + '/contents/' + path, {
        headers: { 'Authorization': 'token ' + S.github.token }
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        if (!data.sha) throw new Error('File tidak ditemukan');
        
        return fetch('https://api.github.com/repos/' + S.github.username + '/' + S.github.repo + '/contents/' + path, {
            method: 'DELETE',
            headers: {
                'Authorization': 'token ' + S.github.token,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: 'Delete ' + path,
                sha: data.sha,
                branch: 'main'
            })
        });
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        if (data.commit) {
            consoleLog('File dihapus: ' + path, 'success');
            toast('File dihapus!', 'success');
            listGitHubFiles('');
        } else {
            throw new Error(data.message || 'Gagal hapus');

// ========== TEXT ANALYSIS ==========
function analyzeText() {
    var text = document.getElementById('storyInput').value.trim();
    if (text.length < 10) {
        document.getElementById('analysisBox').classList.remove('active');
        return;
    }
    
    var genre = detectGenre(text);
    var duration = Math.max(5, Math.ceil(text.split(/\s+/).length / 2.5));
    var scenes = text.split('\n\n').filter(function(p) { return p.trim(); }).length;
    var emotion = detectEmotion(text);
    
    S.analysis = { genre: genre, duration: duration, scenes: scenes, emotion: emotion };
    
    document.getElementById('aGenre').textContent = 'Genre: ' + genre;
    document.getElementById('aDuration').textContent = 'Durasi: ' + duration + ' detik';
    document.getElementById('aScenes').textContent = 'Scene: ' + scenes;
    document.getElementById('aEmotion').textContent = 'Emosi: ' + emotion;
    document.getElementById('analysisBox').classList.add('active');
    
    var styleSelect = document.getElementById('styleSelect');
    if (styleSelect.value === 'auto') styleSelect.value = genre;
}

function detectGenre(text) {
    var lower = text.toLowerCase();
    var genres = {
        horror: ['hantu', 'setan', 'malam', 'gelap', 'takut', 'seram', 'horor', 'boneka', 'menyeramkan', 'angker'],
        fantasy: ['ajaib', 'sihir', 'naga', 'putri', 'istana', 'peri', 'penyihir', 'kastil'],
        adventure: ['petualang', 'gunung', 'laut', 'hutan', 'pulau', 'harta', 'jelajah'],
        romance: ['cinta', 'kasih', 'sayang', 'rindu', 'hati', 'kencan', 'bunga'],
        sad: ['sedih', 'menangis', 'air mata', 'kehilangan', 'duka', 'pilu'],
        action: ['bertarung', 'pedang', 'tembak', 'kejar', 'lawan', 'serang']
    };
    
    var best = 'neutral';
    var bestScore = 0;
    for (var genre in genres) {
        var score = 0;
        for (var i = 0; i < genres[genre].length; i++) {
            if (lower.indexOf(genres[genre][i]) > -1) score++;
        }
        if (score > bestScore) { bestScore = score; best = genre; }
    }
    return best;
}

function detectEmotion(text) {
    var lower = text.toLowerCase();
    var emotions = {
        'Takut': ['takut', 'seram', 'ngeri', 'horor'],
        'Sedih': ['sedih', 'menangis', 'duka'],
        'Senang': ['senang', 'bahagia', 'gembira'],
        'Marah': ['marah', 'kesal', 'geram']
    };
    for (var e in emotions) {
        for (var i = 0; i < emotions[e].length; i++) {
            if (lower.indexOf(emotions[e][i]) > -1) return e;
        }
    }
    return 'Netral';
}

// ========== AUDIO ==========
function fixAudio() {
    consoleLog('=== FIX AUDIO ===', 'info');
    
    try {
        if (!S.audioCtx) S.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        consoleLog('AudioContext: OK', 'success');
    } catch(e) {
        logProblem('AudioContext gagal: ' + e.message);
        S.hasAudio = false;
        return false;
    }
    
    if (S.audioCtx.state === 'suspended') S.audioCtx.resume();
    
    try {
        S.audioDest = S.audioCtx.createMediaStreamDestination();
        consoleLog('AudioDestination: OK', 'success');
    } catch(e) {
        S.hasAudio = false;
        return false;
    }
    
    if (!window.speechSynthesis) {
        logProblem('Speech Synthesis tidak didukung');
        S.hasAudio = false;
        return false;
    }
    
    var codec = 'video/webm;codecs=vp8,opus';
    if (!MediaRecorder.isTypeSupported(codec)) codec = 'video/webm;codecs=vp8';
    if (!MediaRecorder.isTypeSupported(codec)) codec = 'video/webm';
    
    S.audioCodec = codec;
    S.hasAudio = true;
    consoleLog('Codec: ' + codec, 'success');
    consoleLog('AUDIO SIAP!', 'success');
    return true;
}

        u.onerror = function() { consoleLog('Audio error', 'error'); };

function testVideo() {
    try {
        var canvas = document.createElement('canvas');
        canvas.width = 100; canvas.height = 100;
        var ctx = canvas.getContext('2d');
        ctx.fillRect(0, 0, 100, 100);
        var stream = canvas.captureStream(10);
        var codec = 'video/webm;codecs=vp8';
        if (!MediaRecorder.isTypeSupported(codec)) codec = 'video/webm';
        var rec = new MediaRecorder(stream, {mimeType: codec});
        var chunks = [];
        rec.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
        rec.onstop = function() {
            var blob = new Blob(chunks, {type: codec});
            consoleLog('Video test: ' + blob.size + ' bytes', blob.size > 0 ? 'success' : 'error');
            if (blob.size > 0) toast('Video OK!', 'success');
            else logProblem('Video test kosong');
        };
        rec.start(100);
        setTimeout(function() { if (rec.state !== 'inactive') rec.stop(); }, 800);
    } catch(e) {
        logProblem('Video test error: ' + e.message);
    }
}

// ========== GENERATE VIDEO ==========
function generateVideo() {
    var text = document.getElementById('storyInput').value.trim();
    if (!text) { toast('Tulis cerita dulu!', 'error'); return; }
    if (S.generating) { toast('Masih generating!', 'warning'); return; }
    
    S.generating = true;
    S.chunks = [];
    
    analyzeText();
    fixAudio();
    
    var style = document.getElementById('styleSelect').value;
    if (style === 'auto' && S.analysis) style = S.analysis.genre;
    
    var resolution = document.getElementById('resolutionSelect').value;
    var voice = document.getElementById('voiceSelect').value;
    var volume = parseFloat(document.getElementById('volumeSelect').value);
    var dims = resolution.split('x');
    var width = parseInt(dims[0]);
    var height = parseInt(dims[1]);
    var fps = 25;
    var durationPerScene = 3;
    
    var progressContainer = document.getElementById('progressContainer');
    var progressFill = document.getElementById('progressFill');
    var progressText = document.getElementById('progressText');
    var generateBtn = document.getElementById('generateBtn');
    
    progressContainer.classList.add('active');
    generateBtn.disabled = true;
    generateBtn.textContent = 'Generating...';
    
    consoleLog('Generate: ' + width + 'x' + height, 'info');
    
    var canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    var ctx = canvas.getContext('2d');
    
    var canvasStream = canvas.captureStream(fps);
    var finalStream = canvasStream;
    var codec = S.audioCodec || 'video/webm;codecs=vp8';
    
    if (S.hasAudio && S.audioDest) {
        try {
            var vt = canvasStream.getVideoTracks()[0];
            var at = S.audioDest.stream.getAudioTracks()[0];
            if (vt && at) {
                finalStream = new MediaStream([vt, at]);
                consoleLog('Audio + Video digabung', 'success');
            }
        } catch(e) {
            finalStream = canvasStream;
            codec = 'video/webm;codecs=vp8';
        }
    }
    
    var recorder;
    try {
        recorder = new MediaRecorder(finalStream, {
            mimeType: codec,
            videoBitsPerSecond: 2000000,
            audioBitsPerSecond: 128000
        });
    } catch(e) {
        logProblem('Recorder error: ' + e.message);
        toast('Gagal recorder!', 'error');
        finishGenerate();
        return;
    }
    
    recorder.ondataavailable = function(e) { if (e.data && e.data.size > 0) S.chunks.push(e.data); };
    
    recorder.onstop = function() {
        if (S.chunks.length === 0) {
            logProblem('Video kosong');
            toast('Video kosong!', 'error');
            finishGenerate();
            return;
        }
        
        var blob = new Blob(S.chunks, {type: codec});
        S.blob = blob;
        
        consoleLog('Video: ' + (blob.size/1024).toFixed(1) + ' KB', 'success');
        
        var url = URL.createObjectURL(blob);
        var video = document.getElementById('videoPreview');
        video.src = url;
        video.load();
        video.onloadeddata = function() { toast('Video berhasil!', 'success'); };
        
        document.getElementById('videoContainer').classList.add('active');
        document.getElementById('videoInfo').textContent = 'Size: ' + (blob.size/1024).toFixed(1) + ' KB | Codec: ' + codec;
        
        // Save to history
        S.videos.unshift({
            name: 'video_' + Date.now() + '.webm',
            size: (blob.size/1024).toFixed(1),
            date: new Date().toISOString()
        });
        localStorage.setItem('video_history', JSON.stringify(S.videos));
        
        // Auto upload to GitHub if enabled
        if (document.getElementById('saveToGitHub').value === 'yes' && S.github.token) {
            uploadVideoToGitHub();
        }
        
        S.chunks = [];
        finishGenerate();
    };
    
    recorder.start(500);
    
    var paragraphs = text.split('\n\n').filter(function(p) { return p.trim(); });
    if (paragraphs.length === 0) paragraphs = [text];
    
    var totalFrames = paragraphs.length * durationPerScene * fps;
    var frameCount = 0;
    
    function renderScene(sceneIndex) {
        if (sceneIndex >= paragraphs.length) {
            progressText.textContent = 'Finalizing...';
            progressFill.style.width = '90%';
            setTimeout(function() { if (recorder.state !== 'inactive') recorder.stop(); }, 500);
            return;
        }
        
        progressText.textContent = 'Scene ' + (sceneIndex+1) + '/' + paragraphs.length;
        var paragraph = paragraphs[sceneIndex];
        var framesForScene = durationPerScene * fps;
        var frameInScene = 0;
        
        try {
            var u = new SpeechSynthesisUtterance(paragraph);
            u.lang = voice;
            u.rate = 0.9;
            u.volume = volume;
            speechSynthesis.speak(u);
        } catch(e) {}
        
        function renderFrame() {
            if (frameInScene >= framesForScene) { renderScene(sceneIndex + 1); return; }
            
            var colors = {horror:['#0a0a0a','#1a0a0a'],fantasy:['#1a0533','#3d1a6b'],adventure:['#1a3a1a','#2a4a2a'],romance:['#3a1a1a','#4a2a2a'],sad:['#2a2a2a','#1a1a1a'],action:['#3a1a0a','#2a0a0a']};
            var c = colors[style] || colors.horror;
            var grad = ctx.createLinearGradient(0,0,0,height);
            grad.addColorStop(0,c[0]);grad.addColorStop(1,c[1]);
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,width,height);
            
            var icons = {horror:'👻',fantasy:'✨',adventure:'🗺️',romance:'💕',sad:'😢',action:'⚔️'};
            ctx.font = (height/3)+'px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(icons[style]||'🎬', width/2, height/3);
            
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, height-80, width, 80);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(paragraph.substring(0,60), width/2, height-40);
            
            frameCount++;
            progressFill.style.width = (10 + (frameCount/totalFrames)*80) + '%';
            frameInScene++;
            setTimeout(renderFrame, 1000/fps);
        }
        renderFrame();
    }
    renderScene(0);
}

function finishGenerate() {
    S.generating = false;
    var btn = document.getElementById('generateBtn');

        fetch('https://api.github.com/repos/' + S.github.username + '/' + S.github.repo + '/contents/' + path, {

                'Authorization': 'token ' + S.github.token,

            },
            body: JSON.stringify({
                message: 'Upload video: ' + filename,

                branch: 'main'
            })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.content) {
                consoleLog('Video terupload: ' + path, 'success');
                toast('Video terupload ke GitHub!', 'success');
            } else {
                throw new Error(data.message || 'Upload gagal');
            }
        })
        .catch(function(e) {
            consoleLog('Upload gagal: ' + e.message, 'error');
            logProblem('Upload video gagal: ' + e.message);
        });
    };
    reader.readAsDataURL(S.blob);
}

function resetAll() {
    if (!confirm('Reset semua data?')) return;
    try { localStorage.clear(); } catch(e) {}
    S.blob = null;
    S.github = {};
    S.hasAudio = false;
    S.githubFiles = [];
    S.customFeatures = [];
    S.videos = [];
    S.problems = [];
    var video = document.getElementById('videoPreview');
    if (video) video.src = '';
    document.getElementById('videoContainer').classList.remove('active');
    document.getElementById('storyInput').value = '';
    updateLogPanel();
    consoleLog('Reset selesai', 'warning');
    toast('Reset!', 'info');
}

// ========== INIT ==========
function init() {
    consoleLog('YAD Video AI v13 initialized', 'success');
    consoleLog('Storage: GitHub (via console setup)', 'info');
    consoleLog('Ketik "help" untuk perintah', 'info');
    consoleLog('Setup GitHub: setgithub [token] [username] [repo]', 'warning');
    
    if (S.github.token) {
        consoleLog('GitHub: ' + S.github.username + '/' + S.github.repo, 'success');
    }
    
    if (S.customFeatures.length > 0) {
        consoleLog('Fitur kustom: ' + S.customFeatures.length, 'info');
        S.customFeatures.forEach(function(f) {
            try {
                var wrapper = document.createElement('div');
                wrapper.setAttribute('data-feature', f.name);
                wrapper.innerHTML = f.code;
                document.body.appendChild(wrapper);
            } catch(e) {}
        });
    }
    
    fixAudio();
}

init();
</script>
