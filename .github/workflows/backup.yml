name: Auto Backup

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Create Backup
      run: |
        mkdir -p backups
        echo "Backup: $(date)" > backups/backup_info.txt
        ls -la > backups/files_list.txt
        cp *.html *.js *.css backups/ 2>/dev/null || true
    
    - name: Commit Backup
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add backups/
        git commit -m "📦 Auto backup: $(date +%Y-%m-%d_%H-%M-%S)" || echo "No changes"
        git push origin main
