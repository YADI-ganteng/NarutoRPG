<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAD Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
    <header class="admin-header">
        <div class="logo">👑 YAD Admin</div>
        <div class="nav-links">
            <a href="index.html" class="btn">🏠 Home</a>
            <button class="btn btn-danger" onclick="handleLogout()">🚪 Logout</button>
        </div>
    </header>
    
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <button class="sidebar-btn active" onclick="showSection('dashboard', this)">📊 Dashboard</button>
            <button class="sidebar-btn" onclick="showSection('orders', this)">🛒 Orders</button>
            <button class="sidebar-btn" onclick="showSection('products', this)">📦 Produk</button>
            <button class="sidebar-btn" onclick="showSection('bulk', this)">📋 Massal</button>
            <button class="sidebar-btn" onclick="showSection('coupons', this)">🎟️ Kupon</button>
            <button class="sidebar-btn" onclick="showSection('payments', this)">💳 Pembayaran</button>
            <button class="sidebar-btn" onclick="showSection('features', this)">✨ Fitur</button>
            <button class="sidebar-btn" onclick="showSection('github', this)">🚀 GitHub</button>
            <button class="sidebar-btn" onclick="showSection('settings', this)">⚙️ Settings</button>
        </aside>
        
        <main class="admin-content">
            <div id="section-dashboard" class="admin-section">
                <h2>📊 Dashboard</h2>
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-value" id="statPending">0</div><div class="stat-label">Pending</div></div>
                    <div class="stat-card"><div class="stat-value" id="statDone">0</div><div class="stat-label">Done</div></div>
                    <div class="stat-card"><div class="stat-value" id="statRevenue">Rp 0</div><div class="stat-label">Revenue</div></div>
                </div>
                <div id="recentOrders"></div>
            </div>
            
            <div id="section-orders" class="admin-section hidden">
                <h2>🛒 Orders</h2>
                <div style="display:flex;gap:8px;margin:16px 0;">
                    <button class="btn btn-sm active" onclick="filterOrders('all', this)">Semua</button>
                    <button class="btn btn-sm" onclick="filterOrders('pending', this)">Pending</button>
                    <button class="btn btn-sm" onclick="filterOrders('done', this)">Done</button>
                </div>
                <div id="ordersList"></div>
            </div>
            
            <div id="section-products" class="admin-section hidden">
                <h2>📦 Produk</h2>
                <div id="productsManagement"></div>
            </div>
            
            <div id="section-bulk" class="admin-section hidden">
                <h2>📋 Manajemen Massal</h2>
                <div class="bulk-section">
                    <h3>➕ Tambah Items</h3>
                    <select id="bulkCategory" onchange="updateBulkGame()"></select>
                    <select id="bulkGame"></select>
                    <textarea id="bulkAddItems" placeholder="Nama|Harga per baris"></textarea>
                    <button class="btn btn-success" onclick="bulkAddItems()">✅ Tambah</button>
                </div>
                <div class="bulk-section">
                    <h3>📁 Tambah Kategori</h3>
                    <input id="newCategoryId" placeholder="ID">
                    <input id="newCategoryName" placeholder="Nama">
                    <button class="btn btn-success" onclick="addNewCategory()">✅ Tambah</button>
                </div>
            </div>
            
            <div id="section-coupons" class="admin-section hidden">
                <h2>🎟️ Kupon</h2>
                <input id="couponCode" placeholder="Kode">
                <input id="couponDiscount" placeholder="Diskon" type="number">
                <select id="couponType"><option value="percent">%</option><option value="fixed">Rp</option></select>
                <button class="btn btn-success" onclick="addCoupon()">✅ Tambah</button>
                <div id="couponsList"></div>
            </div>
            
            <div id="section-payments" class="admin-section hidden">
                <h2>💳 Pembayaran</h2>
                <input id="paymentName" placeholder="Nama">
                <input id="paymentNumber" placeholder="Nomor">
                <button class="btn btn-success" onclick="addPayment()">✅ Tambah</button>
                <div id="paymentsList"></div>
            </div>
            
            <div id="section-features" class="admin-section hidden">
                <h2>✨ Fitur</h2>
                <button class="btn btn-primary" onclick="openFeatureModal()">➕ Tambah Fitur</button>
                <div id="featuresList"></div>
            </div>
            
            <div id="section-github" class="admin-section hidden">
                <h2>🚀 GitHub</h2>
                <input id="githubToken" placeholder="Token">
                <input id="githubOwner" placeholder="Owner">
                <input id="githubRepo" placeholder="Repo">
                <button class="btn btn-success" onclick="saveGitHubConfig()">💾 Simpan</button>
                <button class="btn btn-primary" onclick="testGitHub()">🔍 Test</button>
                <div id="githubStatus"></div>
            </div>
            
            <div id="section-settings" class="admin-section hidden">
                <h2>⚙️ Settings</h2>
                <label>Markup (%)</label>
                <input id="markupSetting" type="number" value="30" onchange="updateMarkup()">
            </div>
        </main>
    </div>
    
    <script src="config.js"></script>
    <script src="database.js"></script>
    <script src="auth.js"></script>
    <script src="github.js"></script>
    <script src="features.js"></script>
    <script>
        // ====== FUNGSI ADMIN ======
        
        function showSection(section, btn) {
            document.querySelectorAll('.admin-section').forEach(s => s.classList.add('hidden'));
            document.getElementById('section-' + section).classList.remove('hidden');
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            
            if (section === 'orders') renderOrders();
            if (section === 'products') renderProducts();
            if (section === 'bulk') initBulk();
            if (section === 'coupons') renderCoupons();
            if (section === 'payments') renderPayments();
            if (section === 'features') renderFeatures();
            if (section === 'github') loadGitHubConfig();
            updateDashboard();
        }
        
        function updateDashboard() {
            document.getElementById('statPending').textContent = DB.getOrders('pending').length;
            document.getElementById('statDone').textContent = DB.getOrders('done').length;
            document.getElementById('statRevenue').textContent = 'Rp ' + DB.getOrders('done').reduce((s,o) => s+o.price, 0).toLocaleString('id-ID');
            document.getElementById('recentOrders').innerHTML = '<h3>Order Terbaru</h3>' + DB.state.orders.slice(0,5).map(o => '<div style="padding:8px;background:#12122a;border-radius:6px;margin:4px 0;font-size:12px;"><b>' + o.id + '</b> - ' + o.game + ' - ' + o.status + '</div>').join('');
        }
        
        function renderOrders(filter) {
            filter = filter || 'all';
            const orders = DB.getOrders(filter);
            document.getElementById('ordersList').innerHTML = orders.length ? orders.map(o => '<div style="padding:10px;background:#12122a;border-radius:6px;margin:6px 0;"><b>' + o.id + '</b> - ' + o.game + '<br>Rp ' + o.price.toLocaleString('id-ID') + ' | ' + o.status + '<br><button class="btn btn-sm btn-success" onclick="confirmOrder(\'' + o.id + '\')">✅</button> <button class="btn btn-sm btn-danger" onclick="rejectOrder(\'' + o.id + '\')">❌</button></div>').join('') : '<p>Tidak ada orders</p>';
        }
        
        function filterOrders(filter, btn) {
            document.querySelectorAll('#section-orders .btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderOrders(filter);
        }
        
        function confirmOrder(id) {
            if (DB.updateOrderStatus(id, 'done')) { renderOrders('all'); updateDashboard(); toast('✅ Dikonfirmasi!', 'success'); }
        }
        
        function rejectOrder(id) {
            if (DB.updateOrderStatus(id, 'cancelled')) { renderOrders('all'); updateDashboard(); }
        }
        
        function renderProducts() {
            let html = '';
            Object.keys(DB.state.products).forEach(cat => {
                html += '<h3>' + cat + ' <button class="btn btn-sm btn-danger" onclick="deleteCategory(\'' + cat + '\')">🗑️</button></h3>';
                DB.state.products[cat].forEach(p => {
                    html += '<div style="padding:8px;background:#12122a;border-radius:6px;margin:4px 0;">' + p.icon + ' ' + p.name + ' (' + p.items.length + ') <button class="btn btn-sm btn-danger" onclick="deleteProduct(\'' + cat + '\',\'' + p.id + '\')">✕</button></div>';
                });
            });
            document.getElementById('productsManagement').innerHTML = html;
        }
        
        function deleteCategory(cat) {
            if (confirm('Hapus kategori ' + cat + '?')) { DB.deleteCategory(cat); renderProducts(); }
        }
        
        function deleteProduct(cat, id) {
            if (confirm('Hapus produk?')) { DB.deleteProduct(cat, id); renderProducts(); }
        }
        
        function initBulk() {
            document.getElementById('bulkCategory').innerHTML = Object.keys(DB.state.products).map(cat => '<option value="' + cat + '">' + cat + '</option>').join('');
            updateBulkGame();
        }
        
        function updateBulkGame() {
            const cat = document.getElementById('bulkCategory').value;
            document.getElementById('bulkGame').innerHTML = DB.state.products[cat].map(p => '<option value="' + p.id + '">' + p.name + '</option>').join('');
        }
        
        function bulkAddItems() {
            const cat = document.getElementById('bulkCategory').value;
            const game = document.getElementById('bulkGame').value;
            const text = document.getElementById('bulkAddItems').value;
            const added = DB.addItemsBulk(cat, game, text);
            toast('✅ ' + added + ' item ditambahkan!', 'success');
            document.getElementById('bulkAddItems').value = '';
        }
        
        function addNewCategory() {
            const id = document.getElementById('newCategoryId').value.trim();
            const name = document.getElementById('newCategoryName').value.trim();
            if (DB.addCategory(id, name, '📦')) { toast('✅ Kategori ditambahkan!', 'success'); initBulk(); }
        }
        
        function renderCoupons() {
            document.getElementById('couponsList').innerHTML = Object.keys(DB.state.coupons).map(code => '<div style="padding:8px;background:#12122a;border-radius:6px;margin:4px 0;">' + code + ' <button class="btn btn-sm btn-danger" onclick="deleteCoupon(\'' + code + '\')">✕</button></div>').join('');
        }
        
        function addCoupon() {
            const code = document.getElementById('couponCode').value.trim().toUpperCase();
            const discount = parseInt(document.getElementById('couponDiscount').value);
            const type = document.getElementById('couponType').value;
            if (code && discount > 0) { DB.addCoupon(code, discount, type); renderCoupons(); toast('✅ Kupon ditambahkan!', 'success'); }
        }
        
        function deleteCoupon(code) { DB.deleteCoupon(code); renderCoupons(); }
        
        function renderPayments() {
            document.getElementById('paymentsList').innerHTML = DB.state.payments.map(p => '<div style="padding:8px;background:#12122a;border-radius:6px;margin:4px 0;">' + p.name + ' - ' + p.number + '</div>').join('');
        }
        
        function addPayment() {
            const name = document.getElementById('paymentName').value.trim();
            const number = document.getElementById('paymentNumber').value.trim();
            if (name && number) { DB.state.payments.push({name, number, holder: 'YAD Store'}); DB.savePayments(); renderPayments(); toast('✅ Ditambahkan!', 'success'); }
        }
        
        function renderFeatures() {
            const features = Features.getAll();
            document.getElementById('featuresList').innerHTML = features.length ? features.map((f,i) => '<div style="padding:10px;background:#12122a;border-radius:6px;margin:6px 0;"><b>' + (i+1) + '. ' + f.name + '</b> ' + (f.active ? '✅' : '❌') + ' <button class="btn btn-sm btn-danger" onclick="deleteFeature(\'' + f.id + '\')">✕</button></div>').join('') : '<p>Belum ada fitur</p>';
        }
        
        function openFeatureModal() {
            const modal = document.createElement('div');
            modal.className = 'modal show';
            modal.innerHTML = '<div class="modal-dialog"><div class="modal-header"><h3>➕ Tambah Fitur</h3><span onclick="this.closest(\'.modal\').remove()">×</span></div><div class="modal-body"><label>Nama</label><input id="featName"><label>Kode HTML</label><textarea id="featCode"></textarea></div><div class="modal-footer"><button class="btn btn-success" onclick="saveFeature()">💾 Simpan</button></div></div>';
            document.body.appendChild(modal);
        }
        
        function saveFeature() {
            const result = Features.add({name: document.getElementById('featName').value, code: document.getElementById('featCode').value});
            if (result.success) { toast('✅ Ditambahkan!', 'success'); document.querySelectorAll('.modal').forEach(m => m.remove()); renderFeatures(); }
            else toast('❌ ' + result.message, 'error');
        }
        
        function deleteFeature(id) { Features.delete(id); renderFeatures(); }
        
        function loadGitHubConfig() {
            document.getElementById('githubToken').value = GitHub.config.token || '';
            document.getElementById('githubOwner').value = GitHub.config.owner || '';
            document.getElementById('githubRepo').value = GitHub.config.repo || '';
        }
        
        function saveGitHubConfig() {
            GitHub.saveConfig(document.getElementById('githubToken').value, document.getElementById('githubOwner').value, document.getElementById('githubRepo').value, 'main');
            toast('✅ Config disimpan!', 'success');
        }
        
        async function testGitHub() {
            const result = await GitHub.testConnection();
            document.getElementById('githubStatus').innerHTML = '<p style="color:' + (result.success ? '#10b981' : '#ef4444') + '">' + result.message + '</p>';
        }
        
        function updateMarkup() {
            DB.state.markup = parseInt(document.getElementById('markupSetting').value) || 30;
            localStorage.setItem('store_markup', DB.state.markup);
            toast('✅ Markup: ' + DB.state.markup + '%', 'success');
        }
        
        function handleLogout() {
            if (confirm('Logout?')) { sessionStorage.clear(); window.location.href = 'index.html'; }
        }
        
        function toast(m, t) {
            const c = document.createElement('div');
            c.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;padding:8px 16px;border-radius:16px;color:white;font-size:11px;font-weight:600;';
            c.style.background = t === 'success' ? '#10b981' : '#ef4444';
            c.textContent = m;
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 3000);
        }
        
        // Init
        updateDashboard();
        renderOrders();
        renderProducts();
        renderCoupons();
        renderPayments();
        renderFeatures();
        console.log('✅ Admin panel loaded');
    </script>
</body>
</html>
