<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAD Video AI - Ultimate Fix v8.0</title>
    <style>
        :root{--bg:#0a0a14;--card:#12122a;--input:#0d0d20;--text:#e8e8f0;--dim:#9090a8;--accent:#8b5cf6;--green:#10b981;--red:#ef4444;--gold:#f59e0b;--border:#252540;--radius:14px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
        
        .header{background:rgba(10,10,20,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:10px}
        .logo{font-size:18px;font-weight:800;background:linear-gradient(135deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
        .btn{padding:8px 12px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:10px;font-weight:600;font-family:inherit;transition:all .2s;white-space:nowrap}
        .btn:hover{background:#1a1a35;border-color:var(--accent)}
        .btn-primary{background:var(--accent);color:#fff;border:none}
        .btn-success{background:var(--green);color:#fff;border:none}
        .btn-danger{background:var(--red);color:#fff;border:none}
        .btn-warning{background:var(--gold);color:#000;border:none}
        
        .container{max-width:900px;margin:0 auto;padding:20px}
        .card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;border:1px solid var(--border)}
        .card h2{font-size:16px;color:var(--accent);margin-bottom:12px}
        textarea{width:100%;min-height:150px;padding:14px;background:var(--input);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;line-height:1.6;resize:vertical;font-family:Georgia,serif;outline:none}
        textarea:focus{border-color:var(--accent)}
        
        .analysis-box{background:var(--input);padding:12px;border-radius:8px;margin:12px 0;border-left:4px solid #06b6d4;display:none}
        .analysis-box.active{display:block}
        .analysis-box h3{font-size:12px;color:#06b6d4;margin-bottom:8px}
        .analysis-box p{font-size:10px;color:var(--dim);margin:4px 0}
        
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
        .setting{background:var(--input);padding:10px;border-radius:8px;border:1px solid var(--border)}
        .setting label{display:block;font-size:9px;color:var(--dim);margin-bottom:4px;text-transform:uppercase;font-weight:600}
        .setting select{width:100%;padding:6px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;outline:none}
        
        .btn-generate{width:100%;padding:14px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:all .3s}
        .btn-generate:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(139,92,246,.4)}
        .btn-generate:disabled{opacity:.5;cursor:not-allowed}
        
        .progress{display:none;margin:16px 0}
        .progress.active{display:block}
        .progress-bar{width:100%;height:10px;background:var(--input);border-radius:5px;overflow:hidden;border:1px solid var(--border)}
        .progress-fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#ec4899,#06b6d4);width:0%;transition:width .3s}
        .progress-text{text-align:center;font-size:10px;color:var(--dim);margin-top:6px}
        
        .video-container{display:none;margin-top:16px}
        .video-container.active{display:block}
        video{width:100%;border-radius:10px;border:2px solid var(--border);background:#000;max-height:350px}
        
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;color:#fff;font-size:12px;z-index:10000;animation:slideDown .3s;max-width:90%;text-align:center}
        .toast.success{background:var(--green)}
        .toast.error{background:var(--red)}
        .toast.info{background:#06b6d4}
        .toast.warning{background:var(--gold);color:#000}
        @keyframes slideDown{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
        
        .console-panel{position:fixed;top:60px;right:10px;width:480px;max-width:95vw;max-height:75vh;background:#0a0a0a;border-radius:10px;border:2px solid #00ff00;display:none;flex-direction:column;z-index:9999;overflow:hidden}
        .console-panel.show{display:flex}
        .console-header{background:#0d1a0d;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a3a1a}
        .console-body{flex:1;overflow-y:auto;padding:8px;font-family:monospace;font-size:9px;color:#00ff00;background:#000;min-height:200px}
        .console-line{margin:1px 0;line-height:1.4;word-break:break-word}
        .console-line.error{color:#f44}.console-line.success{color:#4f4}.console-line.info{color:#4af}.console-line.warning{color:#fa4}.console-line.cmd{color:#fff}
        .console-input{display:flex;padding:8px;background:#0d0d0d;border-top:1px solid #1a3a1a;align-items:center}
        .console-input .prompt{color:#0f0;margin-right:6px;font-family:monospace;font-size:12px;font-weight:bold}
        .console-input input{flex:1;background:transparent;border:none;color:#00ff00;font-family:monospace;font-size:11px;outline:none;padding:4px}
        .console-input button{padding:4px 10px;background:#0d1a0d;color:#0f0;border:1px solid #1a3a1a;border-radius:4px;cursor:pointer;font-size:10px;font-family:monospace}
        .console-input button:hover{background:#1a3a1a}
        
        .log-panel{position:fixed;top:60px;left:10px;width:350px;max-width:95vw;max-height:70vh;background:#0a0a0a;border-radius:10px;border:2px solid #ffaa44;display:none;flex-direction:column;z-index:9999;overflow:hidden}
        .log-panel.show{display:flex}
        .log-header{background:#1a0d00;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3a1a00}
        .log-body{flex:1;overflow-y:auto;padding:8px;font-family:monospace;font-size:8px;color:#ffaa44;background:#0a0a0a;min-height:100px;white-space:pre-wrap}
        .log-actions{display:flex;gap:4px;padding:6px;background:#0d0d0d;border-top:1px solid #3a1a00}
        .log-actions button{flex:1;padding:5px;font-size:8px;border-radius:4px;border:1px solid #ffaa44;background:transparent;color:#ffaa44;cursor:pointer;font-family:inherit}
        
        .status-badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:9px;font-weight:600;margin-left:4px}
        .status-badge.ready{background:var(--green);color:#fff}
        .status-badge.busy{background:var(--gold);color:#000}
        .status-badge.error{background:var(--red);color:#fff}
    </style>
</head>
<body>

<header class="header">
    <div class="logo">🎬 YAD Video AI v8.0 <span class="status-badge ready" id="statusBadge">READY</span></div>
    <div class="nav">
        <button class="btn btn-primary" onclick="openConsole()">🖥️ Console</button>
        <button class="btn" style="border-color:#ffaa44;color:#ffaa44" onclick="openLogPanel()">📋 Log</button>
        <button class="btn btn-success" onclick="autoFix()">🔧 Fix</button>
        <button class="btn btn-warning" onclick="pushToGitHub()">📤 Push</button>
        <button class="btn btn-danger" onclick="resetAll()">🗑️ Reset</button>
    </div>
</header>

<div class="console-panel" id="consolePanel">
    <div class="console-header">
        <span style="color:#0f0;font-family:monospace;font-size:11px;font-weight:bold">🖥️ CONSOLE</span>
        <button onclick="closeConsole()" style="background:none;border:none;color:#f44;cursor:pointer;font-size:18px">✕</button>
    </div>
    <div class="console-body" id="consoleBody"></div>
    <div class="console-input">
        <span class="prompt">➜</span>
        <input type="text" id="consoleInput" placeholder="Ketik perintah lalu Enter..." autocomplete="off">
        <button onclick="execCmd()">Kirim</button>
    </div>
</div>

<div class="log-panel" id="logPanel">
    <div class="log-header">
        <span style="color:#ffaa44;font-family:monospace;font-size:11px;font-weight:bold">📋 LOG</span>
        <button onclick="closeLogPanel()" style="background:none;border:none;color:#f44;cursor:pointer;font-size:18px">✕</button>
    </div>
    <div class="log-body" id="logBody">Belum ada masalah.</div>
    <div class="log-actions">
        <button onclick="copyLog()">📋 Copy</button>
        <button onclick="downloadLog()">💾 Save</button>
        <button onclick="clearLog()">🗑️ Clear</button>
    </div>
</div>

<div class="container">
    <div class="card">
        <h2>📝 Tulis Cerita</h2>
        <textarea id="storyInput" placeholder="Tulis cerita di sini..." oninput="analyzeText()"></textarea>
        
        <div class="analysis-box" id="analysisBox">
            <h3>🔍 Analisis Otomatis</h3>
            <p id="analysisGenre">Genre: -</p>
            <p id="analysisDuration">Durasi: -</p>
            <p id="analysisScenes">Scene: -</p>
            <p id="analysisEmotion">Emosi: -</p>
        </div>
        
        <div class="grid">
            <div class="setting">
                <label>🎨 Gaya</label>
                <select id="styleSelect">
                    <option value="auto">🤖 Auto</option>
                    <option value="horror">👻 Horor</option>
                    <option value="fantasy">✨ Fantasi</option>
                    <option value="adventure">🗺️ Petualangan</option>
                    <option value="romance">💕 Romantis</option>
                    <option value="sad">😢 Sedih</option>
                    <option value="action">⚔️ Action</option>
                </select>
            </div>
            <div class="setting">
                <label>📐 Resolusi</label>
                <select id="resolutionSelect">
                    <option value="320x240">Low</option>
                    <option value="640x360" selected>SD</option>
                    <option value="1280x720">HD</option>
                </select>
            </div>
            <div class="setting">
                <label>⏱️ Durasi</label>
                <select id="durationSelect">
                    <option value="auto">🤖 Auto</option>
                    <option value="3" selected>3 detik</option>
                    <option value="5">5 detik</option>
                    <option value="7">7 detik</option>
                </select>
            </div>
        </div>
        
        <div class="grid">
            <div class="setting">
                <label>🗣️ Suara</label>
                <select id="voiceSelect">
                    <option value="id-ID">🇮🇩 Indonesia</option>
                    <option value="en-US">🇺🇸 English</option>
                </select>
            </div>
            <div class="setting">
                <label>🎵 Musik</label>
                <select id="musicSelect">
                    <option value="none">🔇 Tanpa</option>
                    <option value="horror">👻 Horor</option>
                    <option value="calm">😌 Tenang</option>
                    <option value="action">⚔️ Action</option>
                </select>
            </div>
            <div class="setting">
                <label>🔊 Volume</label>
                <select id="volumeSelect">
                    <option value="0.5">50%</option>
                    <option value="0.7">70%</option>
                    <option value="1" selected>100%</option>
                </select>
            </div>
        </div>
    </div>
    
    <button class="btn-generate" id="generateBtn" onclick="generateVideo()">🎬 Generate Video</button>
    
    <div class="progress" id="progressContainer">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">Memulai...</div>
    </div>
    
    <div class="video-container" id="videoContainer">
        <video id="videoPreview" controls playsinline></video>
        <div style="font-size:10px;color:var(--dim);text-align:center;margin:8px 0" id="videoInfo"></div>
        <button class="btn-generate" style="margin-top:10px" onclick="downloadVideo()">💾 Download</button>
    </div>
</div>

<script>
// ========== STATE ==========
var S = {
    blob: null,
    generating: false,
    problems: [],
    chunks: [],
    recorder: null,
    analysis: null,
    github: JSON.parse(localStorage.getItem('github_config') || '{}')
};

// ========== TOAST ==========
function toast(msg, type) {
    type = type || 'info';
    var t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() { t.remove(); }, 4000);
}

// ========== CONSOLE (FIXED) ==========
function openConsole() {
    var panel = document.getElementById('consolePanel');
    panel.classList.add('show');
    setTimeout(function() {
        document.getElementById('consoleInput').focus();
    }, 100);
}

function closeConsole() {
    document.getElementById('consolePanel').classList.remove('show');
}

function consoleLog(msg, type) {
    type = type || 'info';
    var body = document.getElementById('consoleBody');
    if (!body) return;
    var line = document.createElement('div');
    line.className = 'console-line ' + type;
    line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    body.appendChild(line);
    body.scrollTop = body.scrollHeight;
    while (body.children.length > 500) {
        body.removeChild(body.firstChild);
    }
}

function execCmd() {
    var input = document.getElementById('consoleInput');
    var cmd = input.value.trim();
    if (!cmd) return;
    
    consoleLog('> ' + cmd, 'cmd');
    input.value = '';
    input.focus();
    
    var parts = cmd.split(' ');
    var main = parts[0].toLowerCase();
    var args = parts.slice(1);
    
    switch(main) {
        case 'help':
            consoleLog('=== PERINTAH ===', 'info');
            consoleLog('fix - Auto fix sistem', 'info');
            consoleLog('status - Cek status', 'info');
            consoleLog('test - Test sistem', 'info');
            consoleLog('codec - Cek codec', 'info');
            consoleLog('analyze - Analisis teks', 'info');
            consoleLog('log - Tampilkan log', 'info');
            consoleLog('clearlog - Bersihkan log', 'info');
            consoleLog('reset - Reset semua', 'info');
            consoleLog('github - Set GitHub (token username repo)', 'info');
            consoleLog('githubset [token] [username] [repo] - Set GitHub', 'info');
            consoleLog('push - Push ke GitHub', 'info');
            consoleLog('pushauto - Fix + Push otomatis', 'info');
            consoleLog('fixpush - Perbaiki + Push', 'info');
            break;
            
        case 'fix':
            autoFix();
            break;
            
        case 'status':
            consoleLog('Generating: ' + (S.generating ? 'YES' : 'NO'), 'info');
            consoleLog('Video: ' + (S.blob ? (S.blob.size/1024).toFixed(1) + ' KB' : 'None'), 'info');
            consoleLog('Problems: ' + S.problems.length, S.problems.length > 0 ? 'warning' : 'success');
            consoleLog('GitHub: ' + (S.github.token ? 'Configured (' + S.github.username + '/' + S.github.repo + ')' : 'Not configured'), S.github.token ? 'success' : 'warning');
            break;
            
        case 'test':
            testSystem();
            break;
            
        case 'codec':
            var codecs = ['video/webm;codecs=vp8,opus', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
            codecs.forEach(function(c) {
                var supported = MediaRecorder.isTypeSupported(c);
                consoleLog((supported ? '✓ ' : '✗ ') + c, supported ? 'success' : 'error');
            });
            break;
            
        case 'analyze':
            analyzeText();
            if (S.analysis) {
                consoleLog('Genre: ' + S.analysis.genre, 'info');
                consoleLog('Durasi: ' + S.analysis.duration + 's', 'info');
                consoleLog('Scene: ' + S.analysis.scenes, 'info');
                consoleLog('Emosi: ' + S.analysis.emotion, 'info');
            }
            break;
            
        case 'log':
            if (S.problems.length === 0) {
                consoleLog('Tidak ada masalah', 'success');
            } else {
                S.problems.forEach(function(p, i) {
                    consoleLog((i+1) + '. ' + p.msg, 'warning');
                });
            }
            break;
            
        case 'clearlog':
            S.problems = [];
            updateLogPanel();
            consoleLog('Log dibersihkan', 'success');
            break;
            
        case 'reset':
            resetAll();
            break;
            
        case 'github':
            setGitHubInteractive();
            break;
            
        case 'githubset':
            if (args.length >= 3) {
                setGitHub(args[0], args[1], args[2]);
            } else {
                consoleLog('Format: githubset [token] [username] [repo]', 'error');
                consoleLog('Contoh: githubset ghp_xxx username repo', 'warning');
            }
            break;
            
        case 'push':
            pushToGitHub();
            break;
            
        case 'pushauto':
        case 'fixpush':
            consoleLog('Menjalankan auto fix + push...', 'info');
            autoFix();
            setTimeout(function() { pushToGitHub(); }, 1000);
            break;
            
        default:
            consoleLog('Perintah tidak dikenal: ' + cmd, 'error');
            consoleLog('Ketik "help" untuk bantuan', 'info');
    }
}

// Enter key handler
document.addEventListener('DOMContentLoaded', function() {
    var input = document.getElementById('consoleInput');
    if (input) {
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                execCmd();
            }
        });
    }
});

// ========== GITHUB ==========
function setGitHubInteractive() {
    consoleLog('=== SET GITHUB ===', 'info');
    consoleLog('Masukkan token:', 'warning');
    
    var token = prompt('GitHub Token:');
    if (!token) { consoleLog('Dibatalkan', 'warning'); return; }
    
    var username = prompt('Username GitHub:');
    if (!username) { consoleLog('Dibatalkan', 'warning'); return; }
    
    var repo = prompt('Nama Repository:');
    if (!repo) { consoleLog('Dibatalkan', 'warning'); return; }
    
    setGitHub(token, username, repo);
}

function setGitHub(token, username, repo) {
    S.github = {
        token: token,
        username: username,
        repo: repo
    };
    
    try {
        localStorage.setItem('github_config', JSON.stringify(S.github));
    } catch(e) {}
    
    consoleLog('GitHub dikonfigurasi:', 'success');
    consoleLog('Username: ' + username, 'info');
    consoleLog('Repo: ' + repo, 'info');
    consoleLog('Token: ' + token.substring(0, 8) + '...', 'info');
    
    toast('GitHub dikonfigurasi!', 'success');
}

function pushToGitHub() {
    if (!S.github.token || !S.github.username || !S.github.repo) {
        consoleLog('GitHub belum dikonfigurasi!', 'error');
        consoleLog('Gunakan: githubset [token] [username] [repo]', 'warning');
        setGitHubInteractive();
        return;
    }
    
    consoleLog('Push ke GitHub: ' + S.github.username + '/' + S.github.repo, 'info');
    
    var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    var content = btoa(unescape(encodeURIComponent(html)));
    
    var url = 'https://api.github.com/repos/' + S.github.username + '/' + S.github.repo + '/contents/index.html';
    
    // Cek file existing
    fetch(url, {
        headers: {
            'Authorization': 'token ' + S.github.token,
            'Accept': 'application/vnd.github.v3+json'
        }
    })
    .then(function(res) {
        if (res.status === 404) {
            return { sha: null };
        }
        if (res.status === 401) {
            throw new Error('Token tidak valid (401)');
        }
        if (res.status === 403) {
            throw new Error('Rate limit atau permission (403)');
        }
        return res.json();
    })
    .then(function(data) {
        if (data.message && data.message.includes('Not Found')) {
            return { sha: null };
        }
        return data;
    })
    .then(function(data) {
        var body = {
            message: 'Update YAD Video AI v8.0 - ' + new Date().toISOString(),
            content: content,
            branch: 'main'
        };
        
        if (data && data.sha) {
            body.sha = data.sha;
            consoleLog('File ditemukan, update...', 'info');
        } else {
            consoleLog('File baru, create...', 'info');
        }
        
        return fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': 'token ' + S.github.token,
                'Content-Type': 'application/json',
                'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify(body)
        });
    })
    .then(function(res) {
        if (res.status === 401) {
            throw new Error('Token tidak valid!');
        }
        if (res.status === 403) {
            throw new Error('Rate limit tercapai!');
        }
        if (res.status === 422) {
            throw new Error('Validasi gagal - cek repo dan branch');
        }
        return res.json();
    })
    .then(function(data) {
        if (data.content) {
            consoleLog('Push berhasil!', 'success');
            consoleLog('URL: ' + data.content.html_url, 'info');
            toast('Berhasil push ke GitHub!', 'success');
        } else if (data.message) {
            throw new Error(data.message);
        } else {
            consoleLog('Push berhasil!', 'success');
            toast('Berhasil push!', 'success');
        }
    })
    .catch(function(e) {
        consoleLog('Push gagal: ' + e.message, 'error');
        toast('Push gagal: ' + e.message, 'error');
    });
}

// ========== AUTO FIX ==========
function autoFix() {
    consoleLog('Auto fix...', 'info');
    updateStatus('busy', 'FIXING');
    
    if (!window.MediaRecorder) {
        logProblem('MediaRecorder tidak didukung');
        updateStatus('error', 'ERROR');
        return false;
    }
    consoleLog('✓ MediaRecorder', 'success');
    
    var codec = 'video/webm;codecs=vp8';
    if (!MediaRecorder.isTypeSupported(codec)) {
        codec = 'video/webm';
        if (!MediaRecorder.isTypeSupported(codec)) {
            logProblem('Tidak ada codec');
            updateStatus('error', 'ERROR');
            return false;
        }
    }
    consoleLog('✓ Codec: ' + codec, 'success');
    
    try {
        var c = document.createElement('canvas');
        c.getContext('2d');
        consoleLog('✓ Canvas', 'success');
    } catch(e) {
        logProblem('Canvas error');
        updateStatus('error', 'ERROR');
        return false;
    }
    
    updateStatus('ready', 'READY');
    toast('Auto fix selesai!', 'success');
    return true;
}

function updateStatus(type, text) {
    var badge = document.getElementById('statusBadge');
    if (badge) {
        badge.className = 'status-badge ' + type;
        badge.textContent = text;
    }
}

// ========== TEST ==========
function testSystem() {
    consoleLog('Testing...', 'info');
    
    try {
        var canvas = document.createElement('canvas');
        canvas.width = 100;
        canvas.height = 100;
        var ctx = canvas.getContext('2d');
        ctx.fillRect(0, 0, 100, 100);
        
        var stream = canvas.captureStream(10);
        var codec = 'video/webm;codecs=vp8';
        if (!MediaRecorder.isTypeSupported(codec)) codec = 'video/webm';
        
        var rec = new MediaRecorder(stream, {mimeType: codec});
        var chunks = [];
        
        rec.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
        rec.onstop = function() {
            var blob = new Blob(chunks, {type: codec});
            consoleLog('Test: ' + blob.size + ' bytes', blob.size > 0 ? 'success' : 'error');
            if (blob.size > 0) {
                toast('Sistem OK!', 'success');
            } else {
                logProblem('Test video kosong');
                toast('Test gagal!', 'error');
            }
        };
        
        rec.start(100);
        setTimeout(function() { if (rec.state !== 'inactive') rec.stop(); }, 800);
        
    } catch(e) {
        logProblem('Test error: ' + e.message);
        toast('Test gagal!', 'error');
    }
}

// ========== TEXT ANALYSIS ==========
function analyzeText() {
    var text = document.getElementById('storyInput').value.trim();
    if (text.length < 10) {
        document.getElementById('analysisBox').classList.remove('active');
        return;
    }
    
    var genre = detectGenre(text);
    var duration = Math.max(5, Math.ceil(text.split(/\s+/).length / 2.5));
    var scenes = text.split('\n\n').filter(function(p) { return p.trim(); }).length;
    var emotion = detectEmotion(text);
    
    S.analysis = { genre: genre, duration: duration, scenes: scenes, emotion: emotion };
    
    document.getElementById('analysisGenre').textContent = 'Genre: ' + genre;
    document.getElementById('analysisDuration').textContent = 'Durasi: ' + duration + ' detik';
    document.getElementById('analysisScenes').textContent = 'Scene: ' + scenes;
    document.getElementById('analysisEmotion').textContent = 'Emosi: ' + emotion;
    document.getElementById('analysisBox').classList.add('active');
    
    var styleSelect = document.getElementById('styleSelect');
    if (styleSelect.value === 'auto') {
        styleSelect.value = genre;
    }
}

function detectGenre(text) {
    var lower = text.toLowerCase();
    var genres = {
        horror: ['hantu', 'setan', 'malam', 'gelap', 'takut', 'seram', 'horor', 'boneka', 'menyeramkan', 'angker'],
        fantasy: ['ajaib', 'sihir', 'naga', 'putri', 'istana', 'peri', 'penyihir', 'kastil'],
        adventure: ['petualang', 'gunung', 'laut', 'hutan', 'pulau', 'harta', 'jelajah'],
        romance: ['cinta', 'kasih', 'sayang', 'rindu', 'hati', 'kencan', 'bunga'],
        sad: ['sedih', 'menangis', 'air mata', 'kehilangan', 'duka', 'pilu'],
        action: ['bertarung', 'pedang', 'tembak', 'kejar', 'lawan', 'serang']
    };
    
    var best = 'neutral';
    var bestScore = 0;
    
    for (var genre in genres) {
        var score = 0;
        for (var i = 0; i < genres[genre].length; i++) {
            if (lower.indexOf(genres[genre][i]) > -1) score++;
        }
        if (score > bestScore) {
            bestScore = score;
            best = genre;
        }
    }
    
    return best;
}

function detectEmotion(text) {
    var lower = text.toLowerCase();
    var emotions = {
        'Takut': ['takut', 'seram', 'ngeri', 'horor'],
        'Sedih': ['sedih', 'menangis', 'duka'],
        'Senang': ['senang', 'bahagia', 'gembira'],
        'Marah': ['marah', 'kesal', 'geram'],
        'Tegang': ['tegang', 'menegangkan']
    };
    
    for (var e in emotions) {
        for (var i = 0; i < emotions[e].length; i++) {
            if (lower.indexOf(emotions[e][i]) > -1) return e;
        }
    }
    return 'Netral';
}

// ========== GENERATE VIDEO ==========
function generateVideo() {
    var text = document.getElementById('storyInput').value.trim();
    if (!text) { toast('Tulis cerita dulu!', 'error'); return; }
    if (S.generating) { toast('Masih generating!', 'warning'); return; }
    
    S.generating = true;
    S.chunks = [];
    updateStatus('busy', 'GENERATING');
    
    analyzeText();
    var genre = S.analysis ? S.analysis.genre : 'neutral';
    var style = document.getElementById('styleSelect').value;
    if (style === 'auto') style = genre;
    
    var resolution = document.getElementById('resolutionSelect').value;
    var durationSelect = document.getElementById('durationSelect').value;
    var durationPerScene = durationSelect === 'auto' ? Math.max(3, Math.ceil(S.analysis.duration / S.analysis.scenes)) : parseInt(durationSelect);
    var voice = document.getElementById('voiceSelect').value;
    var volume = parseFloat(document.getElementById('volumeSelect').value);
    
    var dims = resolution.split('x');
    var width = parseInt(dims[0]);
    var height = parseInt(dims[1]);
    var fps = 25;
    
    var progressContainer = document.getElementById('progressContainer');
    var progressFill = document.getElementById('progressFill');
    var progressText = document.getElementById('progressText');
    var generateBtn = document.getElementById('generateBtn');
    
    progressContainer.classList.add('active');
    generateBtn.disabled = true;
    generateBtn.textContent = 'Generating...';
    
    consoleLog('Generate: ' + width + 'x' + height + ', ' + genre, 'info');
    consoleLog('Durasi/scene: ' + durationPerScene + 's', 'info');
    
    autoFix();
    
    var canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    var ctx = canvas.getContext('2d');
    
    var canvasStream = canvas.captureStream(fps);
    
    var codec = 'video/webm;codecs=vp8';
    if (!MediaRecorder.isTypeSupported(codec)) codec = 'video/webm';
    
    var recorder;
    try {
        recorder = new MediaRecorder(canvasStream, {
            mimeType: codec,
            videoBitsPerSecond: 2000000
        });
    } catch(e) {
        logProblem('Recorder error: ' + e.message);
        toast('Gagal membuat recorder!', 'error');
        finishGenerate();
        return;
    }
    
    recorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) S.chunks.push(e.data);
    };
    
    recorder.onstop = function() {
        if (S.chunks.length === 0) {
            logProblem('Video kosong');
            toast('Video kosong!', 'error');
            updateStatus('error', 'ERROR');
            finishGenerate();
            return;
        }
        
        var blob = new Blob(S.chunks, {type: codec});
        S.blob = blob;
        
        var url = URL.createObjectURL(blob);
        var video = document.getElementById('videoPreview');
        video.src = url;
        video.load();
        
        video.onloadeddata = function() {
            toast('Video berhasil!', 'success');
            updateStatus('ready', 'READY');
        };
        
        var paragraphs = text.split('\n\n').filter(function(p) { return p.trim(); });
        document.getElementById('videoInfo').textContent = 'Size: ' + (blob.size/1024).toFixed(1) + ' KB | ' + paragraphs.length + ' scene';
        document.getElementById('videoContainer').classList.add('active');
        
        S.chunks = [];
        finishGenerate();
    };
    
    recorder.onerror = function(e) {
        logProblem('Recorder error: ' + e.error);
        toast('Recorder error!', 'error');
        finishGenerate();
    };
    
    recorder.start(500);
    
    var paragraphs = text.split('\n\n').filter(function(p) { return p.trim(); });
    if (paragraphs.length === 0) paragraphs = [text];
    
    var totalFrames = paragraphs.length * durationPerScene * fps;
    var frameCount = 0;
    
    function renderScene(sceneIndex) {
        if (sceneIndex >= paragraphs.length) {
            progressText.textContent = 'Finalizing...';
            progressFill.style.width = '90%';
            setTimeout(function() {
                if (recorder.state !== 'inactive') recorder.stop();
            }, 500);
            return;
        }
        
        progressText.textContent = 'Scene ' + (sceneIndex+1) + '/' + paragraphs.length;
        
        var paragraph = paragraphs[sceneIndex];
        var framesForScene = durationPerScene * fps;
        var frameInScene = 0;
        
        // Speech
        try {
            var utterance = new SpeechSynthesisUtterance(paragraph);
            utterance.lang = voice;
            utterance.rate = 0.9;
            utterance.volume = volume;
            speechSynthesis.speak(utterance);
        } catch(e) {}
        
        function renderFrame() {
            if (frameInScene >= framesForScene) {
                renderScene(sceneIndex + 1);
                return;
            }
            
            drawComicFrame(ctx, width, height, style, paragraph, sceneIndex, frameInScene, framesForScene, genre);
            
            frameCount++;
            var progress = 10 + (frameCount / totalFrames) * 80;
            progressFill.style.width = progress + '%';
            
            frameInScene++;
            setTimeout(renderFrame, 1000 / fps);
        }
        
        renderFrame();
    }
    
    renderScene(0);
}

function drawComicFrame(ctx, w, h, style, text, sceneIndex, frame, totalFrames, genre) {
    var progress = frame / totalFrames;
    
    var colors = {
        horror: ['#1a0a0a', '#0d0d0d', '#2a0a0a'],
        fantasy: ['#1a0533', '#2a1a4a', '#0a0a2e'],
        adventure: ['#1a3a1a', '#2a4a2a', '#0a1a0a'],
        romance: ['#3a1a1a', '#4a2a2a', '#1a0a0a'],
        sad: ['#2a2a2a', '#1a1a1a', '#3a3a3a'],
        action: ['#3a1a0a', '#2a0a0a', '#1a0a0a'],
        neutral: ['#1a1a2e', '#16213e', '#0f3460']
    };
    var c = colors[genre] || colors[style] || colors.neutral;
    
    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, c[0]);
    grad.addColorStop(1, c[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    
    // Comic border
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.strokeRect(10, 10, w - 20, h - 20);
    
    // Icon
    var icons = {
        horror: ['👻', '💀', '🎃', '👹'],
        fantasy: ['🐉', '🧙', '🏰', '✨'],
        adventure: ['🗺️', '🏔️', '⚔️', '🧭'],
        romance: ['💕', '🌹', '💑', '💖'],
        sad: ['😢', '💔', '🌧️', '🥀'],
        action: ['💥', '⚡', '🔥', '🗡️'],
        neutral: ['📖', '🎬', '📝', '🎭']
    };
    var iconList = icons[genre] || icons[style] || icons.neutral;
    var icon = iconList[sceneIndex % iconList.length];
    
    var iconSize = Math.floor(h / 3);
    var iconX = w / 2 + Math.sin(progress * Math.PI * 2) * 30;
    var iconY = h / 3 + Math.cos(progress * Math.PI * 3) * 15;
    
    ctx.font = iconSize + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(icon, iconX, iconY);
    
    // Speech bubble
    var bubbleX = w / 2;
    var bubbleY = h * 0.65;
    var bubbleW = Math.min(w * 0.7, 400);
    var bubbleH = Math.min(h * 0.25, 100);
    
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(bubbleX, bubbleY, bubbleW/2, bubbleH/2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    
    var fadeIn = Math.min(1, (frame / totalFrames) * 3);
    ctx.save();
    ctx.globalAlpha = fadeIn;
    ctx.fillStyle = '#000';
    var fontSize = Math.min(14, Math.floor(w / 60));
    ctx.font = 'bold ' + fontSize + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    var shortText = text.length > 60 ? text.substring(0, 60) + '...' : text;
    ctx.fillText(shortText, bubbleX, bubbleY);
    ctx.restore();
    
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '10px Arial';
    ctx.textAlign = 'right';
    ctx.fillText('Panel ' + (sceneIndex + 1), w - 25, h - 20);
}

function finishGenerate() {
    S.generating = false;
    var btn = document.getElementById('generateBtn');
    if (btn) {
        btn.disabled = false;
        btn.textContent = '🎬 Generate Video';
    }
    var progress = document.getElementById('progressContainer');
    if (progress) progress.classList.remove('active');
}

// ========== DOWNLOAD ==========
function downloadVideo() {
    if (!S.blob) { toast('Belum ada video!', 'error'); return; }
    
    var url = URL.createObjectURL(S.blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'yad_video_' + Date.now() + '.webm';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
    toast('Download dimulai!', 'success');
}

// ========== LOG ==========
function logProblem(msg) {
    S.problems.push({ time: new Date().toISOString(), msg: msg });
    updateLogPanel();
}

function openLogPanel() {
    document.getElementById('logPanel').classList.add('show');
    updateLogPanel();
}

function closeLogPanel() {
    document.getElementById('logPanel').classList.remove('show');
}

function updateLogPanel() {
    var body = document.getElementById('logBody');
    if (!body) return;
    if (S.problems.length === 0) {
        body.textContent = 'Belum ada masalah.';
        return;
    }
    body.textContent = S.problems.map(function(p, i) {
        return '[' + (i+1) + '] ' + p.time + '\n' + p.msg + '\n---';
    }).join('\n');
}

function copyLog() {
    if (S.problems.length === 0) { toast('Tidak ada log', 'info'); return; }
    var text = S.problems.map(function(p, i) { return '[' + (i+1) + '] ' + p.msg; }).join('\n');
    
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function() { toast('Log disalin!', 'success'); });
    }
}

function downloadLog() {
    if (S.problems.length === 0) { toast('Tidak ada log', 'info'); return; }
    var text = S.problems.map(function(p, i) { return '[' + (i+1) + '] ' + p.time + '\n' + p.msg + '\n---'; }).join('\n');
    
    var blob = new Blob([text], {type: 'text/plain'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'log_' + Date.now() + '.txt';
    a.click();
}

function clearLog() {
    S.problems = [];
    updateLogPanel();
    toast('Log dibersihkan!', 'info');
}

// ========== RESET ==========
function resetAll() {
    if (!confirm('Reset semua data?')) return;
    
    try { localStorage.clear(); } catch(e) {}
    
    S.blob = null;
    S.problems = [];
    S.chunks = [];
    S.generating = false;
    S.github = {};
    
    var video = document.getElementById('videoPreview');
    if (video) video.src = '';
    
    var container = document.getElementById('videoContainer');
    if (container) container.classList.remove('active');
    
    var input = document.getElementById('storyInput');
    if (input) input.value = '';
    
    updateLogPanel();
    updateStatus('ready', 'READY');
    toast('Reset selesai!', 'info');
}

// ========== INIT ==========
function init() {
    consoleLog('YAD Video AI v8.0 initialized', 'success');
    consoleLog('Ketik "help" untuk bantuan', 'info');
    
    if (S.github.token) {
        consoleLog('GitHub: ' + S.github.username + '/' + S.github.repo, 'success');
    }
    
    autoFix();
}

init();
