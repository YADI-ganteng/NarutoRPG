<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAD Video AI - Final Stable v5.0</title>
    <style>
        :root{--bg:#0a0a14;--card:#12122a;--input:#0d0d20;--text:#e8e8f0;--dim:#9090a8;--accent:#8b5cf6;--green:#10b981;--red:#ef4444;--gold:#f59e0b;--border:#252540;--radius:14px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
        
        .header{background:rgba(10,10,20,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:10px}
        .logo{font-size:18px;font-weight:800;background:linear-gradient(135deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
        .btn{padding:8px 12px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:10px;font-weight:600;font-family:inherit;transition:all .2s;white-space:nowrap}
        .btn:hover{background:#1a1a35;border-color:var(--accent)}
        .btn-primary{background:var(--accent);color:#fff;border:none}
        .btn-success{background:var(--green);color:#fff;border:none}
        .btn-danger{background:var(--red);color:#fff;border:none}
        .btn-warning{background:var(--gold);color:#000;border:none}
        
        .container{max-width:900px;margin:0 auto;padding:20px}
        .card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;border:1px solid var(--border)}
        .card h2{font-size:16px;color:var(--accent);margin-bottom:12px}
        textarea{width:100%;min-height:150px;padding:14px;background:var(--input);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;line-height:1.6;resize:vertical;font-family:Georgia,serif;outline:none}
        textarea:focus{border-color:var(--accent)}
        
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
        .setting{background:var(--input);padding:10px;border-radius:8px;border:1px solid var(--border)}
        .setting label{display:block;font-size:9px;color:var(--dim);margin-bottom:4px;text-transform:uppercase;font-weight:600}
        .setting select{width:100%;padding:6px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;outline:none}
        
        .btn-generate{width:100%;padding:14px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:all .3s}
        .btn-generate:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(139,92,246,.4)}
        .btn-generate:disabled{opacity:.5;cursor:not-allowed}
        
        .progress{display:none;margin:16px 0}
        .progress.active{display:block}
        .progress-bar{width:100%;height:10px;background:var(--input);border-radius:5px;overflow:hidden;border:1px solid var(--border)}
        .progress-fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#ec4899,#06b6d4);width:0%;transition:width .3s}
        .progress-text{text-align:center;font-size:10px;color:var(--dim);margin-top:6px}
        
        .video-container{display:none;margin-top:16px}
        .video-container.active{display:block}
        video{width:100%;border-radius:10px;border:2px solid var(--border);background:#000;max-height:350px}
        .video-info{font-size:10px;color:var(--dim);text-align:center;margin:8px 0}
        
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;color:#fff;font-size:12px;z-index:10000;animation:slideDown .3s;max-width:90%;text-align:center}
        .toast.success{background:var(--green)}
        .toast.error{background:var(--red)}
        .toast.info{background:#06b6d4}
        .toast.warning{background:var(--gold);color:#000}
        @keyframes slideDown{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
        
        .console-panel{position:fixed;top:60px;right:10px;width:450px;max-width:95vw;max-height:70vh;background:#0a0a0a;border-radius:10px;border:2px solid #00ff00;display:none;flex-direction:column;z-index:9999;overflow:hidden}
        .console-panel.show{display:flex}
        .console-header{background:#0d1a0d;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a3a1a}
        .console-body{flex:1;overflow-y:auto;padding:8px;font-family:monospace;font-size:9px;color:#00ff00;background:#000;min-height:150px}
        .console-line{margin:1px 0;line-height:1.4;word-break:break-word}
        .console-line.error{color:#f44}.console-line.success{color:#4f4}.console-line.info{color:#4af}.console-line.warning{color:#fa4}
        .console-input{display:flex;padding:6px;background:#0d0d0d;border-top:1px solid #1a3a1a}
        .console-input input{flex:1;background:transparent;border:none;color:#00ff00;font-family:monospace;font-size:10px;outline:none}
        
        .log-panel{position:fixed;top:60px;left:10px;width:350px;max-width:95vw;max-height:70vh;background:#0a0a0a;border-radius:10px;border:2px solid #ffaa44;display:none;flex-direction:column;z-index:9999;overflow:hidden}
        .log-panel.show{display:flex}
        .log-header{background:#1a0d00;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3a1a00}
        .log-body{flex:1;overflow-y:auto;padding:8px;font-family:monospace;font-size:8px;color:#ffaa44;background:#0a0a0a;min-height:100px;white-space:pre-wrap}
        .log-actions{display:flex;gap:4px;padding:6px;background:#0d0d0d;border-top:1px solid #3a1a00}
        .log-actions button{flex:1;padding:5px;font-size:8px;border-radius:4px;border:1px solid #ffaa44;background:transparent;color:#ffaa44;cursor:pointer;font-family:inherit}
    </style>
</head>
<body>

<header class="header">
    <div class="logo">🎬 YAD Video AI <span style="font-size:8px;color:#10b981">v5.0 STABLE</span></div>
    <div class="nav">
        <button class="btn btn-primary" onclick="openConsole()">🖥️ Console</button>
        <button class="btn" style="border-color:#ffaa44;color:#ffaa44" onclick="openLogPanel()">📋 Log</button>
        <button class="btn btn-success" onclick="autoFix()">🔧 Fix</button>
        <button class="btn btn-warning" onclick="pushToGitHub()">📤 Push</button>
        <button class="btn btn-danger" onclick="resetAll()">🗑️ Reset</button>
    </div>
</header>

<div class="console-panel" id="consolePanel">
    <div class="console-header">
        <span style="color:#0f0;font-family:monospace;font-size:10px;font-weight:bold">🖥️ Console</span>
        <button onclick="closeConsole()" style="background:none;border:none;color:#f44;cursor:pointer;font-size:16px">✕</button>
    </div>
    <div class="console-body" id="consoleBody"></div>
    <div class="console-input">
        <span style="color:#0f0;margin-right:4px;font-family:monospace">➜</span>
        <input type="text" id="consoleInput" placeholder="help, fix, status, test..." onkeydown="if(event.key==='Enter')execCmd()">
    </div>
</div>

<div class="log-panel" id="logPanel">
    <div class="log-header">
        <span style="color:#ffaa44;font-family:monospace;font-size:10px;font-weight:bold">📋 Log Masalah</span>
        <button onclick="closeLogPanel()" style="background:none;border:none;color:#f44;cursor:pointer;font-size:16px">✕</button>
    </div>
    <div class="log-body" id="logBody">Belum ada masalah.</div>
    <div class="log-actions">
        <button onclick="copyLog()">📋 Copy</button>
        <button onclick="downloadLog()">💾 Save</button>
        <button onclick="clearLog()">🗑️ Clear</button>
    </div>
</div>

<div class="container">
    <div class="card">
        <h2>📝 Tulis Cerita</h2>
        <textarea id="storyInput" placeholder="Tulis cerita di sini...&#10;&#10;Setiap paragraf menjadi satu scene."></textarea>
        <div class="grid">
            <div class="setting">
                <label>🎨 Gaya</label>
                <select id="styleSelect">
                    <option value="horror">👻 Horor</option>
                    <option value="fantasy">✨ Fantasi</option>
                    <option value="adventure">🗺️ Petualangan</option>
                    <option value="romance">💕 Romantis</option>
                    <option value="sad">😢 Sedih</option>
                </select>
            </div>
            <div class="setting">
                <label>📐 Resolusi</label>
                <select id="resolutionSelect">
                    <option value="320x240">Low (320x240)</option>
                    <option value="640x360" selected>SD (640x360)</option>
                    <option value="1280x720">HD (1280x720)</option>
                </select>
            </div>
            <div class="setting">
                <label>⏱️ Durasi/Scene</label>
                <select id="durationSelect">
                    <option value="2">2 detik</option>
                    <option value="3" selected>3 detik</option>
                    <option value="5">5 detik</option>
                </select>
            </div>
        </div>
        <p style="font-size:10px;color:var(--dim);margin-top:8px;text-align:center">
            ⚠️ Video dihasilkan tanpa audio (keterbatasan browser). Gunakan resolusi Low/SD untuk hasil terbaik.
        </p>
    </div>
    
    <button class="btn-generate" id="generateBtn" onclick="generateVideo()">🎬 Generate Video</button>
    
    <div class="progress" id="progressContainer">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">Memulai...</div>
    </div>
    
    <div class="video-container" id="videoContainer">
        <video id="videoPreview" controls playsinline></video>
        <div class="video-info" id="videoInfo"></div>
        <button class="btn-generate" style="margin-top:10px" onclick="downloadVideo()">💾 Download Video</button>
    </div>
</div>

<script>
// ============================================================
// STATE MANAGEMENT (Isolated)
// ============================================================
var appState = {
    generatedBlob: null,
    isGenerating: false,
    problems: [],
    chunks: [],
    recorder: null,
    stream: null,
    canvas: null,
    ctx: null
};

// ============================================================
// TOAST SYSTEM
// ============================================================
function toast(msg, type) {
    type = type || 'info';
    var toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(function() { toast.remove(); }, 4000);
}

// ============================================================
// CONSOLE SYSTEM
// ============================================================
function openConsole() {
    document.getElementById('consolePanel').classList.add('show');
    document.getElementById('consoleInput').focus();
}

function closeConsole() {
    document.getElementById('consolePanel').classList.remove('show');
}

function consoleLog(msg, type) {
    type = type || 'info';
    var body = document.getElementById('consoleBody');
    if (!body) return;
    var line = document.createElement('div');
    line.className = 'console-line ' + type;
    line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    body.appendChild(line);
    body.scrollTop = body.scrollHeight;
    while (body.children.length > 300) {
        body.removeChild(body.firstChild);
    }
}

function execCmd() {
    var inp = document.getElementById('consoleInput');
    var cmd = inp.value.trim().toLowerCase();
    if (!cmd) return;
    consoleLog('> ' + cmd, 'info');
    inp.value = '';
    
    var parts = cmd.split(' ');
    var main = parts[0];
    
    switch(main) {
        case 'help':
            consoleLog('Commands: fix, status, test, codec, log, clearlog, reset', 'info');
            break;
        case 'fix':
            autoFix();
            break;
        case 'status':
            consoleLog('Generating: ' + (appState.isGenerating ? 'Yes' : 'No'), 'info');
            consoleLog('Video: ' + (appState.generatedBlob ? (appState.generatedBlob.size / 1024).toFixed(1) + ' KB' : 'None'), 'info');
            consoleLog('Problems: ' + appState.problems.length, appState.problems.length > 0 ? 'warning' : 'success');
            break;
        case 'test':
            testSystem();
            break;
        case 'codec':
            var codecs = getSupportedCodecs();
            consoleLog('Supported codecs:', 'info');
            codecs.forEach(function(c) { consoleLog('  OK ' + c, 'success'); });
            if (codecs.length === 0) consoleLog('  NO CODEC!', 'error');
            break;
        case 'log':
            appState.problems.forEach(function(p, i) {
                consoleLog((i + 1) + '. ' + p.msg, 'warning');
            });
            break;
        case 'clearlog':
            appState.problems = [];
            updateLogPanel();
            consoleLog('Log cleared', 'success');
            break;
        case 'reset':
            resetAll();
            break;
        default:
            consoleLog('Unknown: ' + cmd, 'error');
    }
}

// ============================================================
// LOG SYSTEM
// ============================================================
function logProblem(msg, severity) {
    severity = severity || 'warning';
    appState.problems.push({
        time: new Date().toISOString(),
        msg: msg,
        severity: severity,
        browser: detectBrowser(),
        codec: getSupportedCodecs()
    });
    updateLogPanel();
    consoleLog('PROBLEM: ' + msg, 'warning');
}

function detectBrowser() {
    var ua = navigator.userAgent;
    if (ua.indexOf('Chrome') > -1) return 'Chrome';
    if (ua.indexOf('Firefox') > -1) return 'Firefox';
    if (ua.indexOf('Safari') > -1) return 'Safari';
    if (ua.indexOf('Edge') > -1) return 'Edge';
    return 'Other';
}

function getSupportedCodecs() {
    var list = [];
    var codecs = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
    if (window.MediaRecorder) {
        codecs.forEach(function(c) {
            try {
                if (MediaRecorder.isTypeSupported(c)) list.push(c);
            } catch(e) {}
        });
    }
    return list;
}

function openLogPanel() {
    document.getElementById('logPanel').classList.add('show');
    updateLogPanel();
}

function closeLogPanel() {
    document.getElementById('logPanel').classList.remove('show');
}

function updateLogPanel() {
    var body = document.getElementById('logBody');
    if (!body) return;
    if (appState.problems.length === 0) {
        body.textContent = 'Belum ada masalah.';
        return;
    }
    body.textContent = appState.problems.map(function(p, i) {
        return '[' + (i + 1) + '] ' + p.time + '\n' +
               'Browser: ' + p.browser + '\n' +
               'Codec: ' + (p.codec.join(', ') || 'None') + '\n' +
               'Severity: ' + p.severity + '\n' +
               'Message: ' + p.msg + '\n---';
    }).join('\n');
}

function copyLog() {
    if (appState.problems.length === 0) {
        toast('Tidak ada log', 'info');
        return;
    }
    var text = appState.problems.map(function(p, i) {
        return '[' + (i + 1) + '] ' + p.time + ' - ' + p.msg + ' (Browser: ' + p.browser + ')';
    }).join('\n');
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
            toast('Log disalin!', 'success');
        }).catch(function() {
            fallbackCopy(text);
        });
    } else {
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('Log disalin!', 'success');
}

function downloadLog() {
    if (appState.problems.length === 0) {
        toast('Tidak ada log', 'info');
        return;
    }
    var text = appState.problems.map(function(p, i) {
        return '[' + (i + 1) + '] ' + p.time + '\n' +
               'Browser: ' + p.browser + '\n' +
               'Message: ' + p.msg + '\n' +
               'Codec: ' + p.codec.join(', ') + '\n---';
    }).join('\n');
    
    var blob = new Blob([text], { type: 'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'yad_log_' + Date.now() + '.txt';
    a.click();
    URL.revokeObjectURL(url);
    toast('Log didownload!', 'success');
}

function clearLog() {
    appState.problems = [];
    updateLogPanel();
    toast('Log dibersihkan!', 'info');
}

// ============================================================
// AUTO FIX (Synchronous - No Promise Issues)
// ============================================================
function autoFix() {
    consoleLog('Running auto fix...', 'info');
    
    // Check MediaRecorder
    if (!window.MediaRecorder) {
        logProblem('MediaRecorder tidak didukung browser ini', 'error');
        toast('Browser tidak mendukung perekaman video', 'error');
        return false;
    }
    consoleLog('MediaRecorder: OK', 'success');
    
    // Check codec
    var codecs = getSupportedCodecs();
    if (codecs.length === 0) {
        logProblem('Tidak ada codec yang didukung', 'error');
        toast('Tidak ada codec video', 'error');
        return false;
    }
    consoleLog('Codec: ' + codecs[0], 'success');
    
    // Check canvas
    try {
        var c = document.createElement('canvas');
        var ctx = c.getContext('2d');
        if (!ctx) throw new Error('Canvas 2D not available');
        consoleLog('Canvas: OK', 'success');
    } catch(e) {
        logProblem('Canvas error: ' + e.message, 'error');
        return false;
    }
    
    // Save config
    try {
        localStorage.setItem('video_config', JSON.stringify({
            codec: codecs[0],
            time: Date.now()
        }));
    } catch(e) {
        consoleLog('Warning: Cannot save config', 'warning');
    }
    
    toast('Auto fix selesai!', 'success');
    return true;
}

// ============================================================
// TEST SYSTEM
// ============================================================
function testSystem() {
    consoleLog('Testing system...', 'info');
    
    try {
        var canvas = document.createElement('canvas');
        canvas.width = 100;
        canvas.height = 100;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(0, 0, 100, 100);
        
        var stream = canvas.captureStream(10);
        var codecs = getSupportedCodecs();
        var codec = codecs[0] || 'video/webm';
        
        var recorder = new MediaRecorder(stream, { mimeType: codec });
        var testChunks = [];
        
        recorder.ondataavailable = function(e) {
            if (e.data.size > 0) testChunks.push(e.data);
        };
        
        recorder.onstop = function() {
            var blob = new Blob(testChunks, { type: codec });
            consoleLog('Test result: ' + blob.size + ' bytes', blob.size > 0 ? 'success' : 'error');
            
            if (blob.size === 0) {
                logProblem('Test menghasilkan video kosong', 'error');
                toast('Test gagal: video kosong', 'error');
            } else {
                toast('Sistem berfungsi normal!', 'success');
            }
            
            testChunks = [];
        };
        
        recorder.onerror = function(e) {
            logProblem('Test recorder error: ' + e.error, 'error');
            toast('Test gagal: recorder error', 'error');
        };
        
        recorder.start(100);
        setTimeout(function() {
            if (recorder.state !== 'inactive') {
                recorder.stop();
            }
        }, 1000);
        
    } catch(e) {
        logProblem('Test error: ' + e.message, 'error');
        toast('Test gagal: ' + e.message, 'error');
    }
}

// ============================================================
// GENERATE VIDEO (STABLE - No Audio in Video)
// ============================================================
function generateVideo() {
    var text = document.getElementById('storyInput').value.trim();
    if (!text) {
        toast('Tulis cerita dulu!', 'error');
        return;
    }
    
    if (appState.isGenerating) {
        toast('Masih generating!', 'warning');
        return;
    }
    
    // Reset state
    appState.isGenerating = true;
    appState.chunks = [];
    
    var style = document.getElementById('styleSelect').value;
    var resolution = document.getElementById('resolutionSelect').value;
    var durationPerScene = parseInt(document.getElementById('durationSelect').value) || 3;
    var dims = resolution.split('x');
    var width = parseInt(dims[0]);
    var height = parseInt(dims[1]);
    var fps = 25;
    
    var progressContainer = document.getElementById('progressContainer');
    var progressFill = document.getElementById('progressFill');
    var progressText = document.getElementById('progressText');
    var generateBtn = document.getElementById('generateBtn');
    
    progressContainer.classList.add('active');
    generateBtn.disabled = true;
    generateBtn.textContent = 'Generating...';
    
    consoleLog('Generate started', 'info');
    consoleLog('Resolution: ' + width + 'x' + height, 'info');
    consoleLog('Duration/scene: ' + durationPerScene + 's', 'info');
    
    // Run auto fix first
    var fixResult = autoFix();
    if (!fixResult) {
        finishGenerate(generateBtn, progressContainer);
        return;
    }
    
    // Get codec
    var savedConfig = {};
    try {
        savedConfig = JSON.parse(localStorage.getItem('video_config') || '{}');
    } catch(e) {}
    var codec = savedConfig.codec || getSupportedCodecs()[0] || 'video/webm';
    consoleLog('Using codec: ' + codec, 'info');
    
    // Create canvas
    var canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    var ctx = canvas.getContext('2d');
    
    // Create stream
    var stream = null;
    try {
        stream = canvas.captureStream(fps);
        consoleLog('Stream created', 'success');
    } catch(e) {
        logProblem('Stream error: ' + e.message, 'error');
        toast('Gagal membuat stream: ' + e.message, 'error');
        finishGenerate(generateBtn, progressContainer);
        return;
    }
    
    // Create recorder
    var recorder = null;
    try {
        recorder = new MediaRecorder(stream, {
            mimeType: codec,
            videoBitsPerSecond: 2000000
        });
        consoleLog('Recorder created', 'success');
    } catch(e) {
        logProblem('Recorder error: ' + e.message, 'error');
        toast('Gagal membuat recorder: ' + e.message, 'error');
        finishGenerate(generateBtn, progressContainer);
        return;
    }
    
    // Recorder events
    recorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) {
            appState.chunks.push(e.data);
            consoleLog('Data: ' + e.data.size + ' bytes', 'info');
        }
    };
    
    recorder.onstop = function() {
        consoleLog('Recorder stopped', 'info');
        
        if (appState.chunks.length === 0) {
            logProblem('Video kosong (0 chunks)', 'error');
            toast('Video kosong! Coba resolusi lebih kecil.', 'error');
            finishGenerate(generateBtn, progressContainer);
            return;
        }
        
        var blob = new Blob(appState.chunks, { type: codec });
        consoleLog('Video size: ' + (blob.size / 1024).toFixed(1) + ' KB', 'success');
        
        if (blob.size < 1000) {
            logProblem('Video terlalu kecil: ' + blob.size + ' bytes', 'warning');
        }
        
        appState.generatedBlob = blob;
        
        var url = URL.createObjectURL(blob);
        var video = document.getElementById('videoPreview');
        video.src = url;
        video.load();
        
        video.onerror = function() {
            logProblem('Video tidak bisa diputar', 'error');
            toast('Video rusak! Coba Auto Fix.', 'error');
        };
        
        video.onloadeddata = function() {
            toast('Video berhasil dibuat!', 'success');
        };
        
        // Show video info
        var infoEl = document.getElementById('videoInfo');
        infoEl.textContent = 'Size: ' + (blob.size / 1024).toFixed(1) + ' KB | Codec: ' + codec + ' | Duration: ~' + (paragraphs.length * durationPerScene) + 's';
        
        document.getElementById('videoContainer').classList.add('active');
        
        // Clean up
        appState.chunks = [];
        
        finishGenerate(generateBtn, progressContainer);
    };
    
    recorder.onerror = function(e) {
        logProblem('Recorder error: ' + (e.error || 'Unknown'), 'error');
        toast('Recorder error!', 'error');
        finishGenerate(generateBtn, progressContainer);
    };
    
    // Start recording
    try {
        recorder.start(500);
        consoleLog('Recording started', 'success');
    } catch(e) {
        logProblem('Start recording error: ' + e.message, 'error');
        toast('Gagal mulai recording: ' + e.message, 'error');
        finishGenerate(generateBtn, progressContainer);
        return;
    }
    
    // Split text into paragraphs
    var paragraphs = text.split('\n\n').filter(function(p) { return p.trim(); });
    if (paragraphs.length === 0) paragraphs = [text];
    
    consoleLog('Scenes: ' + paragraphs.length, 'info');
    
    var totalFrames = paragraphs.length * durationPerScene * fps;
    var frameCount = 0;
    
    // Render frames using setTimeout for better control
    function renderNextScene(sceneIndex) {
        if (sceneIndex >= paragraphs.length) {
            // All scenes done
            progressText.textContent = 'Finalizing...';
            progressFill.style.width = '90%';
            
            setTimeout(function() {
                if (recorder.state !== 'inactive') {
                    recorder.stop();
                }
            }, 500);
            return;
        }
        
        progressText.textContent = 'Scene ' + (sceneIndex + 1) + '/' + paragraphs.length;
        
        var paragraph = paragraphs[sceneIndex];
        var framesForScene = durationPerScene * fps;
        var frameInScene = 0;
        
        function renderFrame() {
            if (frameInScene >= framesForScene) {
                renderNextScene(sceneIndex + 1);
                return;
            }
            
            // Draw frame
            drawFrame(ctx, width, height, style, paragraph, sceneIndex, frameInScene, framesForScene);
            
            frameCount++;
            var progress = 10 + (frameCount / totalFrames) * 80;
            progressFill.style.width = progress + '%';
            
            frameInScene++;
            
            // Schedule next frame
            setTimeout(renderFrame, 1000 / fps);
        }
        
        renderFrame();
    }
    
    // Start rendering
    renderNextScene(0);
}

function finishGenerate(generateBtn, progressContainer) {
    appState.isGenerating = false;
    if (generateBtn) {
        generateBtn.disabled = false;
        generateBtn.textContent = '🎬 Generate Video';
    }
    if (progressContainer) {
        progressContainer.classList.remove('active');
    }
}

// ============================================================
// DRAW FRAME
// ============================================================
function drawFrame(ctx, w, h, style, text, sceneIndex, frame, totalFrames) {
    var progress = frame / totalFrames;
    
    var colors = {
        horror: ['#0a0a0a', '#1a0a0a', '#0d0d0d'],
        fantasy: ['#1a0533', '#3d1a6b', '#0a0a2e'],
        adventure: ['#87CEEB', '#90EE90', '#228B22'],
        romance: ['#FF6B6B', '#FFA07A', '#FFD700'],
        sad: ['#4a4a4a', '#3a3a3a', '#2a2a2a']
    };
    var c = colors[style] || colors.horror;
    
    // Background gradient
    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, c[0]);
    grad.addColorStop(0.5, c[1]);
    grad.addColorStop(1, c[2]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    
    // Scene icon
    var icons = { horror: '👻', fantasy: '✨', adventure: '🗺️', romance: '💕', sad: '😢' };
    var icon = icons[style] || '🎬';
    
    var iconSize = Math.floor(h / 4);
    ctx.font = iconSize + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    // Animated icon
    var iconX = w / 2 + Math.sin(progress * Math.PI * 2) * 20;
    var iconY = h / 3 + Math.cos(progress * Math.PI * 3) * 10;
    ctx.fillText(icon, iconX, iconY);
    
    // Text overlay
    var fadeIn = Math.min(1, (frame / totalFrames) * 3);
    ctx.save();
    ctx.globalAlpha = fadeIn * 0.85;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    var textHeight = Math.min(100, Math.floor(h / 4));
    ctx.fillRect(0, h - textHeight, w, textHeight);
    
    ctx.fillStyle = '#ffffff';
    var fontSize = Math.min(16, Math.floor(w / 50));
    ctx.font = 'bold ' + fontSize + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    var shortText = text.length > 80 ? text.substring(0, 80) + '...' : text;
    ctx.fillText(shortText, w / 2, h - textHeight / 2);
    ctx.restore();
    
    // Scene indicator
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '10px Arial';
    ctx.textAlign = 'right';
    ctx.fillText('Scene ' + (sceneIndex + 1), w - 10, h - 10);
}

// ============================================================
// DOWNLOAD VIDEO
// ============================================================
function downloadVideo() {
    if (!appState.generatedBlob) {
        toast('Belum ada video!', 'error');
        return;
    }
    
    try {
        var url = URL.createObjectURL(appState.generatedBlob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'yad_video_' + Date.now() + '.webm';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        setTimeout(function() {
            URL.revokeObjectURL(url);
        }, 5000);
        
        toast('Download dimulai!', 'success');
        consoleLog('Download started', 'success');
    } catch(e) {
        logProblem('Download error: ' + e.message, 'error');
        toast('Download gagal: ' + e.message, 'error');
    }
}

// ============================================================
// PUSH TO GITHUB
// ============================================================
function pushToGitHub() {
    consoleLog('Push to GitHub...', 'info');
    
    var config = {};
    try {
        config = JSON.parse(localStorage.getItem('github_config') || '{}');
    } catch(e) {}
    
    if (!config.token) {
        config.token = prompt('GitHub Token:');
        if (!config.token) return;
    }
    if (!config.username) {
        config.username = prompt('Username GitHub:');
        if (!config.username) return;
    }
    if (!config.repo) {
        config.repo = prompt('Nama Repository:');
        if (!config.repo) return;
    }
    
    try {
        localStorage.setItem('github_config', JSON.stringify(config));
    } catch(e) {}
    
    var html = document.documentElement.outerHTML;
    var content = btoa(unescape(encodeURIComponent(html)));
    
    var xhr = new XMLHttpRequest();
    xhr.open('PUT', 'https://api.github.com/repos/' + config.username + '/' + config.repo + '/contents/index.html');
    xhr.setRequestHeader('Authorization', 'token ' + config.token);
    xhr.setRequestHeader('Content-Type', 'application/json');
    
    xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
            var data = JSON.parse(xhr.responseText);
            if (data.content) {
                toast('Berhasil push ke GitHub!', 'success');
                consoleLog('Push successful', 'success');
            } else {
                logProblem('Push failed: ' + (data.message || 'Unknown'), 'error');
                toast('Push gagal: ' + (data.message || 'Error'), 'error');
            }
        } else {
            var msg = 'Push failed: ' + xhr.status;
            try {
                var errData = JSON.parse(xhr.responseText);
                msg += ' - ' + errData.message;
            } catch(e) {}
            logProblem(msg, 'error');
            toast(msg, 'error');
        }
    };
    
    xhr.onerror = function() {
        logProblem('Push network error', 'error');
        toast('Push gagal: network error', 'error');
    };
    
    xhr.send(JSON.stringify({
        message: 'Update YAD Video AI v5.0',
        content: content,
        branch: 'main'
    }));
}

// ============================================================
// RESET
// ============================================================
function resetAll() {
    if (!confirm('Reset semua data?')) return;
    
    try {
        localStorage.clear();
    } catch(e) {}
    
    appState.generatedBlob = null;
    appState.problems = [];
    appState.chunks = [];
    appState.isGenerating = false;
    
    var videoPreview = document.getElementById('videoPreview');
    if (videoPreview) videoPreview.src = '';
    
    var videoContainer = document.getElementById('videoContainer');
    if (videoContainer) videoContainer.classList.remove('active');
    
    var storyInput = document.getElementById('storyInput');
    if (storyInput) storyInput.value = '';
    
    updateLogPanel();
    consoleLog('Reset complete', 'warning');
    toast('Reset selesai!', 'info');
}
