        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

        .nav-links{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
        
        .btn{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:11px;font-weight:600;transition:all 0.3s;font-family:inherit}
        .btn:hover{background:var(--bg-hover);border-color:var(--accent)}
        .btn-primary{background:var(--accent);color:white;border:none}
        
        .activity-bar{background:#0d0d15;border-bottom:1px solid var(--border);padding:8px 16px;font-size:10px;color:var(--text-dim);display:flex;gap:20px;flex-wrap:wrap}
        .dot-live{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block;animation:blink 2s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
        
        .container{max-width:1200px;margin:0 auto;padding:20px}
        
        .floating-ai{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:white;border:none;cursor:pointer;font-size:24px;z-index:400;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(139,92,246,0.4)}
        
        .whatsapp-float{position:fixed;bottom:24px;left:24px;width:56px;height:56px;background:#25D366;color:white;border-radius:50%;text-align:center;font-size:28px;box-shadow:0 8px 32px rgba(37,211,102,0.4);z-index:400;display:flex;align-items:center;justify-content:center;text-decoration:none}

        .ai-chat-body{display:flex;flex-direction:column;overflow:hidden}
        .ai-chat-body.hidden{display:none}
        .ai-chat-messages{height:300px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
        .ai-msg{padding:7px 10px;border-radius:12px;font-size:12px;line-height:1.4;background:var(--bg-input);max-width:90%;word-break:break-word}
        .ai-msg.user{background:var(--accent);color:white;margin-left:auto}
        .ai-msg.system{background:var(--bg-hover);color:var(--accent2);text-align:center;font-size:10px;max-width:100%}
        .ai-chat-input-area{padding:8px;border-top:1px solid var(--border);display:flex;gap:6px}
        .ai-chat-input-area input{flex:1;padding:8px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:16px;color:var(--text);font-size:12px;outline:none;font-family:inherit}
        .ai-chat-input-area button{background:var(--accent);color:white;border:none;padding:8px 14px;border-radius:16px;cursor:pointer;font-size:14px}
        
        .quick-edit-bar{padding:8px;background:var(--bg-input);border-top:1px solid var(--border);display:none}
        .quick-edit-btn{padding:4px 8px;margin:2px;font-size:10px;border-radius:4px;border:1px solid var(--border);background:var(--bg-hover);color:var(--text);cursor:pointer;font-family:inherit}
        
        .fit-btn{background:linear-gradient(135deg,#8b5cf6,#ec4899)!important;color:#fff!important;border:none!important;font-weight:700!important;display:none}
        .fit-dropdown{position:fixed;top:60px;right:20px;z-index:9999;background:#1a1a2e;border-radius:12px;border:2px solid #8b5cf6;box-shadow:0 20px 60px rgba(139,92,246,0.5);display:none;min-width:250px;overflow:hidden}

        .fit-dropdown-body{padding:8px}
        .fit-dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:12px;color:#e8e8f0;border:none;background:transparent;width:100%;text-align:left;font-family:inherit}
        .fit-dropdown-item:hover{background:#252540}
        
        .fit-panel{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);z-index:99999;display:none;align-items:center;justify-content:center}
        .fit-panel.show{display:flex}
        .fit-panel-dialog{background:#1a1a2e;border-radius:16px;border:2px solid #8b5cf6;width:95vw;max-width:650px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
        .fit-panel-header{padding:14px 20px;background:#16213e;border-bottom:1px solid #252540;display:flex;justify-content:space-between;align-items:center}
        .fit-panel-body{padding:20px;overflow-y:auto}
        .fit-panel-body label{display:block;color:#9090a8;font-size:11px;font-weight:600;margin-bottom:4px;text-transform:uppercase}
        .fit-panel-body input,.fit-panel-body textarea,.fit-panel-body select{width:100%;padding:10px;background:#0d0d20;border:1px solid #252540;border-radius:8px;color:#e8e8f0;font-size:13px;margin-bottom:12px;outline:none;font-family:inherit;resize:vertical}
        .fit-panel-footer{padding:12px 20px;background:#0d0d20;border-top:1px solid #252540;display:flex;gap:8px;justify-content:flex-end}
        
        .category-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
        .cat-tab{padding:8px 16px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-family:inherit}
        .cat-tab:hover,.cat-tab.active{background:var(--accent);color:white;border-color:var(--accent)}
        
        .game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
        .game-card{background:var(--bg-card);border-radius:var(--radius);padding:20px;border:1px solid var(--border);cursor:pointer;transition:all 0.3s}
        .game-card:hover{border-color:var(--accent);transform:translateY(-2px)}
        .game-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
        .game-icon{font-size:40px}.game-name{font-size:16px;font-weight:700}.game-developer{font-size:10px;color:var(--text-dim)}
        .item-list{display:flex;flex-direction:column;gap:6px}
        .item-row{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--bg-input);border-radius:8px;font-size:12px;cursor:pointer}
        .item-row:hover{background:var(--bg-hover)}.item-price{font-weight:700;color:var(--gold)}
        
        .order-section{background:var(--bg-card);border-radius:var(--radius);padding:24px;margin:20px 0;border:1px solid var(--border)}
        .form-group{margin:10px 0}.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:3px;text-transform:uppercase}
        .form-group input,.form-group select{width:100%;padding:10px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;outline:none}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        
        .payment-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:10px 0}
        .payment-card{background:var(--bg-input);border:2px solid var(--border);border-radius:10px;padding:14px;text-align:center;cursor:pointer;font-size:12px}
        .payment-card:hover,.payment-card.selected{border-color:var(--accent);background:var(--bg-hover)}
        
        .live-feed{background:var(--bg-card);border-radius:var(--radius);padding:16px;margin:20px 0;border:1px solid var(--border);max-height:200px;overflow-y:auto}
        .live-item{padding:6px 0;border-bottom:1px solid var(--border);font-size:11px;color:var(--text-dim)}
        
        .toast-container{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:600}
        .toast{padding:8px 16px;border-radius:16px;color:white;font-size:10px;font-weight:600;animation:toastIn 0.3s ease;margin-bottom:6px}
        @keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
        .toast.success{background:var(--green)}.toast.error{background:var(--red)}.toast.info{background:var(--accent2)}
        
        .hidden{display:none!important}
    </style>
</head>

        // ================================================================

            grid.innerHTML = products.map(game => {
                return `
                    <div class="game-card" onclick="selectProduct('${S.currentCategory}', '${game.id}')">
                        <div class="game-header">
                            <span style="font-size:40px;">${game.icon}</span>
                            <div>
                                <div class="game-name">${escapeHtml(game.name)}</div>
                                <div class="game-developer">${game.dev}</div>
                            </div>
                        </div>
                        <div class="item-list">
                            ${game.items.slice(0, 5).map(item => {
                                return `
                                    <div class="item-row" onclick="event.stopPropagation();quickOrder('${escapeHtml(game.name)}', '${escapeHtml(item[0])}', '${item[1]}')">
                                        <span>${escapeHtml(item[0])}</span>
                                        <span class="item-price">Rp ${calcPrice(item[1]).toLocaleString('id-ID')}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function filterCategory(category, event) {
            document.querySelectorAll('.cat-tab').forEach(tab => tab.classList.remove('active'));
            if (event && event.currentTarget) event.currentTarget.classList.add('active');
            renderGames(category);
        }
        
        function renderPayments() {
            const grid = document.getElementById('paymentGrid');
            if (!grid) return;
            
            grid.innerHTML = S.paymentMethods.map((payment, index) => {
                return `
                    <div class="payment-card" onclick="selectPayment(${index})" id="payCard${index}">
                        <div style="font-size:24px;">🏦</div>
                        <b>${escapeHtml(payment.name)}</b><br>
                        <small>${escapeHtml(payment.number)}</small>
                    </div>
                `;
            }).join('');
        }
        
        function selectPayment(index) {
            S.selectedPayment = S.paymentMethods[index];
            document.querySelectorAll('.payment-card').forEach(card => card.classList.remove('selected'));
            const card = document.getElementById('payCard' + index);
            if (card) card.classList.add('selected');
        }
        
        function showSection(section) {
            ['homeSection', 'orderSection', 'statusSection'].forEach(id => {
                const element = document.getElementById(id);
                if (element) element.classList.add('hidden');
            });
            
            const target = document.getElementById(section + 'Section');
            if (target) target.classList.remove('hidden');
        }
        
        // ================================================================
        // ORDER FUNCTIONS
        // ================================================================
        function updateOrderGame() {
            const category = document.getElementById('orderCategory').value;
            const products = ALL_PRODUCTS[category] || [];
            const select = document.getElementById('orderGame');
            
            select.innerHTML = '<option value="">Pilih Produk</option>' + products.map(product => {
                return `<option value="${escapeHtml(product.name)}">${product.icon} ${escapeHtml(product.name)}</option>`;
            }).join('');
        }
        
        function updateOrderItems() {
            const category = document.getElementById('orderCategory').value;
            const gameName = document.getElementById('orderGame').value;
            const products = ALL_PRODUCTS[category] || [];
            const game = products.find(p => p.name === gameName);
            const select = document.getElementById('orderItem');
            
            if (!game) {
                select.innerHTML = '<option value="">Pilih Item</option>';
                updateTotalPrice();
                return;
            }
            
            select.innerHTML = game.items.map(item => {
                return `<option value="${escapeHtml(item[0])}|${item[1]}">${escapeHtml(item[0])} - Rp ${calcPrice(item[1]).toLocaleString('id-ID')}</option>`;
            }).join('');
            
            updateTotalPrice();
        }
        
        function updateTotalPrice() {
            const value = document.getElementById('orderItem').value;
            const priceElement = document.getElementById('totalPrice');
            
            if (value) {
                const price = parseInt(value.split('|')[1]);
                priceElement.textContent = 'Rp ' + calcPrice(price).toLocaleString('id-ID');
            } else {
                priceElement.textContent = 'Rp 0';
            }
        }
        
        function submitOrder() {
            const game = document.getElementById('orderGame').value;
            const itemValue = document.getElementById('orderItem').value;
            const uid = document.getElementById('orderUID').value.trim();
            const email = document.getElementById('orderEmail').value.trim();
            
            if (!game || !itemValue || !uid) {
                toast('❌ Lengkapi data!', 'error');
                return;
            }
            
            if (!S.selectedPayment) {
                toast('❌ Pilih metode pembayaran!', 'error');
                return;
            }
            
            const parts = itemValue.split('|');
            const totalPrice = calcPrice(parseInt(parts[1]));
            
            const order = {
                id: generateOrderId(),
                game: game,
                item: parts[0],
                price: totalPrice,
                uid: uid,
                email: email,
                payment: S.selectedPayment,
                status: 'pending',
                time: new Date().toISOString()
            };
            
            S.orders.unshift(order);
            localStorage.setItem('store_orders', JSON.stringify(S.orders));
            
            toast('✅ Pesanan berhasil!', 'success');
            addLive('🛒 ' + game + ' - ' + parts[0] + ' | ' + order.id);
            
            alert('✅ PESANAN BERHASIL!\n\nOrder ID: ' + order.id + '\nTotal: Rp ' + totalPrice.toLocaleString('id-ID'));
        }
        
        function previewProof() {
            const file = document.getElementById('paymentProof').files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('proofPreview').innerHTML = 
                    '<img src="' + e.target.result + '" style="max-width:200px;border-radius:8px">';
            };
            reader.readAsDataURL(file);
        }
        
        function checkOrder() {
            const orderId = document.getElementById('checkOrderID').value.trim();
            if (!orderId) return;
            
            const order = S.orders.find(o => o.id === orderId);
            const resultElement = document.getElementById('orderResult');
            
            if (order) {
                resultElement.innerHTML = `
                    <div style="background:var(--bg-input);padding:12px;border-radius:8px;">
                        <b>${escapeHtml(order.id)}</b><br>
                        ${order.game} - ${order.item}<br>
                        Rp ${order.price.toLocaleString('id-ID')}<br>
                        ${order.status.toUpperCase()}
                    </div>
                `;
            } else {
                resultElement.innerHTML = '<p style="color:var(--red)">❌ Tidak ditemukan</p>';
            }
        }
        
        function loadUserHistory() {
            const email = document.getElementById('historyEmail').value.trim().toLowerCase();
            if (!email) return;
            
            const userOrders = S.orders.filter(order => 
                order.email && order.email.toLowerCase().includes(email)
            );
            
            const historyElement = document.getElementById('userOrderHistory');
            
            if (userOrders.length) {
                historyElement.innerHTML = userOrders.slice(0, 10).map(order => {
                    return `
                        <div style="background:var(--bg-input);padding:10px;margin:6px 0;border-radius:8px;">
                            <b>${escapeHtml(order.id)}</b> - ${order.status}<br>
                            ${order.game}<br>
                            Rp ${order.price.toLocaleString('id-ID')}
                        </div>
                    `;
                }).join('');
            } else {
                historyElement.innerHTML = '<p style="color:var(--text-dim)">Tidak ada</p>';
            }
        }
        
        function addLive(message) {
            const feed = document.getElementById('liveFeed');
            if (!feed) return;
            
            const item = document.createElement('div');
            item.className = 'live-item';
            item.textContent = '[' + new Date().toLocaleTimeString('id-ID') + '] ' + message;
            feed.insertBefore(item, feed.firstChild);
            
            if (feed.children.length > 15) {
                feed.removeChild(feed.lastChild);
            }
        }
        
        function selectProduct(category, productId) {
            const products = ALL_PRODUCTS[category] || [];
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            document.getElementById('orderCategory').value = category;
            updateOrderGame();
            document.getElementById('orderGame').value = product.name;
            updateOrderItems();
            showSection('order');
        }
        
        function quickOrder(gameName, itemName, price) {
            document.getElementById('orderGame').value = gameName;
            updateOrderItems();
            document.getElementById('orderItem').value = itemName + '|' + price;
            updateTotalPrice();
            showSection('order');
        }
        
        // ================================================================
        // AI CHAT FUNCTIONS
        // ================================================================
        function openAIChat() {
            const widget = document.getElementById('aiChatWidget');
            widget.classList.toggle('show');
            
            if (widget.classList.contains('show')) {
                document.getElementById('aiChatBody').classList.remove('hidden');
                document.getElementById('aiChatToggle').textContent = '▼';
            }
        }
        
        function toggleAIChat() {
            const body = document.getElementById('aiChatBody');
            body.classList.toggle('hidden');
            document.getElementById('aiChatToggle').textContent = 
                body.classList.contains('hidden') ? '▶' : '▼';
        }
        
        function sendAIMsg() {
            const input = document.getElementById('aiChatInput');
            const message = input.value.trim();
            if (!message) return;
            
            const messagesContainer = document.getElementById('aiChatMsgs');
            messagesContainer.innerHTML += '<div class="ai-msg user">' + escapeHtml(message) + '</div>';
            input.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            const lowerMessage = message.toLowerCase();
            let response = '';
            
            if (['hai', 'halo', 'hi', 'hello'].some(greeting => lowerMessage.includes(greeting))) {
                response = 'Halo! 😊 Ada yang bisa saya bantu?';
            } else if (lowerMessage === 'help') {
                response = '📚 BANTUAN:\n💬 hai - sapa\n🎮 game - lihat game\n📱 axis - paket axis\n🛒 order - cara pesan\n📋 cek [ID] - cek pesanan';
            } else if (lowerMessage.includes('game')) {
                response = '🎮 Game tersedia:\n• Mobile Legends\n• Free Fire\n• PUBG Mobile\n• Genshin Impact\n• Valorant';
            } else if (lowerMessage.includes('axis')) {
                response = '📱 Paket Axis tersedia:\n• Reguler 1-10GB\n• Mingguan 3-15GB\n• Bulanan 5-50GB\n• Unlimited\n• Warnet Unlimited';
            } else {
                response = '❓ Ketik "help" untuk bantuan.';
            }
            
            setTimeout(() => {
                messagesContainer.innerHTML += '<div class="ai-msg">' + response.replace(/\n/g, '<br>') + '</div>';
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 300);
        }
        
        function toggleVoice() {
            toast('🎤 Voice recognition siap!', 'info');
        }
        
        // ================================================================
        // PROFILE FUNCTIONS
        // ================================================================
        function openProfile() {
            toast('👤 Profil dibuka!', 'info');
        }
        
        async function handleLogin() {
            try {
                const result = await auth.signInWithPopup(googleProvider);
                S.user = result.user;
                S.admin = result.user.email === 'ynuraini686@gmail.com';
                toast('✅ Login berhasil!', 'success');
            } catch (error) {
                toast('❌ Login gagal: ' + error.message, 'error');
            }
        }
        
        // ================================================================
        // NOVEL FUNCTIONS
        // ================================================================
        function openNovelReader() {
            toast('📚 Novel Reader dibuka!', 'info');
        }
        
        // ================================================================
        // INITIALIZATION
        // ================================================================
        function initialize() {
            console.log('Initializing YAD Store...');
            
            renderGames('all');
            renderPayments();
            addLive('🛒 Sistem online');
            
            setInterval(() => {
                const count = 87 + Math.floor(Math.random() * 20);
                const element = document.getElementById('onlineCount');
                if (element) element.textContent = count;
            }, 30000);
            
            setInterval(() => {
                const actions = ['📱 Axis 10GB', '🎮 ML 86 Diamonds', '📶 Axis Unlimited', '⚡ Token 50K', '💳 E-Wallet 20K'];
                const action = actions[Math.floor(Math.random() * actions.length)];
                addLive('✅ ' + action);
            }, 15000);
            
            console.log('YAD Store initialized successfully!');
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }
    </script>
</body>
</html>
