<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YAD Store - Top Up Game & Pulsa Termurah</title>
    <meta name="description" content="YAD Store - Top up game, pulsa, paket data, token listrik, voucher, dan e-wallet termurah.">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root{--bg:#0a0a14;--bg-card:#12122a;--bg-hover:#1a1a35;--bg-input:#0d0d20;--text:#e8e8f0;--text-dim:#9090a8;--accent:#8b5cf6;--accent2:#06b6d4;--gold:#f59e0b;--green:#10b981;--red:#ef4444;--pink:#ec4899;--border:#252540;--radius:14px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;transition:background 0.3s}
        body.light{--bg:#f5f5f5;--bg-card:#ffffff;--bg-hover:#e8e8f0;--bg-input:#f0f0f5;--text:#1a1a2e;--text-dim:#6a6a80;--border:#d0d0e0}
        .header{background:rgba(10,10,20,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:12px;flex-wrap:wrap}
        .logo{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .nav-links{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
        .btn{padding:7px 14px;border-radius:18px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:11px;font-weight:600;transition:all 0.2s;font-family:inherit}
        .btn:hover{background:var(--bg-hover);border-color:var(--accent)}
        .btn-primary{background:var(--accent);color:white;border:none}
        .btn-danger{background:var(--red);color:white;border:none}
        .btn-success{background:var(--green);color:white;border:none}
        .btn-warning{background:var(--gold);color:#000;border:none}
        .btn-sm{padding:4px 8px;font-size:10px;border-radius:6px}
        .activity-bar{background:#0d0d15;border-bottom:1px solid var(--border);padding:6px 16px;font-size:10px;color:var(--text-dim);display:flex;gap:20px;overflow:hidden;white-space:nowrap;flex-wrap:wrap}
        .dot-live{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block;animation:blink 2s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
        .container{max-width:1200px;margin:0 auto;padding:20px}
        .search-bar{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
        .search-bar input{flex:1;min-width:200px;padding:10px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:13px;outline:none;font-family:inherit}
        .search-bar input:focus{border-color:var(--accent)}
        .floating-ai{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));color:white;border:none;cursor:pointer;font-size:24px;z-index:400;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(139,92,246,0.4);animation:float 3s ease-in-out infinite}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .whatsapp-float{position:fixed;bottom:24px;left:24px;width:56px;height:56px;background:#25D366;color:white;border-radius:50%;text-align:center;font-size:28px;box-shadow:0 8px 32px rgba(37,211,102,0.4);z-index:400;display:flex;align-items:center;justify-content:center;text-decoration:none}
        .ai-chat-widget{position:fixed;bottom:90px;right:20px;width:420px;max-width:92vw;z-index:450;background:var(--bg-card);border-radius:var(--radius);border:2px solid var(--accent);overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.6);display:none;flex-direction:column;max-height:80vh}
        .ai-chat-widget.show{display:flex}
        .ai-chat-header{padding:10px 14px;background:var(--bg-hover);cursor:pointer;display:flex;justify-content:space-between;font-weight:700;font-size:13px}
        .ai-chat-body{display:flex;flex-direction:column;overflow:hidden}
        .ai-chat-body.hidden{display:none}
        .ai-chat-messages{height:300px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
        .ai-msg{padding:7px 10px;border-radius:12px;font-size:12px;line-height:1.4;background:var(--bg-input);max-width:90%;word-break:break-word}
        .ai-msg.user{background:var(--accent);color:white;margin-left:auto}
        .ai-msg.system{background:var(--bg-hover);color:var(--accent2);text-align:center;font-size:10px;max-width:100%}
        .ai-msg.error{background:#3d1f1f;color:var(--red)}
        .ai-msg.success{background:#1f3d2f;color:var(--green)}
        .ai-msg.progress{background:#1f2f3d;color:#06b6d4;border-left:3px solid #06b6d4}
        .ai-chat-input-area{padding:8px;border-top:1px solid var(--border);display:flex;gap:6px}
        .ai-chat-input-area input{flex:1;padding:8px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:16px;color:var(--text);font-size:12px;outline:none;font-family:inherit}
        .ai-chat-input-area button{background:var(--accent);color:white;border:none;padding:8px 14px;border-radius:16px;cursor:pointer;font-size:14px}
        .quick-edit-bar{padding:8px;background:var(--bg-input);border-top:1px solid var(--border)}
        .quick-edit-bar .edit-title{font-size:10px;color:var(--text-dim);margin-bottom:4px}
        .quick-edit-btn{padding:4px 8px;margin:2px;font-size:10px;border-radius:4px;border:1px solid var(--border);background:var(--bg-hover);color:var(--text);cursor:pointer;font-family:inherit}
        .quick-edit-btn:hover{background:var(--accent);color:white}
        .voice-btn{background:#ef4444;color:#fff;border:none;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:16px;margin-right:6px}
        .voice-btn.listening{background:#10b981;animation:pulse-voice 1.2s infinite}
        @keyframes pulse-voice{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0.5)}50%{box-shadow:0 0 0 12px rgba(16,185,129,0)}}
        .console-panel{position:fixed;bottom:90px;left:20px;width:500px;max-width:95vw;z-index:450;background:#0a0a0a;border-radius:14px;border:2px solid #06b6d4;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.8);display:none;flex-direction:column;height:400px}
        .console-panel.show{display:flex}
        .console-header{background:#0d3d3d;display:flex;border-bottom:1px solid #1a1a1a;overflow-x:auto}
        .console-tab{padding:8px 12px;cursor:pointer;font-size:10px;font-weight:700;color:#9090a8;border:none;background:transparent;font-family:inherit;white-space:nowrap}
        .console-tab:hover{color:#fff}
        .console-tab.active{color:#06b6d4;border-bottom:2px solid #06b6d4;background:rgba(6,182,212,0.1)}
        .console-content{flex:1;overflow-y:auto;padding:10px;font-family:monospace;font-size:11px;color:#00ff00}
        .console-line{margin:2px 0;word-break:break-word}
        .console-line.error{color:#ff4444}.console-line.success{color:#44ff44}.console-line.info{color:#44aaff}.console-line.warn{color:#ffaa44}.console-line.cmd{color:#fff}
        .console-input-area{display:flex;align-items:center;padding:8px;background:#111;border-top:1px solid #333}
        .console-prompt{color:#00ff00;font-weight:bold;margin-right:6px;font-size:12px}
        .console-input{flex:1;background:transparent;border:none;color:#fff;font-family:monospace;font-size:12px;outline:none}
        .novel-reader-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90vw;max-width:800px;max-height:90vh;background:var(--bg-card);border-radius:var(--radius);border:2px solid var(--accent);z-index:500;display:none;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.8)}
        .novel-reader-panel.show{display:flex}
        .novel-header{padding:12px 16px;background:var(--bg-hover);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
        .novel-content{flex:1;overflow-y:auto;padding:20px;font-size:14px;line-height:1.8;color:var(--text);max-height:60vh}
        .novel-controls{padding:12px;background:var(--bg-input);border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
        .novel-controls button{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg-hover);color:var(--text);cursor:pointer;font-size:11px;font-family:inherit}
        .novel-library{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:16px}
        .novel-card{background:var(--bg-input);border-radius:8px;padding:12px;cursor:pointer;border:1px solid var(--border);transition:all 0.3s}
        .novel-card:hover{border-color:var(--accent);transform:translateY(-2px)}
        .novel-progress{width:100%;height:4px;background:var(--border);border-radius:2px;margin-top:8px}
        .novel-progress-bar{height:100%;background:var(--accent);border-radius:2px}
        .write-novel-btn{background:linear-gradient(135deg,#10b981,#059669)!important;color:#fff!important;border:none!important;font-weight:700!important}
        .novel-editor-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:95vw;max-width:700px;max-height:90vh;background:#1a1a2e;border-radius:16px;border:2px solid #10b981;z-index:9999;display:none;flex-direction:column;overflow:hidden}
        .novel-editor-panel.show{display:flex}
        .novel-editor-header{padding:14px 20px;background:linear-gradient(135deg,#1a1a2e,#0d3d2e);border-bottom:1px solid #10b981;display:flex;justify-content:space-between;align-items:center}
        .novel-editor-body{padding:20px;overflow-y:auto}
        .novel-editor-body input,.novel-editor-body textarea{width:100%;padding:10px;background:#0d0d20;border:1px solid #252540;border-radius:8px;color:#e8e8f0;font-size:13px;outline:none;font-family:inherit;margin-bottom:12px;resize:vertical}
        .novel-editor-body textarea{min-height:250px;font-size:14px;line-height:1.8;font-family:Georgia,serif}
        .profile-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:95vw;max-width:450px;max-height:85vh;background:var(--bg-card);border-radius:var(--radius);border:2px solid var(--accent);z-index:500;display:none;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.8);overflow:hidden}
        .profile-panel.show{display:flex}
        .profile-header{padding:20px;text-align:center;background:linear-gradient(135deg,#1a1a2e,#16213e);border-bottom:2px solid var(--accent)}
        .profile-avatar{width:65px;height:65px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#ec4899);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin:0 auto 10px;border:3px solid var(--accent)}
        .profile-body{padding:16px;overflow-y:auto;max-height:45vh}
        .profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
        .profile-stat{background:var(--bg-input);border-radius:8px;padding:12px;text-align:center;border:1px solid var(--border)}
        .profile-stat-value{font-size:20px;font-weight:700;color:var(--accent)}
        .profile-stat-label{font-size:10px;color:var(--text-dim)}
        .profile-footer{padding:12px;background:var(--bg-input);border-top:1px solid var(--border);text-align:center;display:flex;gap:8px;justify-content:center}
        .profile-edit-btn{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;width:100%;margin-top:8px}
        .profile-edit-form{display:none;margin-top:8px}
        .profile-edit-form.show{display:block}
        .profile-edit-form input{width:100%;padding:8px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none}
        .profile-order-item{background:var(--bg-input);padding:8px;border-radius:6px;margin:4px 0;font-size:10px;border:1px solid var(--border)}
        .analysis-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:95vw;max-width:800px;max-height:90vh;background:var(--bg-card);border-radius:var(--radius);border:2px solid var(--accent);z-index:500;display:none;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.8);overflow:hidden}
        .analysis-panel.show{display:flex}
        .analysis-header{padding:12px 16px;background:var(--bg-hover);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .analysis-body{padding:20px;overflow-y:auto;max-height:70vh}
        .analysis-body table{width:100%;border-collapse:collapse;margin:10px 0}
        .analysis-body th,.analysis-body td{padding:8px 12px;border:1px solid var(--border);text-align:left;font-size:12px}
        .analysis-body th{background:var(--bg-hover);color:var(--accent)}
        .analysis-section{margin:16px 0;padding:12px;background:var(--bg-input);border-radius:8px;border:1px solid var(--border)}
        .analysis-section h3{color:var(--accent);margin-bottom:8px;font-size:14px}
        .payment-form-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a2e;border-radius:16px;border:2px solid #f59e0b;z-index:9999;display:none;flex-direction:column;overflow:hidden;width:400px;max-width:95vw}
        .payment-form-panel.show{display:flex}
        .payment-form-header{padding:14px 20px;background:linear-gradient(135deg,#1a1a2e,#2d1a0e);border-bottom:1px solid #f59e0b;display:flex;justify-content:space-between;align-items:center}
        .payment-form-body{padding:20px}
        .payment-form-body input{width:100%;padding:10px;background:#0d0d20;border:1px solid #252540;border-radius:8px;color:#e8e8f0;font-size:13px;margin-bottom:10px;outline:none}
        .fit-btn{background:linear-gradient(135deg,#8b5cf6,#ec4899)!important;color:#fff!important;border:none!important;font-weight:700!important}
        .fit-dropdown{position:fixed;top:55px;right:20px;z-index:9999;background:#1a1a2e;border-radius:12px;border:2px solid #8b5cf6;box-shadow:0 20px 60px rgba(139,92,246,0.5);display:none;min-width:280px;overflow:hidden}
        .fit-dropdown.show{display:block}
        .fit-dropdown-header{padding:12px 16px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-bottom:1px solid #252540;font-weight:700;font-size:14px;color:#fff;display:flex;justify-content:space-between;align-items:center}
        .fit-dropdown-body{padding:8px;max-height:400px;overflow-y:auto}
        .fit-dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:12px;color:#e8e8f0;border:none;background:transparent;width:100%;text-align:left;font-family:inherit}
        .fit-dropdown-item:hover{background:#252540}
        .fit-panel{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);z-index:99999;display:none;align-items:center;justify-content:center}
        .fit-panel.show{display:flex}
        .fit-panel-dialog{background:#1a1a2e;border-radius:16px;border:2px solid #8b5cf6;width:95vw;max-width:600px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
        .fit-panel-header{padding:14px 20px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-bottom:1px solid #252540;display:flex;justify-content:space-between;align-items:center}
        .fit-panel-body{padding:20px;overflow-y:auto}
        .fit-panel-body label{display:block;color:#9090a8;font-size:11px;font-weight:600;margin-bottom:4px;text-transform:uppercase}
        .fit-panel-body input,.fit-panel-body textarea,.fit-panel-body select{width:100%;padding:10px;background:#0d0d20;border:1px solid #252540;border-radius:8px;color:#e8e8f0;font-size:13px;margin-bottom:12px;outline:none;font-family:inherit;resize:vertical}
        .fit-list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#0d0d20;border-radius:6px;margin-bottom:4px;font-size:11px}
        .category-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
        .cat-tab{padding:8px 16px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-family:inherit}
        .cat-tab:hover,.cat-tab.active{background:var(--accent);color:white;border-color:var(--accent)}
        .game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
        .game-card{background:var(--bg-card);border-radius:var(--radius);padding:20px;border:1px solid var(--border);cursor:pointer;transition:all 0.3s;position:relative}
        .game-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(139,92,246,0.2)}
        .favorite-btn{position:absolute;top:10px;right:10px;background:transparent;border:none;font-size:20px;cursor:pointer;z-index:10}
        .game-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
        .game-icon{font-size:40px}.game-name{font-size:16px;font-weight:700}.game-developer{font-size:10px;color:var(--text-dim)}
        .item-list{display:flex;flex-direction:column;gap:6px}
        .item-row{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--bg-input);border-radius:8px;font-size:12px;cursor:pointer;transition:all 0.2s}
        .item-row:hover{background:var(--bg-hover);transform:translateX(4px)}
        .item-price{font-weight:700;color:var(--gold)}
        .order-section{background:var(--bg-card);border-radius:var(--radius);padding:24px;margin:20px 0;border:1px solid var(--border)}
        .form-group{margin:10px 0}.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:3px;text-transform:uppercase}
        .form-group input,.form-group select{width:100%;padding:10px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color 0.3s}
        .form-group input:focus,.form-group select:focus{border-color:var(--accent)}
        .form-group input.error{border-color:var(--red)}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        @media(max-width:500px){.form-row{grid-template-columns:1fr}}
        .payment-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:10px 0}
        .payment-card{background:var(--bg-input);border:2px solid var(--border);border-radius:10px;padding:14px;text-align:center;cursor:pointer;font-size:12px;transition:all 0.3s}
        .payment-card:hover,.payment-card.selected{border-color:var(--accent);background:var(--bg-hover);transform:scale(1.05)}
        .live-feed{background:var(--bg-card);border-radius:var(--radius);padding:16px;margin:20px 0;border:1px solid var(--border);max-height:200px;overflow-y:auto}
        .live-item{padding:6px 0;border-bottom:1px solid var(--border);font-size:11px;color:var(--text-dim);animation:fadeIn 0.5s}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
        .toast-container{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:600}
        .toast{padding:8px 16px;border-radius:16px;color:white;font-size:10px;font-weight:600;animation:toastIn 0.3s ease}
        @keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
        .toast.success{background:var(--green)}.toast.error{background:var(--red)}.toast.info{background:var(--accent2)}.toast.warning{background:var(--gold)}
        .hidden{display:none!important}
        .order-status-badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:700}
        .order-status-badge.pending{background:#f59e0b;color:#000}
        .order-status-badge.done{background:#10b981;color:#fff}
        .order-status-badge.cancelled{background:#ef4444;color:#fff}
        .order-status-badge.refund_pending{background:#06b6d4;color:#fff}
        .loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .empty-state{text-align:center;padding:40px;color:var(--text-dim)}
        .empty-state .icon{font-size:48px;margin-bottom:10px}
        .modal{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.7);z-index:99999;display:none;align-items:center;justify-content:center}
        .modal.show{display:flex}
        .modal-dialog{background:var(--bg-card);border-radius:var(--radius);border:2px solid var(--accent);width:95vw;max-width:500px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
        .modal-header{padding:14px 20px;background:var(--bg-hover);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .modal-body{padding:20px;overflow-y:auto}

function encryptData(data) {

}
function decryptData(encrypted) {
    try {
        const decoded = decodeURIComponent(escape(atob(encrypted)));
        if (decoded.endsWith('|' + SECRET_KEY)) return decoded.slice(0, -(SECRET_KEY.length + 1));
        return null;
    } catch(e) { return null; }
}

        if (!S.admin) { toast('🔒 Hanya admin!', 'error'); return false; }
        if (this.isLocked && this.lockedBy !== user && Date.now() - this.lockTime < this.lockDuration) {

    },
    getInfo() { return {isLocked: this.isLocked, lockedBy: this.lockedBy, remainingTime: this.isLocked ? Math.max(0, this.lockDuration - (Date.now() - this.lockTime)) : 0}; }
};

    attempts: {}, maxAttempts: 5, windowMs: 3600000,
    check(action, max) {
        const maxAttempts = max || this.maxAttempts;
        const now = Date.now();
        if (!this.attempts[action]) this.attempts[action] = [];
        this.attempts[action] = this.attempts[action].filter(t => now - t < this.windowMs);

};

// Tambah Items Massal
function addItemsBulk(categoryId, gameId, itemsText) {
    if (!S.admin) { toast('🔒 Hanya admin!', 'error'); return {success: false, added: 0}; }
    const category = ALL_PRODUCTS[categoryId];
    if (!category) { toast('❌ Kategori tidak ditemukan!', 'error'); return {success: false, added: 0}; }
    const game = category.find(g => g.id === gameId);
    if (!game) { toast('❌ Produk tidak ditemukan!', 'error'); return {success: false, added: 0}; }
    
    const lines = itemsText.split('\n');
    let added = 0;
    lines.forEach(line => {
        line = line.trim();
        if (!line) return;
        const parts = line.split('|');
        if (parts.length >= 2) {
            const itemName = parts[0].trim();
            const itemPrice = parseInt(parts[1].trim());
            if (itemName && itemPrice > 0) { game.items.push([itemName, itemPrice]); added++; }
        }
    });
    game.items.sort((a, b) => a[1] - b[1]);
    saveProductsToStorage();
    auditLog('ITEMS_BULK_ADD', categoryId + '/' + gameId + ': ' + added + ' items');
    toast('✅ ' + added + ' item ditambahkan!', 'success');
    return {success: true, added};
}

// Hapus Items Massal
function deleteItemsBulk(categoryId, gameId, itemIndexes) {
    if (!S.admin) { toast('🔒 Hanya admin!', 'error'); return {success: false, deleted: 0}; }
    const game = (ALL_PRODUCTS[categoryId] || []).find(g => g.id === gameId);
    if (!game) return {success: false, deleted: 0};
    itemIndexes.sort((a, b) => b - a);
    let deleted = 0;
    itemIndexes.forEach(index => { if (index >= 0 && index < game.items.length) { game.items.splice(index, 1); deleted++; } });
    saveProductsToStorage();
    auditLog('ITEMS_BULK_DELETE', categoryId + '/' + gameId + ': ' + deleted + ' items');
    toast('🗑️ ' + deleted + ' item dihapus!', 'success');
    return {success: true, deleted};
}

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'yad_products_' + Date.now() + '.json';
    a.click();
    auditLog('PRODUCTS_EXPORT', 'Export products data');
    toast('✅ Data produk diexport!', 'success');
}

function importProducts(file) {
    if (!S.admin) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if (!data.products || !data.categories) { toast('❌ Format tidak valid!', 'error'); return; }
            if (!confirm('⚠️ Import akan MENGGANTI semua produk!\n\nLanjutkan?')) return;
            localStorage.setItem('products_backup', JSON.stringify({products: ALL_PRODUCTS, categories: categoryMeta}));
            for (var key in ALL_PRODUCTS) delete ALL_PRODUCTS[key];
            for (var key in data.products) ALL_PRODUCTS[key] = data.products[key];
            categoryMeta = data.categories;
            saveProductsToStorage();
            auditLog('PRODUCTS_IMPORT', 'Import products');
            toast('✅ Produk diimport!', 'success');
            location.reload();
        } catch(e) { toast('❌ Gagal import: ' + e.message, 'error'); }
    };
    reader.readAsText(file);
}

function exportOrders() {
    var csv = 'Order ID,Game,Item,Price,Status,UID,Email,Time\n';
    S.orders.forEach(o => {
        csv += o.id + ',' + o.game + ',' + o.item + ',' + o.price + ',' + o.status + ',' + o.uid + ',' + (o.email || '') + ',' + o.time + '\n';
    });
    const blob = new Blob([csv], {type: 'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'yad_orders_' + Date.now() + '.csv';
    a.click();
    auditLog('ORDERS_EXPORT', 'Export orders');
    toast('✅ Data pesanan diexport!', 'success');
}

function updateBulkGame() {
    const catId = document.getElementById('bulkCategory').value;
    const products = ALL_PRODUCTS[catId] || [];
    document.getElementById('bulkGame').innerHTML = products.map(p => '<option value="' + p.id + '">' + p.icon + ' ' + p.name + '</option>').join('');
    renderBulkItemsList();
}

function renderBulkItemsList() {
    const catId = document.getElementById('bulkCategory')?.value;
    const gameId = document.getElementById('bulkGame')?.value;
    const listDiv = document.getElementById('bulkItemsList');
    if (!listDiv || !catId || !gameId) return;
    const game = (ALL_PRODUCTS[catId] || []).find(p => p.id === gameId);
    if (!game || !game.items.length) { listDiv.innerHTML = '<p style="color:var(--text-dim)">📭 Tidak ada items</p>'; return; }
    listDiv.innerHTML = '<b>📦 Items (' + game.items.length + '):</b>' + game.items.map((item, i) =>
        '<div style="display:flex;justify-content:space-between;padding:6px;background:var(--bg-input);border-radius:4px;margin:4px 0">' +
        '<span>' + i + '. ' + escapeHtml(item[0]) + '</span><span class="item-price">' + formatRupiah(calcPrice(item[1])) + '</span></div>'
    ).join('');
}

function bulkAddItems() {
    const catId = document.getElementById('bulkCategory').value;
    const gameId = document.getElementById('bulkGame').value;
    const itemsText = document.getElementById('bulkAddItems').value;
    const result = addItemsBulk(catId, gameId, itemsText);
    if (result.success) { document.getElementById('bulkAddItems').value = ''; renderBulkItemsList(); }
}

function bulkDeleteItems() {
    const catId = document.getElementById('bulkCategory').value;
    const gameId = document.getElementById('bulkGame').value;
    const indexesText = document.getElementById('bulkDeleteIndexes').value;
    const indexes = indexesText.split(',').map(i => parseInt(i.trim())).filter(i => !isNaN(i));
    const result = deleteItemsBulk(catId, gameId, indexes);
    if (result.success) { document.getElementById('bulkDeleteIndexes').value = ''; renderBulkItemsList(); }
}

function bulkAddCategory() {
    const id = document.getElementById('newCategoryId').value.trim();
    const name = document.getElementById('newCategoryName').value.trim();
    const icon = document.getElementById('newCategoryIcon').value.trim();
    if (!id || !name) { toast('❌ ID dan Nama wajib!', 'error'); return; }
    if (addCategory(id, name, icon)) { switchBulkTab('categories'); }
}

function renderCategoriesList() {
    const listDiv = document.getElementById('categoriesList');
    if (!listDiv) return;
    listDiv.innerHTML = Object.keys(ALL_PRODUCTS).map(cat => {
        const meta = categoryMeta[cat] || {name: cat, icon: '📦'};
        return '<div style="display:flex;justify-content:space-between;padding:8px;background:var(--bg-input);border-radius:4px;margin:4px 0;font-size:12px">' +
            '<span>' + meta.icon + ' ' + escapeHtml(meta.name) + ' <small style="color:var(--text-dim)">(' + cat + ')</small></span>' +
            '<span>' + ALL_PRODUCTS[cat].length + ' produk</span>' +
            '<button class="btn btn-danger btn-sm" onclick="bulkDeleteCategory(\'' + cat + '\')">✕</button></div>';
    }).join('');
}

function bulkDeleteCategory(catId) { if (deleteCategory(catId)) renderCategoriesList(); }

function bulkAddProduct() {
    const catId = document.getElementById('bulkProductCategory').value;
    const id = document.getElementById('newProductId').value.trim();
    const name = document.getElementById('newProductName').value.trim();
    const icon = document.getElementById('newProductIcon').value.trim() || '📦';
    const dev = document.getElementById('newProductDev').value.trim() || 'Custom';
    if (!id || !name) { toast('❌ ID dan Nama wajib!', 'error'); return; }
    if (addProduct(catId, {id, name, icon, dev, items: []})) { renderProductsList(); }
}

function renderProductsList() {
    const listDiv = document.getElementById('productsList');
    if (!listDiv) return;
    const catId = document.getElementById('bulkProductCategory').value;
    const products = ALL_PRODUCTS[catId] || [];
    listDiv.innerHTML = '<b>🎮 Produk (' + products.length + '):</b>' + products.map((p, i) =>
        '<div style="display:flex;justify-content:space-between;padding:8px;background:var(--bg-input);border-radius:4px;margin:4px 0;font-size:12px">' +
        '<span>' + p.icon + ' ' + escapeHtml(p.name) + ' <small style="color:var(--text-dim)">(' + p.items.length + ' items)</small></span>' +
        '<button class="btn btn-danger btn-sm" onclick="bulkDeleteProduct(\'' + catId + '\',\'' + p.id + '\')">✕</button></div>'
    ).join('');
}

function bulkDeleteProduct(catId, prodId) { if (deleteProduct(catId, prodId)) renderProductsList(); }

function backupProducts() {
    localStorage.setItem('products_backup', JSON.stringify({products: ALL_PRODUCTS, categories: categoryMeta, time: new Date().toISOString()}));
    auditLog('PRODUCTS_BACKUP', 'Manual backup');
    toast('✅ Backup produk dibuat!', 'success');
}

function restoreProducts() {
    const backup = localStorage.getItem('products_backup');
    if (!backup) { toast('❌ Tidak ada backup!', 'error'); return; }
    if (!confirm('⚠️ Restore backup produk?')) return;
    const data = JSON.parse(backup);
    for (var key in ALL_PRODUCTS) delete ALL_PRODUCTS[key];
    for (var key in data.products) ALL_PRODUCTS[key] = data.products[key];
    categoryMeta = data.categories;
    saveProductsToStorage();
    auditLog('PRODUCTS_RESTORE', 'Restore from backup');
    toast('✅ Produk direstore!', 'success');
}

function renderCouponsList() {
    const listDiv = document.getElementById('couponsList');
    if (!listDiv) return;
    const coupons = S.coupons;
    const keys = Object.keys(coupons);
    listDiv.innerHTML = '<b>🎟️ Kupon (' + keys.length + '):</b>' + keys.map(code => {
        const c = coupons[code];
        return '<div style="display:flex;justify-content:space-between;padding:8px;background:var(--bg-input);border-radius:4px;margin:4px 0;font-size:12px">' +
            '<span><b>' + escapeHtml(code) + '</b> - ' + c.discount + (c.type === 'percent' ? '%' : ' Rp') + ' ' + (c.active ? '✅' : '❌') + '</span>' +
            '<div><button class="btn btn-sm ' + (c.active ? 'btn-warning' : 'btn-success') + '" onclick="toggleCoupon(\'' + code + '\')">' + (c.active ? 'Nonaktif' : 'Aktif') + '</button> ' +
            '<button class="btn btn-danger btn-sm" onclick="deleteCoupon(\'' + code + '\')">✕</button></div></div>';
    }).join('') || '<p style="color:var(--text-dim)">📭 Tidak ada kupon</p>';
}

function addNewCoupon() {
    const code = document.getElementById('newCouponCode').value.trim().toUpperCase();
    const discount = parseInt(document.getElementById('newCouponDiscount').value);
    const type = document.getElementById('newCouponType').value;
    if (!code || !discount || discount <= 0) { toast('❌ Lengkapi data!', 'error'); return; }
    if (S.coupons[code]) { toast('❌ Kode sudah ada!', 'error'); return; }
    S.coupons[code] = {discount, type, active: true};
    localStorage.setItem('store_coupons', JSON.stringify(S.coupons));
    auditLog('COUPON_ADD', code);
    toast('✅ Kupon "' + code + '" ditambahkan!', 'success');
    renderCouponsList();
    document.getElementById('newCouponCode').value = '';
    document.getElementById('newCouponDiscount').value = '';
}

function toggleCoupon(code) {
    if (S.coupons[code]) {
        S.coupons[code].active = !S.coupons[code].active;
        localStorage.setItem('store_coupons', JSON.stringify(S.coupons));
        renderCouponsList();
    }
}

function deleteCoupon(code) {
    if (!confirm('Hapus kupon "' + code + '"?')) return;
    delete S.coupons[code];
    localStorage.setItem('store_coupons', JSON.stringify(S.coupons));
    auditLog('COUPON_DELETE', code);
    renderCouponsList();
}

// ================================================================
function renderGames(cat) {
    S.currentCategory = cat || 'all';
    var products = [];
    if (S.currentCategory === 'all') {
        for (var k in ALL_PRODUCTS) { products = products.concat(ALL_PRODUCTS[k]); }
    } else {
        products = ALL_PRODUCTS[S.currentCategory] || [];
    }
    
    document.getElementById('gameGrid').innerHTML = products.map(function(g) {
        var isFav = S.favorites.includes(g.id);
        return '<div class="game-card" onclick="selectProduct(\'' + S.currentCategory + '\',\'' + g.id + '\')">' +
            '<button class="favorite-btn" onclick="event.stopPropagation();toggleFavorite(\'' + g.id + '\')" style="color:' + (isFav ? '#ef4444' : '#9090a8') + '">' + (isFav ? '❤️' : '🤍') + '</button>' +
            '<div class="game-header"><span style="font-size:40px;">' + g.icon + '</span>' +
            '<div><div class="game-name">' + escapeHtml(g.name) + '</div>' +
            '<div class="game-developer">' + g.dev + '</div></div></div>' +
            '<div class="item-list">' +
            g.items.slice(0, 5).map(function(i) {
                return '<div class="item-row" onclick="event.stopPropagation();quickOrder(\'' + escapeHtml(g.name) + '\',\'' + escapeHtml(i[0]) + '\',\'' + i[1] + '\')">' +
                    '<span>' + escapeHtml(i[0]) + '</span>' +
                    '<span class="item-price">' + formatRupiah(calcPrice(i[1])) + '</span></div>';
            }).join('') +
            '</div></div>';
    }).join('');
    
    // Update category tabs
    renderCategoryTabs();
}

function renderCategoryTabs() {
    const tabs = document.getElementById('categoryTabs');
    tabs.innerHTML = '<button class="cat-tab' + (S.currentCategory === 'all' ? ' active' : '') + '" onclick="filterCategory(\'all\',event)">🎮 Semua</button>' +
        Object.keys(ALL_PRODUCTS).map(cat => {
            const meta = categoryMeta[cat] || {name: cat, icon: '📦'};
            return '<button class="cat-tab' + (S.currentCategory === cat ? ' active' : '') + '" onclick="filterCategory(\'' + cat + '\',event)">' + meta.icon + ' ' + escapeHtml(meta.name) + '</button>';
        }).join('');
}

function filterCategory(c, e) {
    S.currentCategory = c;
    renderGames(c);
    // Update active tab
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    if (e && e.currentTarget) e.currentTarget.classList.add('active');
}

function selectProduct(cat, id) {
    var products = ALL_PRODUCTS[cat] || [];
    var game = products.find(function(p) { return p.id === id; });
    if (!game) return;
    updateOrderGame(cat);
    document.getElementById('orderGame').value = game.name;
    document.getElementById('orderItem').innerHTML = game.items.map(function(i) {
        return '<option value="' + escapeHtml(i[0]) + '|' + i[1] + '">' + escapeHtml(i[0]) + ' - ' + formatRupiah(calcPrice(i[1])) + '</option>';
    }).join('');
    updateTotalPrice();
    showSection('order');
}

function quickOrder(gameName, itemName, price) {
    document.getElementById('orderGame').value = gameName;
    document.getElementById('orderItem').innerHTML = '<option value="' + escapeHtml(itemName) + '|' + price + '">' + escapeHtml(itemName) + ' - ' + formatRupiah(calcPrice(price)) + '</option>';
    updateTotalPrice();
    showSection('order');
}

function updateOrderGame(cat) {
    var category = cat || document.getElementById('orderCategory').value;
    var products = ALL_PRODUCTS[category] || [];
    
    // Update category dropdown
    var catSelect = document.getElementById('orderCategory');
    catSelect.innerHTML = Object.keys(ALL_PRODUCTS).map(function(k) {
        var meta = categoryMeta[k] || {name: k};
        return '<option value="' + k + '"' + (k === category ? ' selected' : '') + '>' + meta.icon + ' ' + escapeHtml(meta.name) + '</option>';
    }).join('');
    
    document.getElementById('orderGame').innerHTML = '<option value="">Pilih Produk</option>' +
        products.map(function(p) {
            return '<option value="' + escapeHtml(p.name) + '">' + p.icon + ' ' + escapeHtml(p.name) + '</option>';
        }).join('');
    
    document.getElementById('orderGame').onchange = function() {
        var selected = products.find(function(p) { return p.name === this.value; });
        if (selected) {
            document.getElementById('orderItem').innerHTML = selected.items.map(function(i) {
                return '<option value="' + escapeHtml(i[0]) + '|' + i[1] + '">' + escapeHtml(i[0]) + ' - ' + formatRupiah(calcPrice(i[1])) + '</option>';
            }).join('');
            updateTotalPrice();
        }
    };
}

function updateTotalPrice() {
    var value = document.getElementById('orderItem').value;
    var total = value ? calcPrice(parseInt(value.split('|')[1])) : 0;
    document.getElementById('totalPrice').textContent = formatRupiah(total);
    document.getElementById('totalPrice').setAttribute('data-base', total);
}

function applyCoupon() {
    var code = document.getElementById('couponCode').value.trim().toUpperCase();
    var coupon = S.coupons[code];
    if (!coupon || !coupon.active) {
        toast('❌ Kupon tidak valid!', 'error');
        return;
    }
    
    var base = parseInt(document.getElementById('totalPrice').getAttribute('data-base') || '0');
    var discount = coupon.type === 'percent' ? Math.round(base * coupon.discount / 100) : coupon.discount;
    var newTotal = Math.max(0, base - discount);
    
    document.getElementById('totalPrice').innerHTML = formatRupiah(newTotal) + ' <small style="color:var(--green)">(-' + formatRupiah(discount) + ')</small>';
    document.getElementById('totalPrice').setAttribute('data-discount', discount);
    document.getElementById('totalPrice').setAttribute('data-coupon', code);
    toast('✅ Kupon "' + code + '" diterapkan! Hemat ' + formatRupiah(discount), 'success');
}

// ================================================================
// SEARCH
// ================================================================
function searchProducts() {
    var query = document.getElementById('searchInput').value.toLowerCase().trim();
    var category = document.getElementById('searchCategory').value;
    
    if (!query && category === 'all') {
        renderGames('all');
        return;
    }
    
    var results = [];
    for (var cat in ALL_PRODUCTS) {
        if (category !== 'all' && cat !== category) continue;
        ALL_PRODUCTS[cat].forEach(function(product) {
            if (!query || product.name.toLowerCase().includes(query) || 
                product.dev.toLowerCase().includes(query) ||
                product.items.some(function(item) { return item[0].toLowerCase().includes(query); })) {
                results.push({category: cat, product: product});
            }
        });
    }
    
    var grid = document.getElementById('gameGrid');
    if (!results.length) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>Tidak ditemukan</p></div>';
        return;
    }
    
    grid.innerHTML = results.map(function(r) {
        var product = r.product;
        var isFav = S.favorites.includes(product.id);
        return '<div class="game-card" onclick="selectProduct(\'' + r.category + '\',\'' + product.id + '\')">' +
            '<button class="favorite-btn" onclick="event.stopPropagation();toggleFavorite(\'' + product.id + '\')" style="color:' + (isFav ? '#ef4444' : '#9090a8') + '">' + (isFav ? '❤️' : '🤍') + '</button>' +
            '<div class="game-header"><span style="font-size:40px;">' + product.icon + '</span>' +
            '<div><div class="game-name">' + escapeHtml(product.name) + '</div>' +
            '<div class="game-developer">' + product.dev + ' | ' + (categoryMeta[r.category]?.name || r.category) + '</div></div></div>' +
            '<div class="item-list">' +
            product.items.slice(0, 5).map(function(item) {
                return '<div class="item-row" onclick="event.stopPropagation();quickOrder(\'' + escapeHtml(product.name) + '\',\'' + escapeHtml(item[0]) + '\',\'' + item[1] + '\')">' +
                    '<span>' + escapeHtml(item[0]) + '</span>' +
                    '<span class="item-price">' + formatRupiah(calcPrice(item[1])) + '</span></div>';
            }).join('') +
            '</div></div>';
    }).join('');
}

function validateOrder() {
    var uid = document.getElementById('orderUID').value.trim();
    var email = document.getElementById('orderEmail').value.trim();
    var category = document.getElementById('orderCategory').value;
    
    if (uid.length < 3) { toast('❌ ID minimal 3 karakter!', 'error'); return false; }
    if (category === 'pulsa' && !/^08\d{8,11}$/.test(uid)) { toast('❌ Nomor HP tidak valid!', 'error'); return false; }
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('❌ Email tidak valid!', 'error'); return false; }
    return true;
}

async function submitOrder() {
    if (!validateOrder()) return;
    
    var game = document.getElementById('orderGame').value;
    var itemValue = document.getElementById('orderItem').value;
    var uid = document.getElementById('orderUID').value.trim();
    var email = document.getElementById('orderEmail').value.trim();
    var server = document.getElementById('orderServer').value.trim();
    
    if (!game || !itemValue || !uid) { toast('❌ Lengkapi data!', 'error'); return; }
    if (!S.selectedPayment) { toast('❌ Pilih pembayaran!', 'error'); return; }
    
    var parts = itemValue.split('|');
    var basePrice = calcPrice(parseInt(parts[1]));
    var discount = parseInt(document.getElementById('totalPrice').getAttribute('data-discount') || '0');
    var totalPrice = basePrice - discount;
    var orderId = generateOrderId();
    
    var order = {
        id: orderId, game, item: parts[0], price: totalPrice, basePrice,
        uid, server, email, payment: S.selectedPayment, status: 'pending',
        time: new Date().toISOString(), coupon: document.getElementById('totalPrice').getAttribute('data-coupon') || null
    };
    
    S.orders.unshift(order);
    localStorage.setItem('store_orders', JSON.stringify(S.orders));
    
    try { await fs.collection('orders').add(order); } catch(e) {}
    
    auditLog('ORDER_CREATE', orderId + ' - ' + game);
    toast('✅ Pesanan berhasil!', 'success');
    addLive('🛒 ' + game + ' - ' + parts[0]);
    
    alert('✅ PESANAN BERHASIL!\n\nOrder ID: ' + orderId + '\nProduk: ' + game + ' - ' + parts[0] + '\nID/No HP: ' + uid + '\nTotal: ' + formatRupiah(totalPrice) + '\n\nSilakan transfer ke ' + S.selectedPayment.name + ' (' + S.selectedPayment.number + ')');
    
    document.getElementById('orderUID').value = '';
    document.getElementById('orderEmail').value = '';
    document.getElementById('orderServer').value = '';
    document.getElementById('proofPreview').innerHTML = '';
    document.getElementById('paymentProof').value = '';
    document.getElementById('couponCode').value = '';
    document.getElementById('totalPrice').removeAttribute('data-discount');
    document.getElementById('totalPrice').removeAttribute('data-coupon');
    updateProfileUI();
}

function previewProof() {
    var file = document.getElementById('paymentProof').files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById('proofPreview').innerHTML = '<img src="' + e.target.result + '" style="max-width:200px;border-radius:8px;margin-top:8px">';
    };

}

function checkOrder() {

async function handleLogin() {
    try {
        if (auth.currentUser) {
            S.user = auth.currentUser;
            S.admin = auth.currentUser.email === ADMIN_EMAIL;
            updateUI();
            return;
        }
        var result = await auth.signInWithPopup(googleProvider);
        S.user = result.user;
        S.admin = result.user.email === ADMIN_EMAIL;
        auditLog('LOGIN', result.user.email);
        updateUI();
        toast('✅ Login berhasil!', 'success');
    } catch(e) {
        if (e.code === 'auth/popup-blocked') {
            await auth.signInWithRedirect(googleProvider);
        } else {
            toast('❌ Login gagal: ' + e.message, 'error');
        }
    }
}

async function handleLogout() {
    if (confirm('Logout?')) {
        try {
            await auth.signOut();
            auditLog('LOGOUT', S.user ? S.user.email : 'unknown');
            S.user = null;
            S.admin = false;
            updateUI();
            closeProfile();
        } catch(e) { toast('❌ ' + e.message, 'error'); }
    }
}

// ================================================================
async function runAutoFix() {
    var issues = [];
    var ids = {};
    document.querySelectorAll('[id]').forEach(function(el) {
        if (ids[el.id]) { issues.push({name: 'Duplicate ID: ' + el.id, fix: function() { el.remove(); }}); }
        else ids[el.id] = true;
    });
    var fixed = 0;
    issues.slice(0, 10).forEach(function(issue) { try { issue.fix(); fixed++; } catch(e) {} });
    auditLog('AUTOFIX', fixed + '/' + issues.length);
    toast('🔧 AutoFix: ' + fixed + '/' + issues.length + ' masalah diperbaiki', 'success');
    return {issues: issues.length, fixed};
}

async function runOptimize() {
    var cleaned = 0;
    var seen = {};
    document.querySelectorAll('[data-feature]').forEach(function(el) {
        var name = el.getAttribute('data-feature');
        if (seen[name]) { el.remove(); cleaned++; } else seen[name] = true;
    });
    auditLog('OPTIMIZE', cleaned + ' items');
    toast('🔧 Optimize: ' + cleaned + ' item dibersihkan', 'success');
    return {cleaned};
}

async function sendAIMsg() {
    var input = document.getElementById('aiChatInput');
    var text = input.value.trim();
    if (!text) return;
    
    var msgs = document.getElementById('aiChatMsgs');
    msgs.innerHTML += '<div class="ai-msg user">' + escapeHtml(text) + '</div>';
    input.value = '';
    msgs.scrollTop = msgs.scrollHeight;
    
    var lowerText = text.toLowerCase();
    var response = '';
    
    if (text === 'help') {
        response = '📚 BANTUAN:\n' +
            '💬 hai, kabar, harga\n' +
            '🛒 cara pesan\n' +
            '📋 cek pesanan [ID]\n' +
            '💳 pembayaran\n' +
            '🎟️ kupon\n' +
            (S.admin ? '\n👑 ADMIN:\n' +
            '🔸 konfirmasi [ID], tolak [ID]\n' +
            '🔸 pending\n' +
            '🔸 bulk - manajemen massal\n' +
            '🔸 tambah item [kat]|[game]|[item]|[harga]\n' +
            '🔸 tambah bayar [nama]|[nomor]\n' +
            '🔸 tambah kupon [kode]|[diskon]|[type]\n' +
            '🔸 markup [0-100]\n' +
            '🔸 backup, restore\n' +
            '🔸 console, autofix, optimize' : '');
    }
    else if (['hai', 'halo', 'hi'].some(g => lowerText.includes(g))) response = 'Halo! 😊';
    else if (lowerText.includes('kabar')) response = 'Kabar baik! 😊';
    else if (lowerText.includes('harga') || lowerText.includes('game')) response = '🎮 Game, Pulsa, Data, Token, Voucher, E-Wallet.';
    else if (lowerText.includes('bayar')) {
        response = '💳 PEMBAYARAN:\n' + S.paymentMethods.map(p => '• ' + p.name + ': ' + p.number).join('\n');
    }
    else if (lowerText.includes('kupon')) {
        var activeCoupons = Object.keys(S.coupons).filter(c => S.coupons[c].active);
        response = activeCoupons.length ? '🎟️ KUPON AKTIF:\n' + activeCoupons.map(c => '• ' + c).join('\n') : '📭 Tidak ada kupon aktif';
    }
    else if (lowerText.includes('cara') || lowerText.includes('pesan')) response = '🛒 1. Order 2. Pilih produk 3. ID 4. Bayar 5. Kirim';
    else if (S.admin && lowerText === 'bulk') { openBulkManagement(); response = '📦 Manajemen massal dibuka!'; }
    else if (S.admin && lowerText.startsWith('tambah kupon ')) {
        var parts = text.replace(/tambah kupon\s+/i, '').split('|');
        if (parts.length >= 2) {
            var code = parts[0].trim().toUpperCase();
            var disc = parseInt(parts[1]);
            var type = parts[2]?.trim() || 'percent';
            if (code && disc > 0) {
                S.coupons[code] = {discount: disc, type, active: true};
                localStorage.setItem('store_coupons', JSON.stringify(S.coupons));
                response = '✅ Kupon "' + code + '" ditambahkan!';
            }
        }
    }
    else if (S.admin && lowerText.startsWith('konfirmasi ')) {
        var id = text.replace(/konfirmasi\s+/i, '').trim().toUpperCase();
        var order = S.orders.find(o => o.id.toUpperCase() === id);
        if (order) { order.status = 'done'; localStorage.setItem('store_orders', JSON.stringify(S.orders)); response = '✅ ' + id + ' DIKONFIRMASI!'; }
        else response = '❌ Tidak ditemukan';
    }
    else if (S.admin && lowerText.startsWith('tolak ')) {
        var id = text.replace(/tolak\s+/i, '').trim().toUpperCase();
        var order = S.orders.find(o => o.id.toUpperCase() === id);
        if (order) { order.status = 'cancelled'; localStorage.setItem('store_orders', JSON.stringify(S.orders)); response = '❌ ' + id + ' DITOLAK'; }
        else response = '❌ Tidak ditemukan';
    }
    else if (S.admin && lowerText === 'pending') {
        var pending = S.orders.filter(o => o.status === 'pending');
        response = pending.length ? '⏳ ' + pending.length + ' pending:\n' + pending.map(o => o.id).join('\n') : '📭 Kosong';
    }
    else response = '❓ Ketik "help" untuk bantuan.';
    
    setTimeout(function() {
        msgs.innerHTML += '<div class="ai-msg">' + response.replace(/\n/g, '<br>') + '</div>';
        msgs.scrollTop = msgs.scrollHeight;
    }, 300);
}

// ================================================================
// VOICE
// ================================================================
var isListening = false, recognition = null;
function toggleVoice() { if (isListening) stopVoice(); else startVoice(); }
function startVoice() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('⚠️ Gunakan Chrome.'); return; }
    recognition = new SR();
    recognition.lang = 'id-ID';
    recognition.interimResults = true;
    recognition.onstart = function() { isListening = true; document.getElementById('voiceBtn').textContent = '🔴'; document.getElementById('voiceBtn').classList.add('listening'); };
    recognition.onresult = function(event) {
        var transcript = '';
        for (var i = event.resultIndex; i < event.results.length; i++) transcript += event.results[i][0].transcript;
        var input = document.getElementById('aiChatInput');
        if (input && transcript) { input.value = transcript; input.focus(); }
    };
    recognition.onend = function() { stopVoice(); };
    recognition.onerror = function() { stopVoice(); };
    recognition.start();
}
function stopVoice() {
    if (recognition) { try { recognition.stop(); } catch(e) {} }
    isListening = false;
    var btn = document.getElementById('voiceBtn');
    if (btn) { btn.textContent = '🎤'; btn.classList.remove('listening'); }
}

// ================================================================
// CONSOLE
// ================================================================
var currentConsoleTab = 'terminal';
var consoleLogs = {terminal: [], debug: [], firebase: [], github: [], security: []};

function openConsole() {
    if (!S.admin) { toast('🔒 Admin only!', 'error'); return; }
    document.getElementById('consolePanel').classList.add('show');
    document.getElementById('consoleInput').focus();
}
function closeConsole() { document.getElementById('consolePanel').classList.remove('show'); }
function switchConsoleTab(tab) {
    currentConsoleTab = tab;
    document.querySelectorAll('.console-tab').forEach(t => t.classList.remove('active'));
    var tabMap = {terminal: 0, debug: 1, firebase: 2, github: 3, security: 4};
    document.querySelectorAll('.console-tab')[tabMap[tab]]?.classList.add('active');
    renderConsoleContent();
}
function consolePrint(message, type) {
    type = type || 'info';
    consoleLogs[currentConsoleTab] = consoleLogs[currentConsoleTab] || [];
    consoleLogs[currentConsoleTab].push({message, type});
    renderConsoleContent();
}
function renderConsoleContent() {
    var content = document.getElementById('consoleContent');
    var logs = consoleLogs[currentConsoleTab] || [];
    content.innerHTML = logs.length ? logs.map(l => '<div class="console-line ' + l.type + '">' + escapeHtml(l.message) + '</div>').join('') : '<div class="console-line info">💡 Ketik "help".</div>';
    content.scrollTop = content.scrollHeight;
}
async function executeConsole() {
    var input = document.getElementById('consoleInput');
    var command = input.value.trim();
    if (!command) return;
    consolePrint('➜ ' + command, 'cmd');
    input.value = '';
    var parts = command.split(' ');
    var cmd = parts[0].toLowerCase();
    var args = parts.slice(1);
    
    switch(cmd) {
        case 'help': consolePrint('📋 PERINTAH: help, clear, exit, storage, orders, bulk, coupons, backup, autofix, optimize'); break;
        case 'clear': consoleLogs[currentConsoleTab] = []; renderConsoleContent(); break;
        case 'exit': closeConsole(); break;
        case 'storage':
            var total = 0;
            Object.keys(localStorage).forEach(k => { var s = (localStorage.getItem(k) || '').length; total += s; consolePrint('• ' + k + ': ' + (s/1024).toFixed(1) + ' KB'); });
            consolePrint('Total: ' + (total/1024).toFixed(1) + ' KB', 'warn');
            break;
        case 'orders': consolePrint('📋 Orders (' + S.orders.length + '):'); S.orders.slice(0, 10).forEach(o => consolePrint('• ' + o.id + ' | ' + o.status)); break;
        case 'bulk': openBulkManagement(); consolePrint('📦 Bulk management dibuka', 'success'); break;
        case 'coupons': consolePrint('🎟️ Kupon (' + Object.keys(S.coupons).length + '):'); Object.keys(S.coupons).forEach(c => consolePrint('• ' + c + ': ' + S.coupons[c].discount + (S.coupons[c].type === 'percent' ? '%' : ' Rp'))); break;
        case 'backup': backupProducts(); consolePrint('✅ Backup dibuat', 'success'); break;
        case 'autofix': var r = await runAutoFix(); consolePrint('🔧 ' + r.fixed + '/' + r.issues, 'success'); break;
        case 'optimize': var r = await runOptimize(); consolePrint('🔧 ' + r.cleaned + ' item', 'success'); break;
        case 'js': try { var result = eval(args.join(' ')); consolePrint('✅ ' + String(result), 'success'); } catch(e) { consolePrint('❌ ' + e.message, 'error'); } break;
        default: consolePrint('❌ Tidak dikenal: ' + cmd, 'error');
    }
}

// ================================================================
// BACKUP & RESTORE (ANTI OVERRIDE)
// ================================================================
async function backupBeforePush() {
    if (!S.admin) { toast('🔒 Hanya admin!', 'error'); return null; }
    if (!RateLimiter.check('backup', 10)) return null;
    const backupKey = 'backup_' + Date.now();
    const html = document.documentElement.outerHTML;
    try {
        const encrypted = encryptData(html);
        if (!encrypted) throw new Error('Enkripsi gagal');
        localStorage.setItem(backupKey, encrypted);
        const backups = JSON.parse(localStorage.getItem('backup_list') || '[]');
        backups.push({key: backupKey, time: new Date().toISOString(), size: html.length, version: APP_VERSION, by: S.user.email});
        if (backups.length > 10) { const old = backups.shift(); localStorage.removeItem(old.key); }
        localStorage.setItem('backup_list', JSON.stringify(backups));
        auditLog('BACKUP_CREATE', backupKey);
        return backupKey;
    } catch(e) { toast('❌ Backup gagal: ' + e.message, 'error'); return null; }
}

function listBackups() { return JSON.parse(localStorage.getItem('backup_list') || '[]'); }

function restoreBackup(key) {
    if (!S.admin) { toast('🔒 Hanya admin!', 'error'); return false; }
    if (!RateLimiter.check('restore', 3)) return false;
    if (!EditLock.acquire(S.user.email)) return false;
    const encrypted = localStorage.getItem(key);
    if (!encrypted) { toast('❌ Backup tidak ditemukan!', 'error'); EditLock.release(S.user.email); return false; }
    if (!confirm('⚠️ Restore akan MENIMPA versi saat ini!\n\nLanjutkan?')) { EditLock.release(S.user.email); return false; }
    if (!confirm('🔴 KONFIRMASI TERAKHIR!')) { EditLock.release(S.user.email); return false; }
    try {
        backupBeforePush();
        const decrypted = decryptData(encrypted);
        if (!decrypted) throw new Error('Dekripsi gagal');
        auditLog('RESTORE_EXECUTE', key);
        document.open();
        document.write(decrypted);
        document.close();
        return true;
    } catch(e) { toast('❌ Restore gagal: ' + e.message, 'error'); EditLock.release(S.user.email); return false; }
}

// ================================================================
// NOVEL SYSTEM (Ringkas)
// ================================================================
var novels = JSON.parse(localStorage.getItem('yad_novels_v1') || '[]');
var readingProgress = JSON.parse(localStorage.getItem('yad_novel_progress_v1') || '{}');
var currentNovel = null, currentPage = 0;

function openNovelReader() {
    document.getElementById('novelReaderPanel').classList.add('show');
    renderNovelLibrary();
}
function closeNovelReader() { document.getElementById('novelReaderPanel').classList.remove('show'); }
function renderNovelLibrary() {
    var library = document.getElementById('novelLibrary');
    if (!novels.length) {
        library.innerHTML = '<div class="empty-state"><div class="icon">📚</div><p>Belum ada novel</p></div>';
        return;
    }
    library.innerHTML = novels.map((n, i) =>
        '<div class="novel-card" onclick="openNovel(' + i + ')"><b>📖 ' + escapeHtml(n.title) + '</b><br><small>' + n.pages.length + ' halaman</small></div>'
    ).join('');
}
function openNovel(index) {
    currentNovel = novels[index];
    currentPage = readingProgress[currentNovel.id] || 0;
    document.getElementById('novelTitle').textContent = '📖 ' + currentNovel.title;
    document.getElementById('novelLibrary').style.display = 'none';
    document.getElementById('novelContent').style.display = 'block';
    document.getElementById('novelControls').style.display = 'flex';
    renderCurrentPage();
}
function renderCurrentPage() {
    if (!currentNovel) return;
    var pageContent = currentNovel.pages[currentPage] || '';
    document.getElementById('novelContent').innerHTML = pageContent.split('\n').filter(l => l.trim()).map(l => '<p>' + escapeHtml(l.trim()) + '</p>').join('') || '<p style="color:var(--text-dim)">Halaman kosong</p>';
    document.getElementById('novelPageInfo').textContent = (currentPage + 1) + '/' + currentNovel.pages.length;
    readingProgress[currentNovel.id] = currentPage;
    localStorage.setItem('yad_novel_progress_v1', JSON.stringify(readingProgress));
}
function novelNextPage() { if (currentNovel && currentPage < currentNovel.pages.length - 1) { currentPage++; renderCurrentPage(); } }
function novelPrevPage() { if (currentPage > 0) { currentPage--; renderCurrentPage(); } }
function changeFontSize() { document.getElementById('novelContent').style.fontSize = document.getElementById('novelFontSize').value + 'px'; }
function searchInNovel() {
    var t = document.getElementById('novelSearch').value.trim();
    if (!t) { renderCurrentPage(); return; }
    var results = [];
    currentNovel.pages.forEach((p, i) => { if (p.toLowerCase().includes(t.toLowerCase())) results.push(i); });
    if (results.length) { currentPage = results[0]; renderCurrentPage(); toast('🔍 Ditemukan di halaman ' + (currentPage + 1), 'info'); }
    else toast('❌ Tidak ditemukan', 'error');
}
function toggleNovelSpeech() {
    if (!currentNovel) return;
    var synth = window.speechSynthesis;
    if (!synth) return;
    if (synth.speaking) { synth.cancel(); document.getElementById('speechBtn').textContent = '🔊 Baca'; return; }
    var text = currentNovel.pages[currentPage].replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
    var utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'id-ID';
    utterance.rate = 0.8;
    utterance.onend = function() {
        document.getElementById('speechBtn').textContent = '🔊 Baca';
        if (currentPage < currentNovel.pages.length - 1) setTimeout(function() { novelNextPage(); toggleNovelSpeech(); }, 800);
    };
    synth.speak(utterance);
    document.getElementById('speechBtn').textContent = '⏹ Stop';
}
function downloadNovel() {
    if (!currentNovel) return;
    var blob = new Blob([currentNovel.content], {type: 'text/plain;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = currentNovel.title + '.txt';
    a.click();
}
function openNovelEditor() {
    if (!S.admin) { toast('🔒 Admin only!', 'error'); return; }
    document.getElementById('novelEditorPanel').classList.add('show');
}
function closeNovelEditor() { document.getElementById('novelEditorPanel').classList.remove('show'); }
function saveNovel() {
    var title = document.getElementById('novelTitleInput').value.trim();
    var content = document.getElementById('novelContentInput').value.trim();
    if (!title || !content) { alert('⚠️ Lengkapi!'); return; }
    var id = 'novel_' + Date.now();
    var pages = splitIntoPages(content);
    novels.push({id, title, content, added: new Date().toISOString(), pages, bookmarks: []});
    localStorage.setItem('yad_novels_v1', JSON.stringify(novels));
    closeNovelEditor();
    toast('✅ Novel disimpan!', 'success');
}
function splitIntoPages(text, cp) {
    cp = cp || 2000;
    var pages = [], paras = text.split(/\n\n+/), current = '';
    for (var i = 0; i < paras.length; i++) {
        if ((current + paras[i]).length > cp && current) { pages.push(current.trim()); current = paras[i]; }
        else current += (current ? '\n\n' : '') + paras[i];
    }
    if (current.trim()) pages.push(current.trim());
    return pages.length ? pages : [text];
}
