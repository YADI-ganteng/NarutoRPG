<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YAD Store - Top Up Game & Pulsa Termurah</title>
    <meta name="description" content="YAD Store - Top up game, pulsa, paket data, token listrik, voucher, dan e-wallet termurah.">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root{--bg:#0a0a14;--bg-card:#12122a;--bg-hover:#1a1a35;--bg-input:#0d0d20;--text:#e8e8f0;--text-dim:#9090a8;--accent:#8b5cf6;--accent2:#06b6d4;--gold:#f59e0b;--green:#10b981;--red:#ef4444;--pink:#ec4899;--border:#252540;--radius:14px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
        .header{background:rgba(10,10,20,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:12px;flex-wrap:wrap}
        .logo{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .nav-links{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
        .btn{padding:7px 14px;border-radius:18px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:11px;font-weight:600;transition:all 0.2s;font-family:inherit}
        .btn:hover{background:var(--bg-hover);border-color:var(--accent)}
        .btn-primary{background:var(--accent);color:white;border:none}
        .activity-bar{background:#0d0d15;border-bottom:1px solid var(--border);padding:6px 16px;font-size:10px;color:var(--text-dim);display:flex;gap:20px;overflow:hidden;white-space:nowrap;flex-wrap:wrap}
        .dot-live{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block;animation:blink 2s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
        .container{max-width:1200px;margin:0 auto;padding:20px}
        .floating-ai{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));color:white;border:none;cursor:pointer;font-size:24px;z-index:400;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(139,92,246,0.4);animation:float 3s ease-in-out infinite}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .whatsapp-float{position:fixed;bottom:24px;left:24px;width:56px;height:56px;background:#25D366;color:white;border-radius:50%;text-align:center;font-size:28px;box-shadow:0 8px 32px rgba(37,211,102,0.4);z-index:400;display:flex;align-items:center;justify-content:center;text-decoration:none}
        .ai-chat-widget{position:fixed;bottom:90px;right:20px;width:420px;max-width:92vw;z-index:450;background:var(--bg-card);border-radius:var(--radius);border:2px solid var(--accent);overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.6);display:none;flex-direction:column;max-height:80vh}
        .ai-chat-widget.show{display:flex}
        .ai-chat-header{padding:10px 14px;background:var(--bg-hover);cursor:pointer;display:flex;justify-content:space-between;font-weight:700;font-size:13px}
        .ai-chat-body{display:flex;flex-direction:column;overflow:hidden}
        .ai-chat-body.hidden{display:none}
        .ai-chat-messages{height:300px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
        .ai-msg{padding:7px 10px;border-radius:12px;font-size:12px;line-height:1.4;background:var(--bg-input);max-width:90%;word-break:break-word}
        .ai-msg.user{background:var(--accent);color:white;margin-left:auto}
        .ai-msg.system{background:var(--bg-hover);color:var(--accent2);text-align:center;font-size:10px;max-width:100%}
        .ai-chat-input-area{padding:8px;border-top:1px solid var(--border);display:flex;gap:6px}
        .ai-chat-input-area input{flex:1;padding:8px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:16px;color:var(--text);font-size:12px;outline:none;font-family:inherit}
        .ai-chat-input-area button{background:var(--accent);color:white;border:none;padding:8px 14px;border-radius:16px;cursor:pointer;font-size:14px}
        .quick-edit-bar{padding:8px;background:var(--bg-input);border-top:1px solid var(--border);display:none}
        .quick-edit-btn{padding:4px 8px;margin:2px;font-size:10px;border-radius:4px;border:1px solid var(--border);background:var(--bg-hover);color:var(--text);cursor:pointer;font-family:inherit}
        .fit-btn{background:linear-gradient(135deg,#8b5cf6,#ec4899)!important;color:#fff!important;border:none!important;font-weight:700!important;display:none}
        .fit-dropdown{position:fixed;top:55px;right:20px;z-index:9999;background:#1a1a2e;border-radius:12px;border:2px solid #8b5cf6;box-shadow:0 20px 60px rgba(139,92,246,0.5);display:none;min-width:250px;overflow:hidden}
        .fit-dropdown.show{display:block}
        .fit-dropdown-header{padding:12px 16px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-bottom:1px solid #252540;font-weight:700;font-size:14px;color:#fff;display:flex;justify-content:space-between;align-items:center}
        .fit-dropdown-body{padding:8px}
        .fit-dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:12px;color:#e8e8f0;border:none;background:transparent;width:100%;text-align:left;font-family:inherit}
        .fit-dropdown-item:hover{background:#252540}
        .fit-dropdown-item.add{border-left:3px solid #10b981}
        .fit-dropdown-item.list{border-left:3px solid #06b6d4}
        .fit-dropdown-item.delete{border-left:3px solid #ef4444}
        .fit-dropdown-item.filemanager{border-left:3px solid #f59e0b}
        .fit-panel{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);z-index:99999;display:none;align-items:center;justify-content:center}
        .fit-panel.show{display:flex}
        .fit-panel-dialog{background:#1a1a2e;border-radius:16px;border:2px solid #8b5cf6;width:95vw;max-width:650px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
        .fit-panel-header{padding:14px 20px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-bottom:1px solid #252540;display:flex;justify-content:space-between;align-items:center}
        .fit-panel-body{padding:20px;overflow-y:auto}
        .fit-panel-body label{display:block;color:#9090a8;font-size:11px;font-weight:600;margin-bottom:4px;text-transform:uppercase}
        .fit-panel-body input,.fit-panel-body textarea,.fit-panel-body select{width:100%;padding:10px;background:#0d0d20;border:1px solid #252540;border-radius:8px;color:#e8e8f0;font-size:13px;margin-bottom:12px;outline:none;font-family:inherit;resize:vertical}
        .fit-list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#0d0d20;border-radius:6px;margin-bottom:4px;font-size:11px}
        .fit-list-del{background:#ef4444;color:#fff;border:none;border-radius:4px;padding:3px 10px;cursor:pointer;font-size:10px}
        .category-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
        .cat-tab{padding:8px 16px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-family:inherit}
        .cat-tab:hover,.cat-tab.active{background:var(--accent);color:white;border-color:var(--accent)}
        .game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
        .game-card{background:var(--bg-card);border-radius:var(--radius);padding:20px;border:1px solid var(--border);cursor:pointer;transition:all 0.3s}
        .game-card:hover{border-color:var(--accent);transform:translateY(-2px)}
        .game-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
        .game-icon{font-size:40px}.game-name{font-size:16px;font-weight:700}.game-developer{font-size:10px;color:var(--text-dim)}
        .item-list{display:flex;flex-direction:column;gap:6px}
        .item-row{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--bg-input);border-radius:8px;font-size:12px;cursor:pointer}
        .item-row:hover{background:var(--bg-hover)}.item-price{font-weight:700;color:var(--gold)}
        .order-section{background:var(--bg-card);border-radius:var(--radius);padding:24px;margin:20px 0;border:1px solid var(--border)}
        .form-group{margin:10px 0}.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:3px;text-transform:uppercase}
        .form-group input,.form-group select{width:100%;padding:10px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;outline:none}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .payment-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:10px 0}
        .payment-card{background:var(--bg-input);border:2px solid var(--border);border-radius:10px;padding:14px;text-align:center;cursor:pointer;font-size:12px}
        .payment-card:hover,.payment-card.selected{border-color:var(--accent);background:var(--bg-hover)}
        .live-feed{background:var(--bg-card);border-radius:var(--radius);padding:16px;margin:20px 0;border:1px solid var(--border);max-height:200px;overflow-y:auto}
        .live-item{padding:6px 0;border-bottom:1px solid var(--border);font-size:11px;color:var(--text-dim)}
        .toast-container{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:600}
        .toast{padding:8px 16px;border-radius:16px;color:white;font-size:10px;font-weight:600;animation:toastIn 0.3s ease;margin-bottom:6px}
        @keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
        .toast.success{background:var(--green)}.toast.error{background:var(--red)}.toast.info{background:var(--accent2)}
        .hidden{display:none!important}
        .loading-spinner{display:inline-block;width:20px;height:20px;border:3px solid var(--bg-hover);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .github-file-manager-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:95vw;max-width:900px;max-height:85vh;background:var(--bg-card);border-radius:var(--radius);border:2px solid #06b6d4;z-index:99999;display:none;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.9);overflow:hidden}
        .github-file-manager-panel.show{display:flex}
        .github-fm-header{padding:14px 20px;background:linear-gradient(135deg,#1a1a2e,#0d3d3d);border-bottom:1px solid #06b6d4;display:flex;justify-content:space-between;align-items:center}
        .github-fm-toolbar{padding:10px 16px;background:var(--bg-input);border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
        .github-fm-body{flex:1;overflow-y:auto;padding:16px;min-height:300px;max-height:55vh}
        .github-fm-footer{padding:10px 16px;background:var(--bg-input);border-top:1px solid var(--border)}
        .github-fm-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg-input);border-radius:8px;margin-bottom:6px;cursor:pointer;border:1px solid var(--border);transition:all 0.2s}
        .github-fm-item:hover{background:var(--bg-hover);border-color:var(--accent2);transform:translateX(4px)}
        .github-fm-item.folder{border-left:3px solid var(--gold)}
        .github-fm-item.file{border-left:3px solid var(--accent2)}
        .github-fm-item-icon{font-size:24px;width:32px;text-align:center}
        .github-fm-item-info{flex:1}
        .github-fm-item-name{font-weight:600;font-size:13px;color:var(--text)}
        .github-fm-item-size{font-size:10px;color:var(--text-dim)}
        .github-fm-item-actions{display:flex;gap:4px}
        .github-fm-action-btn{padding:4px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:10px;font-family:inherit}
        .github-fm-action-btn.delete{color:var(--red);border-color:var(--red)}
        .github-fm-action-btn.view{color:var(--accent2);border-color:var(--accent2)}
        .github-fm-editor{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:95vw;max-width:800px;max-height:85vh;background:#1a1a2e;border-radius:16px;border:2px solid #10b981;z-index:999999;display:none;flex-direction:column;overflow:hidden}
        .github-fm-editor.show{display:flex}
        .github-fm-editor-header{padding:14px 20px;background:linear-gradient(135deg,#1a1a2e,#0d3d2e);border-bottom:1px solid #10b981;display:flex;justify-content:space-between;align-items:center}
        .github-fm-editor-body{padding:20px;overflow-y:auto}
        .github-fm-editor-body input,.github-fm-editor-body textarea{width:100%;padding:10px;background:#0d0d20;border:1px solid #252540;border-radius:8px;color:#e8e8f0;font-size:13px;outline:none;font-family:monospace;margin-bottom:12px}
        .github-fm-editor-body textarea{min-height:300px;resize:vertical}
        /* NEW: Search & Replace Styles */
        .search-replace-bar{display:flex;gap:8px;padding:10px;background:var(--bg-input);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
        .search-replace-bar input{flex:1;min-width:150px;padding:6px 10px;background:#0d0d20;border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none;font-family:monospace}
        .search-replace-bar button{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg-hover);color:var(--text);cursor:pointer;font-size:11px;font-family:inherit;transition:all 0.2s}
        .search-replace-bar button:hover{background:var(--accent);color:white;border-color:var(--accent)}
        .search-replace-bar button.active{background:var(--accent);color:white;border-color:var(--accent)}
        .search-highlight{background:#f59e0b;color:#000;padding:0 2px;border-radius:2px}
        .search-count{font-size:10px;color:var(--text-dim);padding:4px 8px;background:var(--bg-hover);border-radius:4px}
        .find-replace-tools{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
        /* Feature Manifest Styles */
        .feature-manifest-view{background:#0d0d20;border-radius:8px;padding:15px;margin:10px 0;font-family:monospace;font-size:11px;color:#00ff00;border:1px solid #252540;white-space:pre-wrap;word-break:break-all}
        .feature-permission-tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:9px;margin:2px;background:var(--bg-hover);border:1px solid var(--border)}
        .feature-component-tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:9px;margin:2px;background:#1f2f3d;border:1px solid #06b6d4;color:#06b6d4}
        .console-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:95vw;max-width:800px;max-height:85vh;background:#0d0d15;border-radius:16px;border:2px solid #00ff00;z-index:999998;display:none;flex-direction:column;overflow:hidden}
        .console-panel.show{display:flex}
    </style>
</head>
<body>
<header class="header">
    <div class="logo">🎮 YAD Store</div>
    <div class="nav-links">
        <button class="btn btn-primary" onclick="showSection('home')">🏠 Home</button>
        <button class="btn" onclick="showSection('order')">🛒 Order</button>
        <button class="btn" onclick="showSection('status')">📋 Cek Pesanan</button>
        <button class="btn" onclick="openNovelReader()">📚 Novel</button>
        <button class="btn fit-btn" id="fitMenuBtn" onclick="toggleFitMenu()">✨ Fitur ▾</button>
        <button class="btn" id="consoleBtn" onclick="openConsole()" style="display:none;background:#000;color:#00ff00;border:1px solid #00ff00;">🖥️ Console</button>

        <button class="btn" onclick="handleLogin()" id="loginBtn">🔑 Login</button>

</header>

<div class="fit-dropdown" id="fitDropdown">

        <button class="fit-dropdown-item delete" onclick="openFitPanel('delete')">🗑️ Hapus Fitur</button>
        <button class="fit-dropdown-item filemanager" onclick="openGitHubFileManager()">📁 File Manager GitHub</button>

</div>

<div class="fit-panel" id="fitPanel">

</div>

<div class="activity-bar">

    <span>💰 <b id="todayRevenue">Rp 150.000</b></span>
    <span>⭐ 4.9 rating</span>
    <span id="githubStatus" style="color:var(--accent2)">📤 Ready ✅</span>
</div>

<a href="https://wa.me/6283170617054" target="_blank" class="whatsapp-float">💬</a>
<button class="floating-ai" id="floatingAI" onclick="openAIChat()">🧠</button>

<div class="ai-chat-widget" id="aiChatWidget">
    <div class="ai-chat-header" onclick="toggleAIChat()"><span>🧠 YAD AI</span><span id="aiChatToggle">▼</span></div>
    <div class="ai-chat-body" id="aiChatBody">
        <div class="ai-chat-messages" id="aiChatMsgs"><div class="ai-msg system">🤖 Ketik "help" untuk bantuan.</div></div>

            <button class="quick-edit-btn" onclick="quickEdit('wa')">📱 WA</button>
            <button class="quick-edit-btn" onclick="quickEdit('toko')">🏪 Toko</button>
            <button class="quick-edit-btn" onclick="quickEdit('analisis')">🔍 Analisis</button>
            <button class="quick-edit-btn" onclick="quickEdit('push')">📤 Push</button>

            <button onclick="sendAIMsg()">➤</button>

    </div>
</div>

<div class="container">
    <div class="category-tabs">
        <button class="cat-tab active" onclick="filterCategory('all',event)">🎮 Semua</button>
        <button class="cat-tab" onclick="filterCategory('pulsa',event)">📱 Pulsa</button>
        <button class="cat-tab" onclick="filterCategory('data',event)">📶 Data</button>
        <button class="cat-tab" onclick="filterCategory('token',event)">⚡ Token</button>
        <button class="cat-tab" onclick="filterCategory('voucher',event)">🎬 Voucher</button>
        <button class="cat-tab" onclick="filterCategory('ewallet',event)">💳 E-Wallet</button>

async function githubFmLoadFiles(){var body=document.getElementById('githubFmBody');var pathLabel=document.getElementById('githubFMPath');if(pathLabel)pathLabel.textContent='/'+GITHUB_CONFIG.owner+'/'+GITHUB_CONFIG.repo+'/'+githubFmCurrentPath;var backBtn=document.getElementById('githubFmBackBtn');if(backBtn)backBtn.disabled=!githubFmCurrentPath;body.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-dim)"><span class="loading-spinner"></span><p>Loading...</p></div>';try{var api='https://api.github.com/repos/'+GITHUB_CONFIG.owner+'/'+GITHUB_CONFIG.repo+'/contents/'+githubFmCurrentPath;var response=await fetch(api,{headers:{'Authorization':'token '+GITHUB_CONFIG.token,'Accept':'application/vnd.github.v3+json'}});if(!response.ok)throw new Error('API error: '+response.status+' '+(await response.json()).message);var data=await response.json();if(Array.isArray(data)){if(data.length===0){body.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-dim)">📭 Folder kosong</div>';return;}data.sort(function(a,b){if(a.type==='dir'&&b.type!=='dir')return -1;if(a.type!=='dir'&&b.type==='dir')return 1;return a.name.localeCompare(b.name);});body.innerHTML=data.map(function(item){var isFolder=item.type==='dir';var icon=isFolder?'📁':getFileIcon(item.name);var size=isFolder?'':formatFileSize(item.size||0);return '<div class="github-fm-item '+(isFolder?'folder':'file')+'" onclick="'+(isFolder?'githubFmOpenFolder(\''+item.name+'\')':'githubFmViewFile(\''+item.path+'\')')+'"><div class="github-fm-item-icon">'+icon+'</div><div class="github-fm-item-info"><div class="github-fm-item-name">'+escapeHtml(item.name)+'</div><div class="github-fm-item-size">'+size+'</div></div><div class="github-fm-item-actions" onclick="event.stopPropagation()">'+(isFolder?'':'<button class="github-fm-action-btn view" onclick="githubFmViewFile(\''+item.path+'\')">👁</button><button class="github-fm-action-btn" onclick="githubFmEditFile(\''+item.path+'\')">✏️</button>')+'<button class="github-fm-action-btn delete" onclick="githubFmDeleteFile(\''+item.path+'\',\''+(isFolder?'dir':'file')+'\')">🗑</button></div></div>';}).join('');}}catch(error){body.innerHTML='<div style="text-align:center;padding:40px;color:var(--red)">❌ Error: '+escapeHtml(error.message)+'</div>';}}
function githubFmOpenFolder(folderName){githubFmCurrentPath=githubFmCurrentPath?githubFmCurrentPath+'/'+folderName:folderName;githubFmLoadFiles();}
function githubFmBack(){if(!githubFmCurrentPath)return;var parts=githubFmCurrentPath.split('/');parts.pop();githubFmCurrentPath=parts.join('/');githubFmLoadFiles();}
function githubFmRefresh(){githubFmLoadFiles();}
function getFileIcon(filename){var ext=filename.split('.').pop().toLowerCase();var icons={'html':'🌐','css':'🎨','js':'📜','json':'📋','md':'📝','txt':'📄','png':'🖼️','jpg':'🖼️','pdf':'📕','zip':'📦'};return icons[ext]||'📄';}
function formatFileSize(bytes){if(bytes===0)return '0 B';var k=1024;var sizes=['B','KB','MB','GB'];var i=Math.floor(Math.log(bytes)/Math.log(k));return parseFloat((bytes/Math.pow(k,i)).toFixed(1))+' '+sizes[i];}

// Search functionality
function githubFmSearch(){
    var textarea=document.getElementById('githubFmEditContent');
    var searchInput=document.getElementById('githubFmSearchInput');
    var countDisplay=document.getElementById('githubFmSearchCount');
    if(!textarea||!searchInput)return;
    
    var content=textarea.value;
    var query=searchInput.value;
    githubFmSearchState.query=query;
    githubFmSearchState.matches=[];
    githubFmSearchState.currentMatch=-1;
    
    if(!query){
        countDisplay.textContent='0/0';
        // Remove highlights
        textarea.value=content;
        return;
    }
    
    try{
        var flags='g';
        if(!githubFmSearchState.caseSensitive)flags+='i';
        var pattern=githubFmSearchState.regex?new RegExp(query,flags):new RegExp(escapeRegex(query),flags);
        var match;
        while((match=pattern.exec(content))!==null){
            githubFmSearchState.matches.push({start:match.index,end:match.index+match[0].length,text:match[0]});
            if(githubFmSearchState.matches.length>1000)break; // Limit matches
        }
        countDisplay.textContent=githubFmSearchState.matches.length+' ditemukan';
        
        if(githubFmSearchState.matches.length>0){
            githubFmSearchState.currentMatch=0;
            highlightCurrentMatch();
        }
    }catch(e){
        countDisplay.textContent='Invalid regex';
    }
}

function escapeRegex(str){return str.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

function highlightCurrentMatch(){
    var textarea=document.getElementById('githubFmEditContent');
    if(!textarea||!githubFmSearchState.matches.length)return;
    
    var match=githubFmSearchState.matches[githubFmSearchState.currentMatch];
    textarea.focus();
    textarea.setSelectionRange(match.start,match.end);
    
    // Scroll to selection
    var lineHeight=parseInt(getComputedStyle(textarea).lineHeight)||20;
    var lines=textarea.value.substring(0,match.start).split('\n').length;
    textarea.scrollTop=(lines-5)*lineHeight;
    
    updateSearchCount();
}

function updateSearchCount(){
    var countDisplay=document.getElementById('githubFmSearchCount');
    if(countDisplay&&githubFmSearchState.matches.length){
        countDisplay.textContent=(githubFmSearchState.currentMatch+1)+'/'+githubFmSearchState.matches.length;
    }
}

function githubFmFindNext(){
    if(!githubFmSearchState.matches.length){
        githubFmSearch();
        return;
    }
    githubFmSearchState.currentMatch=(githubFmSearchState.currentMatch+1)%githubFmSearchState.matches.length;
    highlightCurrentMatch();
}

function githubFmFindPrev(){
    if(!githubFmSearchState.matches.length){
        githubFmSearch();
        return;
    }
    githubFmSearchState.currentMatch=(githubFmSearchState.currentMatch-1+githubFmSearchState.matches.length)%githubFmSearchState.matches.length;
    highlightCurrentMatch();
}

function githubFmReplaceCurrent(){
    var textarea=document.getElementById('githubFmEditContent');
    var replaceInput=document.getElementById('githubFmReplaceInput');
    if(!textarea||!replaceInput)return;
    
    if(!githubFmSearchState.matches.length){
        githubFmSearch();
        if(!githubFmSearchState.matches.length)return;
    }
    
    var match=githubFmSearchState.matches[githubFmSearchState.currentMatch];
    var replacement=replaceInput.value;
    
    // Apply replacement
    var content=textarea.value;
    content=content.substring(0,match.start)+replacement+content.substring(match.end);
    textarea.value=content;
    
    // Update matches
    var lengthDiff=replacement.length-match.text.length;
    githubFmSearchState.matches.splice(githubFmSearchState.currentMatch,1);
    
    // Adjust subsequent match positions
    for(var i=githubFmSearchState.currentMatch;i<githubFmSearchState.matches.length;i++){
        githubFmSearchState.matches[i].start+=lengthDiff;
        githubFmSearchState.matches[i].end+=lengthDiff;
    }
    
    if(githubFmSearchState.matches.length){
        githubFmSearchState.currentMatch=Math.min(githubFmSearchState.currentMatch,githubFmSearchState.matches.length-1);
        highlightCurrentMatch();
    }else{
        updateSearchCount();
        toast('✅ Semua match diganti','success');
    }
}

function githubFmReplaceAll(){
    var textarea=document.getElementById('githubFmEditContent');
    var searchInput=document.getElementById('githubFmSearchInput');
    var replaceInput=document.getElementById('githubFmReplaceInput');
    if(!textarea||!searchInput||!replaceInput)return;
    
    var query=searchInput.value;
    var replacement=replaceInput.value;
    if(!query)return;
    
    if(!confirm('Ganti semua "'+query+'" dengan "'+replacement+'"?'))return;
    
    var content=textarea.value;
    try{
        var flags='g';
        if(!githubFmSearchState.caseSensitive)flags+='i';
        var pattern=githubFmSearchState.regex?new RegExp(query,flags):new RegExp(escapeRegex(query),flags);
        var count=(content.match(pattern)||[]).length;
        content=content.replace(pattern,replacement);
        textarea.value=content;
        toast('✅ '+count+' replacement berhasil','success');
        githubFmSearch();
    }catch(e){
        toast('❌ Regex error: '+e.message,'error');
    }
}

function toggleSearchOption(option){
    githubFmSearchState[option]=!githubFmSearchState[option];
    var btn=document.getElementById('opt'+option.charAt(0).toUpperCase()+option.slice(1));
    if(btn)btn.classList.toggle('active');
    githubFmSearch();
}

function githubFmUndoEdit(){
    var editor=document.getElementById('githubFmEditor');
    var original=editor.getAttribute('data-original-content');
    var textarea=document.getElementById('githubFmEditContent');
    if(textarea&&original){
        textarea.value=original;
        githubFmSearch();
        toast('↩️ Dikembalikan ke versi asli','info');
    }
}

async function githubFmSaveFile(path,sha){
    try{
        var textarea=document.getElementById('githubFmEditContent');
        var commitInput=document.getElementById('githubFmEditCommit');
        var content=textarea.value;
        var commitMsg=commitInput?commitInput.value:'Update '+path;
        
        if(!content.trim()){toast('❌ Content kosong!','error');return;}
        
        // Validate content
        try{
            JSON.stringify(content);
        }catch(e){
            toast('❌ Content tidak valid','error');
            return;
        }
        
        var b64=btoa(unescape(encodeURIComponent(content)));
        var api='https://api.github.com/repos/'+GITHUB_CONFIG.owner+'/'+GITHUB_CONFIG.repo+'/contents/'+path;
        var response=await fetch(api,{
            method:'PUT',
            headers:{
                'Authorization':'token '+GITHUB_CONFIG.token,
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                message:commitMsg,
                content:b64,
                sha:sha,
                branch:GITHUB_CONFIG.branch
            })
        });
        
        if(!response.ok){
            var error=await response.json();
            throw new Error(error.message||'Failed to save');
        }
        
        toast('✅ File saved!','success');
        document.getElementById('githubFmEditor').classList.remove('show');
        githubFmLoadFiles();
    }catch(error){
        toast('❌ Error: '+error.message,'error');
    }
}

async function githubFmDeleteFile(path,type){
    var confirmMsg=type==='dir'?'Hapus folder "'+path+'" ?':'Hapus file "'+path+'" ?';
    if(!confirm(confirmMsg))return;
    try{
        var api='https://api.github.com/repos/'+GITHUB_CONFIG.owner+'/'+GITHUB_CONFIG.repo+'/contents/'+path;
        var response=await fetch(api,{headers:{'Authorization':'token '+GITHUB_CONFIG.token}});
        if(!response.ok)throw new Error('Error: '+response.status);
        var data=await response.json();
        var deleteResponse=await fetch(api,{
            method:'DELETE',
            headers:{
                'Authorization':'token '+GITHUB_CONFIG.token,
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                message:'Delete '+path,
                sha:data.sha,
                branch:GITHUB_CONFIG.branch
            })
        });
        if(!deleteResponse.ok)throw new Error('Failed to delete');
        toast('✅ File deleted!','success');
        githubFmLoadFiles();
    }catch(error){
        toast('❌ Error: '+error.message,'error');
    }
}

function githubFmUpload(){
    if(!S.admin)return;
    var input=document.createElement('input');
    input.type='file';
    input.onchange=async function(e){
        var file=e.target.files[0];
        if(!file)return;
        if(file.size>1024*1024){
            toast('❌ File terlalu besar (max 1MB)','error');
            return;
        }
        var fullPath=githubFmCurrentPath?githubFmCurrentPath+'/'+file.name:file.name;
        try{
            var reader=new FileReader();
            reader.onload=async function(e){
                try{
                    var content=e.target.result;
                    // For text files, read as text; for binary, use base64
                    var b64;
                    if(file.type.startsWith('text/')||['.html','.css','.js','.json','.txt','.md'].some(function(ext){return file.name.endsWith(ext);})){
                        b64=btoa(unescape(encodeURIComponent(content)));
                    }else{
                        // Binary file - use array buffer
                        var arrayBuffer=await file.arrayBuffer();
                        var bytes=new Uint8Array(arrayBuffer);
                        var binary='';
                        for(var i=0;i<bytes.length;i++){
                            binary+=String.fromCharCode(bytes[i]);
                        }
                        b64=btoa(binary);
                    }
                    
                    var api='https://api.github.com/repos/'+GITHUB_CONFIG.owner+'/'+GITHUB_CONFIG.repo+'/contents/'+fullPath;
                    var response=await fetch(api,{
                        method:'PUT',
                        headers:{
                            'Authorization':'token '+GITHUB_CONFIG.token,
                            'Content-Type':'application/json'
                        },
                        body:JSON.stringify({
                            message:'Upload '+file.name,
                            content:b64,
                            branch:GITHUB_CONFIG.branch
                        })
                    });
                    if(!response.ok){
                        var error=await response.json();
                        throw new Error(error.message||'Failed to upload');
                    }
                    toast('✅ File uploaded!','success');
                    githubFmLoadFiles();
                }catch(error){
                    toast('❌ Error: '+error.message,'error');
                }
            };
            
            if(file.type.startsWith('text/')||['.html','.css','.js','.json','.txt','.md'].some(function(ext){return file.name.endsWith(ext);})){
                reader.readAsText(file);
            }else{
                reader.readAsArrayBuffer(file);
            }
        }catch(error){
            toast('❌ Error: '+error.message,'error');
        }
    };
    input.click();
}

var isListening=false,recognition=null;
function toggleVoice(){if(isListening){stopVoice();}else{startVoice();}}
function startVoice(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){toast('❌ Browser tidak mendukung voice recognition','error');return;}
    recognition=new SR();
    recognition.lang='id-ID';
    recognition.interimResults=true;
    recognition.onstart=function(){isListening=true;var b=document.getElementById('voiceBtn');if(b){b.textContent='🔴';b.classList.add('listening');}};
    recognition.onresult=function(e){var transcript='';for(var i=e.resultIndex;i<e.results.length;i++){transcript+=e.results[i][0].transcript;}var input=document.getElementById('aiChatInput');if(input&&transcript){input.value=transcript;input.focus();}};
    recognition.onend=function(){stopVoice();};
    recognition.onerror=function(e){stopVoice();if(e.error==='not-allowed'){toast('❌ Izin mikrofon ditolak','error');}};
    recognition.start();
}
function stopVoice(){if(recognition){try{recognition.stop();}catch(e){}}isListening=false;var b=document.getElementById('voiceBtn');if(b){b.textContent='🎤';b.classList.remove('listening');}}

async function runAutoFix(){
    try{
        var fixed=0;
        var issues=[];
        
        // Check for duplicate features
        var seen={};
        S.features=S.features.filter(function(f){
            if(seen[f.name]){
                issues.push('Duplicate feature: '+f.name);
                fixed++;
                return false;
            }
            seen[f.name]=true;
            return true;
        });
        
        // Check for invalid orders
        S.orders=S.orders.filter(function(o){
            if(!o.id||!o.game||!o.item||!o.price){
                issues.push('Invalid order removed');
                fixed++;
                return false;
            }
            return true;
        });
        
        // Save fixed data
        localStorage.setItem('yad_features_manifest',JSON.stringify(S.features));
        localStorage.setItem('store_orders',JSON.stringify(S.orders));
        
        toast('🔧 AutoFix: '+fixed+' issues fixed','success');
        if(issues.length){
            consolePrint('AutoFix issues: '+issues.join(', '),'debug');
        }
        return{fixed:fixed,issues:issues};
    }catch(e){
        toast('❌ AutoFix error: '+e.message,'error');
        return{fixed:0,issues:[e.message]};
    }
}

async function runOptimize(){
    try{
        var cleaned=0;
        
        // Clean up old orders (keep last 100)
        if(S.orders.length>100){
            var removed=S.orders.length-100;
            S.orders=S.orders.slice(0,100);
            cleaned+=removed;
            localStorage.setItem('store_orders',JSON.stringify(S.orders));
        }
        
        // Clean up features
        var validFeatures=S.features.filter(function(f){
            if(!f.name||!f.code){
                cleaned++;
                return false;
            }
            return true;
        });
        S.features=validFeatures;
        localStorage.setItem('yad_features_manifest',JSON.stringify(S.features));
        
        // Clean localStorage
        var keys=Object.keys(localStorage);
        var now=Date.now();
        keys.forEach(function(key){
            if(key.startsWith('temp_')||key.startsWith('cache_')){
                try{
                    var data=JSON.parse(localStorage.getItem(key));
                    if(data&&data.timestamp&&(now-data.timestamp)>86400000){
                        localStorage.removeItem(key);
                        cleaned++;
                    }
                }catch(e){}
            }
        });
        
        toast('🔧 Optimize: '+cleaned+' items cleaned','success');
        return{cleaned:cleaned};
    }catch(e){
        toast('❌ Optimize error: '+e.message,'error');
        return{cleaned:0};
    }
}

function updateManifestPreview(){

    var manifest='<feature>\n  <manifest package="'+name+'" version="'+version+'" label="'+label+'">\n    <uses-permission android:name="'+permStr.join('" />\n    <uses-permission android:name="')+'" />\n    <application android:process="'+process+'">\n      <component type="'+componentType+'" />\n    </application>\n  </manifest>\n</feature>';

function saveFitFromPanel(){
    try{
        var name=document.getElementById('fitName').value.trim();
        var label=document.getElementById('fitLabel').value.trim();
        var version=document.getElementById('fitVersion').value.trim()||'1.0.0';
        var permissions=document.getElementById('fitPermissions').value.split(',').map(function(p){return p.trim();}).filter(Boolean);
        var process=document.getElementById('fitProcess').value;
        var componentType=document.getElementById('fitComponentType').value;
        var code=document.getElementById('fitCode').value.trim();
        
        if(!name||!code){toast('❌ Lengkapi nama dan kode!','error');return;}
        
        var feature={
            name:name,
            label:label||name,
            version:version,
            permissions:permissions,
            process:process,
            componentType:componentType,
            code:code,
            status:'active',
            created:new Date().toISOString()
        };
        
        S.features=S.features.filter(function(f){return f.name!==name;});
        S.features.push(feature);
        localStorage.setItem('yad_features_manifest',JSON.stringify(S.features));
        renderFeature(feature);
        closeFitPanel();
        toast('✅ Fitur "'+label+'" ditambahkan!','success');
        consolePrint('Feature added: '+name,'debug');
    }catch(e){
        toast('❌ Error: '+e.message,'error');
    }
}

function renderFeature(feature){
    try{
        // Remove existing feature elements
        var existing=document.querySelectorAll('[data-feature-manifest="'+feature.name+'"]');
        existing.forEach(function(el){el.remove();});
        
        // Create container for feature code
        var container=document.createElement('div');
        container.setAttribute('data-feature-manifest',feature.name);
        container.style.display='none';
        container.innerHTML=feature.code;
        document.body.appendChild(container);
        
        if(feature.componentType==='button'){
            var btn=document.createElement('button');
            btn.className='btn';
            btn.setAttribute('data-feature-manifest',feature.name);
            btn.textContent=feature.label;
            btn.onclick=function(){
                var el=document.querySelector('[data-feature-manifest="'+feature.name+'"]');
                if(el&&el.innerHTML){
                    // Use safe evaluation instead of direct eval
                    try{
                        var scripts=el.getElementsByTagName('script');
                        for(var i=0;i<scripts.length;i++){
                            safeEval(scripts[i].textContent);
                        }
                    }catch(e){
                        console.error('Feature execution error:',e);
                    }
                }
            };
            // Add to nav links
            var navLinks=document.querySelector('.nav-links');
            if(navLinks)navLinks.appendChild(btn);
        }
        else if(feature.componentType==='widget'){
            var widget=document.createElement('div');
            widget.setAttribute('data-feature-manifest',feature.name);
            widget.innerHTML=feature.code;
            document.body.appendChild(widget);
        }
        else if(feature.componentType==='panel'){
            var panel=document.createElement('div');
            panel.setAttribute('data-feature-manifest',feature.name);
            panel.className='fit-panel';
            panel.innerHTML=feature.code;
            document.body.appendChild(panel);
        }
        // Script only - just store the code
    }catch(e){
        console.error('Error rendering feature:',e);
        toast('❌ Error rendering feature: '+e.message,'error');
    }
}

function deleteFitByIndex(idx){
    if(!S.admin)return;
    var feature=S.features[idx];
    if(!feature)return;
    if(!confirm('Hapus fitur "'+(feature.label||feature.name)+'"?'))return;
    document.querySelectorAll('[data-feature-manifest="'+feature.name+'"]').forEach(function(el){el.remove();});
    S.features.splice(idx,1);
    localStorage.setItem('yad_features_manifest',JSON.stringify(S.features));
    openFitPanel(fitMode);
    toast('🗑️ Fitur dihapus','success');
}

function deleteAllFits(){
    if(!S.admin)return;
    if(!S.features.length)return;
    if(!confirm('Hapus SEMUA fitur ('+S.features.length+')?'))return;
    document.querySelectorAll('[data-feature-manifest]').forEach(function(el){el.remove();});
    S.features=[];
    localStorage.setItem('yad_features_manifest','[]');
    closeFitPanel();
    toast('✅ Semua fitur dihapus','success');
}

// ================================================================
// PAYMENT MANAGEMENT
// ================================================================
function openPaymentForm(){
    if(!S.admin)return toast('❌ Admin only!','error');
    var panel=document.getElementById('paymentFormPanel');
    if(!panel){
        panel=document.createElement('div');
        panel.id='paymentFormPanel';
        panel.className='fit-panel';
        panel.innerHTML='<div class="fit-panel-dialog"><div class="fit-panel-header"><h3 style="color:#fff;font-size:16px;margin:0">💳 Tambah Metode Pembayaran</h3><span onclick="closePaymentForm()" style="cursor:pointer;font-size:22px;color:#9090a8">×</span></div><div class="fit-panel-body"><label>Nama Metode</label><input id="payName" placeholder="Contoh: DANA, OVO, dll"><label>Nomor</label><input id="payNumber" placeholder="Nomor rekening/HP"></div><div style="padding:12px;background:#0d0d20;border-top:1px solid #252540;display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closePaymentForm()">Batal</button><button class="btn btn-primary" onclick="savePayment()">💾 Simpan</button></div></div>';
        document.body.appendChild(panel);
    }
    panel.classList.add('show');
}
function closePaymentForm(){var panel=document.getElementById('paymentFormPanel');if(panel)panel.classList.remove('show');}
function savePayment(){
    try{
        var n=document.getElementById('payName').value.trim();
        var num=document.getElementById('payNumber').value.trim();
        if(!n||!num)return toast('❌ Lengkapi!','error');
        S.paymentMethods.push({name:n,number:num,holder:'YAD Store'});
        localStorage.setItem('store_payments',JSON.stringify(S.paymentMethods));
        renderPayments();
        closePaymentForm();
        toast('✅ '+n+' ditambahkan!','success');
    }catch(e){
        toast('❌ Error: '+e.message,'error');
    }
}

// ================================================================
// INITIALIZE
// ================================================================
(function init(){
    try{
        renderGames('all');
        renderPayments();
        addLive('🛒 Sistem online');
        
        // Load saved features
        S.features.forEach(function(feature){
            if(feature.status==='active'){
                renderFeature(feature);
            }
        });
        
        // Update online count periodically
        setInterval(function(){
            var count=87+Math.floor(Math.random()*20);
            document.getElementById('onlineCount').textContent=count;
        },30000);
        
        // Live feed simulation
        setInterval(function(){
            var actions=['📱 Pulsa 10K','🎮 ML 86 Diamonds','📶 Data 5GB','⚡ Token 50K','💳 E-Wallet 20K'];
            var action=actions[Math.floor(Math.random()*actions.length)];
            addLive('✅ '+action);
        },15000);
        
        // Auto-save orders periodically
        setInterval(function(){
            localStorage.setItem('store_orders',JSON.stringify(S.orders));
        },60000);
        
        consolePrint('System initialized','terminal');
        consolePrint('Products loaded: '+Object.keys(ALL_PRODUCTS).length+' categories','debug');
    }catch(e){
        console.error('Init error:',e);
        toast('❌ Init error: '+e.message,'error');
    }
})();
</script>
